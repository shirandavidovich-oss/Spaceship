plugins {
    id "com.android.application"
}

android {
    namespace "com.shiran.spaceship"
    compileSdk 34

    defaultConfig {
        applicationId "com.shiran.spaceship"
        minSdk 26
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "0.9"
    }

    // Two editions, side by side on one phone (each updates the game from GitHub the same way):
    //   dev:  "Orbit Break DEV", the test hangar on (the id the first builds had, so it installs over them)
    //   play: "Orbit Break", for players: no test hangar
    flavorDimensions "edition"
    productFlavors {
        dev {
            dimension "edition"
            resValue "string", "app_name", "Orbit Break DEV"
            resValue "bool", "release_build", "false"
        }
        play {
            dimension "edition"
            applicationId "com.shiran.orbitbreak"
            resValue "string", "app_name", "Orbit Break"
            resValue "bool", "release_build", "true"
        }
    }

    // One fixed key, so each new build installs over the previous one.
    signingConfigs {
        debug {
            storeFile file("signing/ship-debug.ks")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // direct phone-to-phone link
    implementation "com.google.android.gms:play-services-nearby:19.3.0"
    implementation "androidx.annotation:annotation:1.8.2"
}
