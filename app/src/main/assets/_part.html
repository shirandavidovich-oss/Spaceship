<!DOCTYPE html><html><body style="margin:0;background:#223">
<script type="importmap">{"imports":{"three":"./lib/three/three.module.js"}}</script>
<canvas id="c" width="1600" height="840"></canvas>
<script type="module">
import { Ship3D } from "./lib/ship3d-v35.js";
const c = document.getElementById("c").getContext("2d"), ids = location.hash.slice(1).split(","), W = 400, sc = 500;
const go = () => { if (!ids.every((i) => Ship3D.ready(i))) return setTimeout(go, 200);
  ids.forEach((id, i) => { for (const v of [0, 1]) { const col = (i % 2) * 2 + v, cx = 200 + col * W, cy = 210 + Math.floor(i / 2) * 420;
    c.save(); c.beginPath(); c.rect(cx - 200, cy - 210, 400, 420); c.clip(); c.save(); c.translate(cx, cy); c.scale(sc, sc); Ship3D.draw(c, id, 0, 0, v ? Math.PI / 2 - 0.001 : 0); c.restore();
    c.strokeStyle = "rgba(255,255,0,0.35)"; c.lineWidth = 1; for (let k = -8; k <= 8; k++) { c.beginPath(); c.moveTo(cx + k * 25, cy - 210); c.lineTo(cx + k * 25, cy + 210); c.stroke(); c.beginPath(); c.moveTo(cx - 200, cy + k * 25); c.lineTo(cx + 200, cy + k * 25); c.stroke(); }
    c.strokeStyle = "red"; c.beginPath(); c.moveTo(cx, cy - 210); c.lineTo(cx, cy + 210); c.moveTo(cx - 200, cy); c.lineTo(cx + 200, cy); c.stroke(); c.fillStyle = "#fff"; c.font = "15px sans-serif"; c.fillText(id + (v ? " tail" : " top"), cx - 190, cy - 192); c.restore(); } });
  window.done = true; };
go();
</script></body></html>
