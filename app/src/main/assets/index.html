//  SETTINGS  (the numbers worth playing with)

const DEAD_ZONE  = 4;    // degrees around HOLD_ANGLE (and around level side-to-side) that still count as "still"
const FULL_TILT  = 22;   // degrees past the dead zone that give full engine power

const SWIPE_UP   = 0.18; // swipe-up length (part of the screen height) that asks to trade

// a numbered run of drawings: name_01.webp ... with each frame's ms, and cues on chosen frames ({ 10: "fire" })
function frames(name, count, ms, cues = {}) {
  return Array.from({ length: count }, (_, i) => {
    const n = i + 1, f = [name + "_" + String(n).padStart(2, "0") + ".webp", ms(n)];
    if (cues[n]) f.push(cues[n]);
    return f;
  });
}

// ---- weapons ----

// A destroyed enemy drops its weapon in a crate: fly into it and button 3 appears,
// with that weapon's ammo. That one does not refill: when it is empty, button 3 goes away.
//   dmg: damage per hit   speed: screens per second   life: seconds a shot lasts   cool: seconds between shots
//   ammo: shots in a full tank   refill: seconds to fill an empty tank (none = a picked-up weapon)
//   homing: how hard it turns toward the enemy   pellets/fan: several shots at once, spread over `fan` radians
const WEAPONS = {

             egg: true, swarm: 3, hunterSpeed: 1.7, hunterTurn: 4, hunterLife: 4.5 },

};
const LOOT = ["laser", "missile", "spread"];

// ---- magic (its own button, not a weapon; each ship's magic button looks like the ship's style) ----
//   pour: seconds of smoke pouring out   hide: seconds the enemy loses track of you   cool: seconds until it can be used again
const MAGIC = {
  smoke: { name: "מסך עשן", pour: 3.5, hide: 6, cool: 14, look: "gear", color: "#e0b060" },
  // the tail: grows out behind the ship over `out` seconds, stays `hold`, pulls back in over `back`.
  //   len: its full length in ship-lengths   drain: health per second taken from a ship touching it
  tail:  { name: "זנב עוקץ", out: 1.0, hold: 1.4, back: 0.9, len: 3.2, drain: 28, cool: 9, look: "tail", color: "#b8ff3a" }
};
// how much of the tail is out at time t (seconds since the button): 0..1, or -1 once it is back in
function tailOut(M, t) {
  if (t < 0) return 0;
  if (t < M.out) return 1 - Math.pow(1 - t / M.out, 2);
  if (t < M.out + M.hold) return 1;
  if (t < M.out + M.hold + M.back) return 1 - Math.pow((t - M.out - M.hold) / M.back, 2);
  return -1;
}
// how the steam engine misbehaves (chances per second while the engine runs)
const STEAM = { dies: 0.09, out: [0.5, 1.3], backfire: 0.35, creak: 0.3 };
// crash damage for an impact at `speed` screens per second (gentle bumps do nothing)
function ramDamage(speed) { return speed <= 0.25 ? 0 : Math.round(RAM_DAMAGE * Math.min(1, (speed - 0.25) / 1.25)); }
// the joystick: thumb moved dx, dy (pixels) from where it pressed, on a button of radius r.
// Returns the heading to point the nose at (0 = up, clockwise), or null inside the small middle (keep heading)
function stickHeading(dx, dy, r) { return Math.hypot(dx, dy) < r * STICK ? null : Math.atan2(dx, -dy); }
// can the enemy see you? Not while you are hidden in your smoke
function enemySees(hidden) { return !(hidden > 0); }
// what a ship drops when it is destroyed
function lootOf(S) { return S.drop || LOOT[Math.max(0, SHIPS.indexOf(S)) % LOOT.length]; }
function weaponsOf(S) { return S.weapons || ["twin", "iris"]; }
// where each weapon's shots leave the ship (ship units, nose up). Without a drawing: from the nose
function gunsOf(S, w) { return (S.guns && S.guns[w]) || (w === "twin" ? [[-0.06, -0.5], [0.06, -0.5]] : [[0, -0.5]]); }
// a point on the ship, turned with the ship (ang: 0 = nose up, clockwise)
function rotatePt(x, y, ang) { const c = Math.cos(ang), s = Math.sin(ang); return { x: x * c - y * s, y: x * s + y * c }; }
// ammo for one moment: the ship's own weapons fill back up, a picked-up one does not
function ammoStep(ammo, W, dt) { return W.refill ? Math.min(W.ammo, ammo + W.ammo / W.refill * dt) : ammo; }
// the directions of one trigger pull (one shot, or a fan of pellets)
function pelletAngles(W) {
  const n = W.pellets || 1;
  if (n === 1) return [0];
  return Array.from({ length: n }, (_, i) => (i / (n - 1) - 0.5) * W.fan);
}
// ---- firing animations (frames with durations; time in ms, so they run the same at any screen speed) ----
function seqLength(seq) { return seq.reduce((a, f) => a + f[1], 0); }
// which frame shows at time t (-1 = finished: back to idle)
function seqFrame(seq, t) { let a = 0; for (let i = 0; i < seq.length; i++) { a += seq[i][1]; if (t < a) return i; } return -1; }
// when the frame carrying `cue` starts
function cueTime(seq, cue) { let a = 0; for (const f of seq) { if (f[2] === cue) return a; a += f[1]; } return -1; }
// a homing shot turns its flight toward the target by at most `turn` radians, keeping its speed
function steerShot(vx, vy, tx, ty, turn) {
  const sp = Math.hypot(vx, vy) || 1, a = Math.atan2(vy, vx), want = Math.atan2(ty, tx);
  let d = want - a; d = Math.atan2(Math.sin(d), Math.cos(d));
  const b = a + Math.max(-turn, Math.min(turn, d));
  return { vx: Math.cos(b) * sp, vy: Math.sin(b) * sp };
}

// The gift's surprise: rarity by its odds, then one ship of that rarity.
function chooseShip(rand = Math.random) {
  const total = Object.values(RARITY).reduce((a, r) => a + r.odds, 0);
  let k = rand() * total, pick = "common";
  for (const [name, r] of Object.entries(RARITY)) { if (k < r.odds) { pick = name; break; } k -= r.odds; }
  const pool = SHIPS.filter((s) => s.rarity === pick);
  return pool[Math.min(pool.length - 1, Math.floor(rand() * pool.length))].id;
}

// Phone tilt -> engine power. g = the gravity sensor (x right, y up the screen, z out of the screen).
// pitch: 0 = lying flat, 90 = standing upright. At HOLD_ANGLE the ship gets no push.
function tiltOf(gx, gy, gz) {
  const m = Math.hypot(gx, gy, gz) || 1;
  const x = gx / m, y = gy / m, z = gz / m;
  return { pitch: Math.atan2(y, z) * 180 / Math.PI, roll: Math.asin(Math.max(-1, Math.min(1, -x))) * 180 / Math.PI };
}
function shape(deg) {
  const a = Math.abs(deg) - DEAD_ZONE;
  if (a <= 0) return 0;
  return Math.sign(deg) * Math.min(1, a / FULL_TILT);
}
// returns { side, fwd } in -1..1. fwd > 0: top of the phone tipped away from you -> ship flies up the screen
function controlFromTilt(t) {
  if (t.pitch < -30 || t.pitch > 120) return { side: 0, fwd: 0 };   // phone upside down or face down: no control
  return { side: shape(t.roll), fwd: shape(HOLD_ANGLE - t.pitch) };
}

// ---- Star-Control-style flying ----
// Angles: 0 = nose up the screen, growing clockwise (90 = nose to the right).
const TAU = Math.PI * 2;
function wrapAngle(a) { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; }
// the way the tilt points (null when the phone is at its usual angle: keep the current heading)
function headingTarget(c) { return c.side || c.fwd ? Math.atan2(c.side, c.fwd) : null; }
// turn from a toward target by at most `step`, the short way round
function turnToward(a, target, step) { const d = wrapAngle(target - a); return a + Math.max(-step, Math.min(step, d)); }
// space wraps around: the shortest way from one point to another along one axis
function wrapDelta(d, size) { return d - size * Math.round(d / size); }
// the planet's pull on a ship dx, dy away from it (pixels). u = one screen-width. r below the surface counts as the surface
function gravityAt(dx, dy, u, surface) {
  const d = Math.hypot(dx, dy) || 1, r = Math.max(d, surface);
  // weaker with distance; inside one screen it stays the same, and always below every engine's push,
  // so a ship can always fly away from the planet
  const a = PULL * u / Math.max(1, (r / u) * (r / u));
  return { ax: -dx / d * a, ay: -dy / d * a };
}
// each ship's numbers (units: screens and seconds)
function shipStats(S) {
  return {
    fuel: S.fuel || 30,
    refill: S.refill || 15,
    turn: (S.turn || Math.round(300 / S.mass)) * Math.PI / 180,        // radians per second
    push: (0.7 + 0.15 * S.nozzles.length) / S.mass,                      // engine push
    top: 1.3 + 0.25 * S.nozzles.length - 0.3 * S.mass                    // top speed
  };
}
// fuel for one moment: burns while the engine is on, fills back up while it rests.
// Running dry locks the engine until the tank is UNLOCK full again.
function fuelStep(fuel, locked, burning, st, dt) {
  if (burning && !locked && fuel > 0) {
    fuel = Math.max(0, fuel - dt);
    return { fuel, locked: fuel === 0 };
  }
  fuel = Math.min(st.fuel, fuel + st.fuel / st.refill * dt);
  return { fuel, locked: locked && fuel < st.fuel * UNLOCK };
}

// The enemy's pilot. e = enemy, p = player (x, y, vx, vy in pixels), st = enemy's numbers,
// w = { ww, wh: size of space, u: one screen-width, planetR }. Returns the same controls a player gives.
function enemyControl(e, p, st, w) {
  const dx = wrapDelta(p.x - e.x, w.ww), dy = wrapDelta(p.y - e.y, w.wh), d = Math.hypot(dx, dy) || 1;
  const keep = ENEMY_KEEP * w.u, top = st.top * w.u * 0.75;
  let wx, wy;   // the speed and direction it would like to have
  if (d > keep) {
    const k = Math.min(1, (d - keep) / w.u);
    wx = dx / d * top * k + p.vx * 0.5; wy = dy / d * top * k + p.vy * 0.5;
  } else {        // close enough: circle around you and back off a little
    const back = (keep - d) / keep;
    wx = p.vx - dy / d * top * 0.3 - dx / d * top * 0.5 * back;
    wy = p.vy + dx / d * top * 0.3 - dy / d * top * 0.5 * back;
  }
  // look one second ahead: about to hit the planet? get away from it first
  const px = wrapDelta(e.x + e.vx - w.ww / 2, w.ww), py = wrapDelta(e.y + e.vy - w.wh / 2, w.wh);
  const pd = Math.hypot(px, py) || 1, danger = w.planetR * 2.4;
  if (pd < danger) { const k = (danger - pd) / danger; wx += px / pd * top * 2 * k; wy += py / pd * top * 2 * k; }
  const ex = wx - e.vx, ey = wy - e.vy;
  if (Math.hypot(ex, ey) < w.u * 0.08) return { target: Math.atan2(dx, -dy), turn: 1, thrust: false };   // nothing to fix: face the player
  const target = Math.atan2(ex, -ey), off = Math.abs(wrapAngle(target - e.ang));
  return { target, turn: 1, thrust: off < 0.45 && !e.locked && (e.fuel > st.fuel * 0.25 || pd < danger) };
}

// the thrust button's color for the fuel left (1 = full = white ... 0 = empty = black)
const FUEL_COLORS = [[1, "#ffffff"], [0.82, "#fff275"], [0.64, "#ff9f1c"], [0.46, "#ef233c"], [0.3, "#b5179e"], [0.15, "#3a0ca3"], [0, "#000000"]];
function fuelColor(f) {
  f = Math.max(0, Math.min(1, f));
  for (let i = 1; i < FUEL_COLORS.length; i++) {
    const [f1, c1] = FUEL_COLORS[i - 1], [f0, c0] = FUEL_COLORS[i];
    if (f >= f0) {
      const k = (f - f0) / (f1 - f0), a = parseInt(c0.slice(1), 16), b = parseInt(c1.slice(1), 16);
      const mix = (s) => Math.round(((a >> s) & 255) + (((b >> s) & 255) - ((a >> s) & 255)) * k);
      return "#" + ((1 << 24) | (mix(16) << 16) | (mix(8) << 8) | mix(0)).toString(16).slice(1);
    }
  }
  return "#000000";
}

    const b = hitFire(e.clientX, e.clientY);

      game.fire[b.i] = e.pointerId; buzz(8);
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}

    }
  }
  swipe ={ id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() };

addEventListener("blur", () => { game.thrust = null; game.stick = null; game.fire = [null, null, null]; });
// on a computer: the space bar is the thrust button; Z, X, C are fire buttons 1, 2, 3
const FIRE_KEYS = ["z", "x", "c"];
addEventListener("keydown", (e) => {
  if (e.key === " " && game.stage === "fly" && !game.locked) game.thrust = "key";
  const f = FIRE_KEYS.indexOf(e.key.toLowerCase());
  if (f >= 0 && game.stage === "fly") game.fire[f] = "key";
  if (e.key.toLowerCase() === "v" && game.stage === "fly") useMagic();   // V = the magic button
});
addEventListener("keyup", (e) => {
  if (e.key === " " && game.thrust === "key") game.thrust = null;
  const f = FIRE_KEYS.indexOf(e.key.toLowerCase());
  if (f >= 0 && game.fire[f] === "key") game.fire[f] = null;
});

// Android back: close the bubble or card first, then leave
window.shipBack = () => {
  if (trade.stage && trade.stage !== "swapping") { if (trade.stage === "offer" || trade.stage === "waiting") link.send({ t: "no" }); endTrade(); return true; }
  if (game.card > 0) { game.card = 0; return true; }
  return false;
};

// ======================================================================
//  THE GIFT
// ======================================================================
function giftBox() { const s = U * 0.42; return { cx: W / 2, cy: H * 0.52, s }; }
function hitGift(x, y) { const g = giftBox(); return Math.abs(x - g.cx) < g.s * 0.65 && Math.abs(y - g.cy) < g.s * 0.7; }
function tapGift() {
  gift.taps++; gift.wob = 1; gift.squash = 1; gift.hint = 0;
  const g = giftBox();
  burst(g.cx, g.cy - g.s * 0.3, 8 + gift.taps * 6, ["#ffd166", "#c77dff", "#ffffff"], 0.6, 0.8);
  audio.tap(gift.taps); buzz(20 + gift.taps * 15);
  if (gift.taps >= GIFT_TAPS) {
    // decided now and saved at once, so closing the app mid-animation keeps the same ship
    game.ship = TRY_SHIP || chooseShip();
    saveShip(game.ship, "gift");
    game.stage = "opening"; game.t = 0;
    audio.open(); buzz(80);
  }
}
function toFly() {
  game.stage = "fly"; game.t = 0;
  game.fuel = shipStats(shipById(game.ship)).fuel; game.locked = false;
  fillAmmo();
  game.card = 0;
  spawnEnemy();
}

// ======================================================================
//  UPDATE
// ======================================================================
function shipSize() { return U * 0.26; }

function update(dt) {
  time += dt; game.t += dt;
  updateSimTilt(dt);
  gift.wob = Math.max(0, gift.wob - dt * 2.2);
  gift.squash = Math.max(0, gift.squash - dt * 5);
  if (game.stage === "gift") gift.hint += dt;
  game.card = Math.max(0, game.card - dt);

  const c = controlFromTilt(tilt);
  game.side = c.side; game.fwd = c.fwd;


  if (game.stage === "opening") {
    if (game.t > 1.25 && !game.burstDone) {
      game.burstDone = true;
      const R = RARITY[shipById(game.ship).rarity], g = giftBox();
      burst(g.cx, H * 0.4, 50 + R.stars * 25, [R.color, "#ffffff", shipById(game.ship).hull], 1.2, 1.2);
      audio.reveal(R.stars); buzz(40 * R.stars);
    }
    if (game.t > 6) toFly();
  }
  if (game.stage === "arrive" && game.t > 0.9) { game.stage = "fly"; game.t = 0; spawnEnemy(); }

  game.shakeT = Math.max(0, game.shakeT - dt * 2.5);
  game.hurt = Math.max(0, game.hurt - dt);
  game.arriveT = Math.max(0, (game.arriveT || 0) - dt * 1.5);
  if (game.stage === "fly" && trade.stage !== "swapping") {
    if (game.dead) { game.dead -= dt; game.thrust = null; game.stick = null; game.fire = [null, null, null]; if (game.dead <= 0) respawnShip(); }
    else { flyShip(dt); updateMagic(dt); }
    updateEnemy(dt); updateWeapons(dt); if (!game.dead) updateCrate(dt);
  }
  updateTrade(dt);

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    if (p.w) { p.x += (p.dx || 0) * dt; p.y += (p.dy || 0) * dt; }
    if (p.life > p.max) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.exp(-dt * 2.5); p.vy *= Math.exp(-dt * 2.5);
  }
}

// The player's ship: the tilt points the nose, the left thumb fires the engine
function flyShip(dt) {
  const S = shipById(game.ship), st = shipStats(S);
  let target = null, turn = 0;
  if (STEER === "turn") turn = game.side;
  else { target = headingTarget(game); turn = Math.min(1, Math.hypot(game.side, game.fwd) * 2); }
  // the joystick wins over the tilt while the thumb is dragged out of the middle
  const sh = game.stick ? stickHeading(game.stick.dx, game.stick.dy, thrustButton().r) : null;
  if (sh !== null) { target = sh; turn = 1; }
  const wasEmpty = game.locked;
  // out of fuel: the engine stops, but a thumb still holding keeps steering, and the engine
  // starts again by itself once the tank has refilled enough
  const hit = moveShip(game, S, { target, turn, thrust: game.thrust !== null }, dt);
  if (game.locked && !wasEmpty) { if (game.thrust === "key") game.thrust = null; audio.empty(); buzz(120); }
  if (hit > U * 0.15) { audio.bump(); buzz(Math.min(70, hit / U * 50)); }

  // the camera: with an enemy around it looks at the middle between the two ships (like Star Control);
  // alone, it leads a little in the direction of flight
  const lk = 1 - Math.exp(-dt * 2);
  let tx = clamp(game.vx * 0.22, -W * 0.22, W * 0.22), ty = clamp(game.vy * 0.22, -H * 0.22, H * 0.22);
  if (enemy.on) {
    const lim = 0.5 / ZOOM_MIN - 0.15;   // keep our own ship on screen even when fully zoomed out
    tx = clamp(wrapDelta(enemy.x - game.x, WW) / 2, -W * lim, W * lim);
    ty = clamp(wrapDelta(enemy.y - game.y, WH) / 2, -H * lim, H * lim);
  }
  game.lx = lerp(game.lx, tx, lk); game.ly = lerp(game.ly, ty, lk);
  // zoom out just enough to see the enemy too (zooming in again is slower and calmer)
  let z = 1;
  if (enemy.on) {
    const e = toScreen(enemy.x, enemy.y), m = shipSize() * 0.7;
    const dx = Math.abs(e.x - W / 2), dy = Math.abs(e.y - H / 2);
    z = clamp(Math.min(dx ? (W / 2 - m) / dx : 1, dy ? (H / 2 - m) / dy : 1, 1), ZOOM_MIN, 1);
  }
  game.zoom = lerp(game.zoom, z, 1 - Math.exp(-dt * (z < game.zoom ? 3 : 1)));
  audio.engine(game.power);
}

// One step of flying for ANY ship (player or enemy): same rules for both, like in Star Control.
// c: { target: heading to turn to (or null), turn: how hard (0..1, or -1..1 when there is no target), thrust: true/false }
// returns how hard it hit something (0 = nothing)
function moveShip(o, S, c, dt) {
  const st = shipStats(S), size = shipSize();
  // 1. turning, at the ship's own speed
  const before = o.ang;
  if (c.target === null || c.target === undefined) o.ang += c.turn * st.turn * dt;
  else o.ang = turnToward(o.ang, c.target, st.turn * dt * c.turn);
  o.ang = wrapAngle(o.ang);
  o.spin = lerp(o.spin, wrapAngle(o.ang - before) / Math.max(dt, 0.001), 1 - Math.exp(-dt * 10));

  // 2. engine and fuel (fuel fills back up by itself while the engine rests)
  //    a steam engine sometimes goes out for a moment: no push, only smoke
  const dead = S.steam && steamEngine(o, S, c.thrust && !o.locked && o.fuel > 0, dt);
  const f = fuelStep(o.fuel, o.locked, c.thrust && !dead, st, dt);
  const on = c.thrust && !dead && !o.locked && o.fuel > 0;
  if (on) {
    o.vx += Math.sin(o.ang) * st.push * U * dt;
    o.vy -= Math.cos(o.ang) * st.push * U * dt;
  }
  o.fuel = f.fuel; o.locked = f.locked;
  o.power = lerp(o.power, on ? 1 : 0, 1 - Math.exp(-dt * 10));

  // 3. the planet in the middle pulls (nearest way round, since space wraps)
  const R = U * PLANET_R;
  const dx = wrapDelta(o.x - WW / 2, WW), dy = wrapDelta(o.y - WH / 2, WH);
  const g = gravityAt(dx, dy, U, R);
  o.vx += g.ax * dt; o.vy += g.ay * dt;

  // 4. no air in space: the ship keeps flying, up to its top speed
  const sp = Math.hypot(o.vx, o.vy), top = st.top * U;
  if (sp > top) { const k = lerp(1, top / sp, 1 - Math.exp(-dt * 4)); o.vx *= k; o.vy *= k; }
  o.x += o.vx * dt; o.y += o.vy * dt;
  o.x = ((o.x % WW) + WW) % WW; o.y = ((o.y % WH) + WH) % WH;

  // 5. bounce off the planet (no damage yet)
  o.hitCool = Math.max(0, (o.hitCool || 0) - dt);
  const d = Math.hypot(dx, dy), touch = R + size * 0.32;
  let hit = 0;
  if (d < touch) {
    const nx = dx / (d || 1), ny = dy / (d || 1), vn = o.vx * nx + o.vy * ny;
    o.x += nx * (touch - d); o.y += ny * (touch - d);
    if (vn < 0) {
      o.vx -= 1.6 * vn * nx; o.vy -= 1.6 * vn * ny;
      if (-vn > U * 0.15 && !o.hitCool) {
        o.hitCool = 0.3; hit = -vn;
        const p = toScreen(o.x - nx * size * 0.3, o.y - ny * size * 0.3);
        burst(p.x, p.y, 12, ["#ffffff", S.trim, "#b8a3ff"], 0.45, 0.7);
      }
    }
  }
  return hit;
}

// ---------- the steam engine (mechanical ships) ----------
// Runs every moment for a ship with  steam: true.  running = the engine is being fired.
// Returns true while the fire is out (the engine gives no push, only smoke).
function steamEngine(o, S, running, dt) {
  const me = o === game, R = Math.random;
  o.sputter = Math.max(0, (o.sputter || 0) - dt);
  if (running) {
    // just lit: it often bangs
    if (!o.wasRunning && R() < 0.3) backfire(o, S, me);
    if (o.sputter <= 0 && R() < STEAM.dies * dt) {
      o.sputter = STEAM.out[0] + R() * (STEAM.out[1] - STEAM.out[0]);   // the fire goes out
      if (me) { audio.sputter(); buzz(40); }
    } else if (o.sputter <= 0 && R() < STEAM.backfire * dt) backfire(o, S, me);
    if (me && R() < STEAM.creak * dt) audio.creak();
    // out: thick puffs of smoke; burning: a little steam now and then
    if (R() < (o.sputter > 0 ? 14 : 3) * dt) for (const e of exhausts(o, S)) smokeAt(e.x, e.y, o, S, o.sputter > 0 ? 1 : 0.5);
  }
  // hard turns make the old frame groan
  if (me && Math.abs(o.spin) > 2.5 && R() < 0.5 * dt) audio.creak();
  o.wasRunning = running;
  return o.sputter > 0;
}
function backfire(o, S, me) {
  const ex = exhausts(o, S), e = ex[Math.floor(Math.random() * ex.length)];
  const bx = -Math.sin(o.ang) * U * 0.5, by = Math.cos(o.ang) * U * 0.5;   // the blast shoots out the back
  burstAt(e.x, e.y, 14, ["#ffffff", "#ffd166", "#ff8c1a", "#ff4d00"], 0.35, 1, o.vx + bx * 0.3, o.vy + by * 0.3);
  smokeAt(e.x, e.y, o, S, 1.2);
  if (me) { audio.backfire(); buzz(70); }
}
// where the engines are, in space, right now
function exhausts(o, S) {
  const size = shipSize();
  return S.nozzles.map((ex, n) => {
    const p = rotatePt(ex * size, ((S.engineYs ? S.engineYs[n] : S.engineY) + 0.05) * size, o.ang);
    return { x: o.x + p.x, y: o.y + p.y };
  });
}
// one puff of smoke behind a ship. big: 1 = a normal puff; the smoke screen uses bigger, darker, longer ones
function smokeAt(x, y, o, S, big = 1, life = 1.6) {
  const back = U * 0.25 * (0.5 + Math.random()), a = o.ang + (Math.random() - 0.5) * 0.9;
  const g = 70 + Math.round(Math.random() * 50);
  parts.push({ w: true, smoke: true, x, y, vx: o.vx * 0.4 - Math.sin(a) * back, vy: o.vy * 0.4 + Math.cos(a) * back,
    life: 0, max: life * (0.7 + Math.random() * 0.6), s: shipSize() * 0.07 * big, grow: 1.6 + Math.random(),
    c: `rgb(${g},${g},${g + 8})`, op: big > 1.5 ? 0.85 : 0.55 });
}

// ---------- magic: the gear button ----------
function magicOf(S) { return S.magic ? MAGIC[S.magic] : null; }
function useMagic() {
  const S = shipById(game.ship), M = magicOf(S);
  if (!M || game.magicCool > 0 || game.dead) return;
  if (M.look === "tail") {   // the stinger tail grows out behind the ship
    game.magicCool = M.cool; game.tail = { t: 0, pts: null, zap: 0, touch: 0 };
    audio.lash(); buzz(50);
    return;
  }
  // a ship with smoke drawings: the vent covers open first, and the smoke leaves at the "release" frame
  if (S.anim && S.anim.smoke) {
    if (game.anim && game.anim.seq === "secondary") { game.magicWait = true; return; }   // after the cannon shot
    game.magicCool = M.cool;
    game.anim = { seq: "smoke", t: 0, release: true };
    audio.hatch(); buzz(40);
    return;
  }
  game.magicCool = M.cool;
  releaseSmoke();
}
// the smoke is out: thick smoke starts pouring from the engines; the enemy loses you, and only knows where you were
function releaseSmoke() {
  const M = magicOf(shipById(game.ship));
  game.magicPour = M.pour; game.hidden = M.hide;
  enemy.ghostX = game.x; enemy.ghostY = game.y;
  audio.magic(); buzz(90);
}
function updateMagic(dt) {
  const S = shipById(game.ship), M = magicOf(S);
  updateTail(dt);
  game.magicCool = Math.max(0, game.magicCool - dt);
  game.hidden = Math.max(0, game.hidden - dt);
  game.gear += dt * (game.magicPour > 0 ? 9 : game.magicCool > 0 ? 0.25 : 1.2);   // the gear button turns
  if (!M || game.magicPour <= 0) return;
  game.magicPour -= dt;
  // thick smoke pours from the engines and hangs in space
  if (Math.random() < 30 * dt) for (const e of exhausts(game, S)) smokeAt(e.x, e.y, game, S, 2.6 + Math.random() * 1.5, M.hide - 0.5);
}

// ---------- the tail (VEXAR's magic) ----------
// A chain of segments: the first one sits at the end of the ship's abdomen, every next one follows the one before
// at a fixed spacing, leaning back behind the ship. So when the ship turns or flies, the tail drags and swings
// after it. A ship touching it loses health. When it has been all the way out, it pulls back into the ship.
const TAIL_SEGS = 16;
function tailBase(S) { const size = shipSize(), p = rotatePt(0, (S.tailY || 0.4) * size, game.ang); return { x: game.x + p.x, y: game.y + p.y }; }
function updateTail(dt) {
  const T = game.tail, S = shipById(game.ship), M = magicOf(S);
  if (!T) return;
  if (!M || M.look !== "tail") { game.tail = null; return; }
  T.t += dt;
  const out = tailOut(M, T.t);
  if (out < 0) { game.tail = null; return; }
  const size = shipSize(), base = tailBase(S), step = out * M.len * size / TAIL_SEGS;
  const bx = -Math.sin(game.ang), by = Math.cos(game.ang), lean = 1 - Math.exp(-dt * 2.5);
  // it starts as a short straight line behind the ship (so every segment knows which way is "back")
  if (!T.pts) T.pts = Array.from({ length: TAIL_SEGS + 1 }, (_, i) => ({ x: base.x + bx * i * 0.5, y: base.y + by * i * 0.5 }));
  const old = T.pts.slice();
  T.pts[0] = base;
  for (let i = 1; i <= TAIL_SEGS; i++) {
    const a = T.pts[i - 1], b = old[i];
    // the way this segment pointed a moment ago
    let ox = wrapDelta(b.x - old[i - 1].x, WW), oy = wrapDelta(b.y - old[i - 1].y, WH), od = Math.hypot(ox, oy);
    if (od < 1e-6) { ox = bx; oy = by; od = 1; }
    ox /= od; oy /= od;
    // follow: point from the segment before (where it is now) to where this one was. That makes the tail drag.
    // (while the tail grows, that could fold it back on itself: then it keeps pointing the way it did)
    let dx = wrapDelta(b.x - a.x, WW), dy = wrapDelta(b.y - a.y, WH), d = Math.hypot(dx, dy);
    if (d < 1e-6 || dx * ox + dy * oy <= 0) { dx = ox; dy = oy; d = 1; }
    dx = dx / d * (1 - lean) + bx * lean; dy = dy / d * (1 - lean) + by * lean;   // leans back behind the ship
    const n = Math.hypot(dx, dy) || 1;
    T.pts[i] = { x: a.x + dx / n * step, y: a.y + dy / n * step };
  }
  // touching the enemy: it loses health while it stays on the tail
  T.zap -= dt; T.touch = Math.max(0, T.touch - dt);
  if (!enemy.on || enemy.warp >= 0.5) return;
  for (let i = 3; i <= TAIL_SEGS; i++) {
    const q = T.pts[i];
    if (Math.hypot(wrapDelta(enemy.x - q.x, WW), wrapDelta(enemy.y - q.y, WH)) < size * (0.42 + tailWidth(i) / 2)) {
      enemy.hp -= M.drain * dt; enemy.hurt = 0.15; T.touch = 0.2;
      if (T.zap <= 0) { T.zap = 0.12; audio.zap(); buzz(15); burstAt(q.x, q.y, 5, [M.color, "#ffffff"], 0.2, 0.5, enemy.vx, enemy.vy); }
      if (enemy.hp <= 0) destroyEnemy();
      break;
    }
  }
}
// the tail's width at segment i, in ship-lengths: thick at the ship, thin at the stinger
function tailWidth(i) { return 0.05 + 0.13 * (1 - i / TAIL_SEGS); }
// the tail, drawn under the ship: dark green chitin plates with lime edges and a glowing stripe, a thorn for a stinger
function drawTail() {
  const T = game.tail;
  if (!T || !T.pts || game.dead) return;
  const S = shipById(game.ship), size = shipSize(), pts = T.pts.map((q, i) => {
    const p = toScreen(q.x, q.y);
    if (i === 0) return p;
    // a living wave runs down the tail
    const a = T.pts[i - 1], dx = wrapDelta(q.x - a.x, WW), dy = wrapDelta(q.y - a.y, WH), d = Math.hypot(dx, dy) || 1;
    const w = Math.sin(time * 7 - i * 0.55) * size * 0.035 * (i / TAIL_SEGS);
    return { x: p.x - dy / d * w, y: p.y + dx / d * w };
  });
  const glow = T.touch > 0 ? 1 : 0.5 + 0.2 * Math.sin(time * 6);
  ctx.save();
  // the spine underneath
  ctx.strokeStyle = "#0a1a0a"; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = size * 0.06;
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
  // the stinger: VEXAR's own thorn drawing, pointing out along the tail
  const a = pts[TAIL_SEGS - 1], z = pts[TAIL_SEGS], st = artImage(framePath(S.anim ? S.anim.dir : "vexar", "thorn.webp"));
  if (st) {
    const d = size * 0.34;
    ctx.save(); ctx.translate(z.x, z.y); ctx.rotate(Math.atan2(z.x - a.x, -(z.y - a.y)));
    if (T.touch > 0) { ctx.shadowColor = "#b8ff3a"; ctx.shadowBlur = size * 0.15; }
    ctx.drawImage(st, -d / 2, -d * 0.35, d, d); ctx.restore();
  }
  // the plates, from the tip back to the ship (so the ones nearer the ship lie on top)
  for (let i = TAIL_SEGS; i >= 1; i--) {
    const p = pts[i - 1], q = pts[i], mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    const len = Math.hypot(q.x - p.x, q.y - p.y), w = tailWidth(i) * size;
    if (len < 0.5) continue;
    ctx.save(); ctx.translate(mx, my); ctx.rotate(Math.atan2(q.y - p.y, q.x - p.x));
    const g = ctx.createLinearGradient(0, -w / 2, 0, w / 2);
    g.addColorStop(0, "#0f2a10"); g.addColorStop(0.35, "#3fae2a"); g.addColorStop(0.5, "#9fe04a"); g.addColorStop(0.65, "#2e7d1e"); g.addColorStop(1, "#0b1f0b");
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, len * 0.72, w / 2, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = hexA("#b8ff3a", 0.55 * glow + 0.2); ctx.lineWidth = Math.max(1, size * 0.008); ctx.stroke();
    // the glowing stripe down the middle, like the ship's abdomen
    ctx.fillStyle = hexA("#d8ff5a", 0.45 + 0.5 * glow); ctx.beginPath(); ctx.ellipse(0, 0, len * 0.4, Math.max(1, w * 0.1), 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// ======================================================================
//  THE ENEMY  (for now it only flies: chases you, keeps a little distance, stays off the planet)
// ======================================================================
const enemy = { on: false, ship: null, x: 0, y: 0, vx: 0, vy: 0, ang: 0, spin: 0, fuel: 0, locked: false, power: 0, hitCool: 0, warp: 0,
  hp: ENEMY_HP, hurt: 0, respawn: 0 };
function spawnEnemy() {
  if (!ENEMY) return;
  const others = SHIPS.filter((s) => s.id !== game.ship);
  enemy.ship = others[Math.floor(Math.random() * others.length)].id;
  if (!game.kills) { enemy.x = WW / 2 + U * 0.3; enemy.y = WH / 2 + U * 2.2; }   // the first one: on the far side of the planet
  else {
    // the next ones: about two screens from you, away from the planet
    let a = Math.random() * TAU;
    for (let i = 0; i < 12; i++, a += TAU / 12) {
      enemy.x = game.x + Math.sin(a) * U * 2.2; enemy.y = game.y - Math.cos(a) * U * 2.2;
      if (Math.hypot(wrapDelta(enemy.x - WW / 2, WW), wrapDelta(enemy.y - WH / 2, WH)) > U * PLANET_R * 3) break;
    }
    enemy.x = ((enemy.x % WW) + WW) % WW; enemy.y = ((enemy.y % WH) + WH) % WH;
  }
  enemy.vx = enemy.vy = 0; enemy.ang = Math.PI; enemy.spin = 0;
  enemy.fuel = shipStats(shipById(enemy.ship)).fuel; enemy.locked = false;
  enemy.hp = ENEMY_HP; enemy.hurt = 0;
  enemy.on = true; enemy.warp = 1;
}
function updateEnemy(dt) {
  if (!enemy.on) {
    if (enemy.respawn > 0) { enemy.respawn -= dt; if (enemy.respawn <= 0) spawnEnemy(); }
    return;
  }
  enemy.warp = Math.max(0, enemy.warp - dt);
  enemy.hurt = Math.max(0, enemy.hurt - dt);
  const E = shipById(enemy.ship);
  // hidden in your smoke: it heads for where it last saw you, searching around there
  let prey = game;
  if (!enemySees(game.hidden) || game.dead) {
    if (game.dead && enemy.ghostX === undefined) { enemy.ghostX = game.x; enemy.ghostY = game.y; }
    enemy.ghostX += Math.sin(time * 0.7) * U * 0.6 * dt; enemy.ghostY += Math.cos(time * 0.5) * U * 0.6 * dt;
    prey = { x: enemy.ghostX, y: enemy.ghostY, vx: 0, vy: 0 };
  }
  const c = enemyControl(enemy, prey, shipStats(E), { ww: WW, wh: WH, u: U, planetR: U * PLANET_R });
  moveShip(enemy, E, c, dt);
  if (!game.dead) bumpShips(game, shipById(game.ship), enemy, E);
}
// ships bounce off each other (the heavier one is pushed less)
function bumpShips(a, A, b, B) {
  const dx = wrapDelta(b.x - a.x, WW), dy = wrapDelta(b.y - a.y, WH), d = Math.hypot(dx, dy) || 1;
  const touch = shipSize() * 0.62;
  if (d >= touch) return;
  const nx = dx / d, ny = dy / d, ma = A.mass, mb = B.mass;
  const push = touch - d;
  a.x -= nx * push * mb / (ma + mb); a.y -= ny * push * mb / (ma + mb);
  b.x += nx * push * ma / (ma + mb); b.y += ny * push * ma / (ma + mb);
  const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (vn >= 0) return;
  const j = -1.8 * vn / (1 / ma + 1 / mb);
  a.vx -= j / ma * nx; a.vy -= j / ma * ny;
  b.vx += j / mb * nx; b.vy += j / mb * ny;
  // crashing hurts both ships, more the faster it was
  const ram = ramDamage(-vn / U);
  if (ram > 0) {
    damageShip(ram);
    if (enemy.on) { enemy.hp -= ram; enemy.hurt = 0.15; if (enemy.hp <= 0) destroyEnemy(); }
  }
  if (-vn > U * 0.1) {
    audio.bump(); buzz(Math.min(80, -vn / U * 60));
    const p = toScreen(a.x + nx * touch / 2, a.y + ny * touch / 2);
    burst(p.x, p.y, 16, ["#ffffff", A.trim, B.trim], 0.5, 0.8);
  }
}

// ======================================================================
//  YOUR SHIP'S HEALTH
// ======================================================================
function shake(k) { game.shakeT = Math.min(1.2, Math.max(game.shakeT, k * SHAKE)); }
function damageShip(n) {
  if (game.dead || game.stage !== "fly" || n <= 0) return;
  game.hp = Math.max(0, game.hp - n); game.hurt = 0.35;
  shake(0.25 + n / 40); audio.hurt(); buzz(60 + n * 3);
  if (game.hp <= 0) blowUpShip();
}
// health gone: the ship blows up, and comes back near where it started a few seconds later
function blowUpShip() {
  const S = shipById(game.ship);
  game.dead = 3; game.deaths++; game.thrust = null; game.anim = null; game.magicWait = false; game.tail = null;
  burstAt(game.x, game.y, 100, ["#ffffff", "#ffd166", S.flame, S.hull, S.trim, "#ff6b35"], 1.5, 1.5, game.vx * 0.5, game.vy * 0.5);
  for (let k = 0; k < 10; k++) smokeAt(game.x, game.y, game, S, 2.5, 2.5);
  rings.push({ x: game.x, y: game.y, t: 0, max: 0.8, r: shipSize() * 2.6, c: S.flame });
  audio.boom(); audio.cannon(); shake(1.2); buzz(400);
  enemy.ghostX = game.x; enemy.ghostY = game.y;
}
function respawnShip() {
  game.dead = 0; placeShip(); game.zoom = 1;
  game.arriveT = 1;   // a flash as it comes back
  audio.whoosh();
}

// ======================================================================
//  WEAPONS  (buttons 1 and 2: the ship's own; button 3: picked up from a destroyed enemy)
// ======================================================================
const shots = [];
const rings = [];   // shock waves from explosions, at a place in space
const crate = { on: false, w: null, x: 0, y: 0, vx: 0, vy: 0, t: 0 };

// which weapon each button fires right now (null = no such button now)
function slotWeapon(i) {
  if (i < 2) return weaponsOf(shipById(game.ship))[i];
  return game.loot ? game.loot.w : null;
}
function slotAmmo(i) { return i < 2 ? game.ammo[i] : game.loot ? game.loot.ammo : 0; }

function updateWeapons(dt) {
  const S = shipById(game.ship);
  weaponsOf(S).forEach((w, i) => { game.ammo[i] = ammoStep(game.ammo[i], WEAPONS[w], dt); });
  updateAnim(dt);
  updateEggs(dt);
  for (let i = 0; i < 3; i++) {
    game.cool[i] = Math.max(0, game.cool[i] - dt);
    if (game.fire[i] !== null && game.cool[i] <= 0 && slotWeapon(i) && slotAmmo(i) >= 1 && !waitsForFrames(i)) shoot(i);
  }
  // button 3 grows in when picked up, and shrinks away once it is empty
  if (game.loot) {
    game.loot.show = clamp(game.loot.show + (game.loot.ammo >= 1 ? 1 : -1) * dt / 0.5, 0, 1);
    if (game.loot.ammo < 1 && game.loot.show <= 0) { game.loot = null; game.fire[2] = null; }
  }

  const size = shipSize(), R = U * PLANET_R;
  for (let k = shots.length - 1; k >= 0; k--) {
    const s = shots[k], Wp = WEAPONS[s.w];
    s.life += dt;
    if (Wp.homing && enemy.on && s.life > 0.12) {
      const t = steerShot(s.vx, s.vy, wrapDelta(enemy.x - s.x, WW), wrapDelta(enemy.y - s.y, WH), Wp.homing * dt);
      s.vx = t.vx; s.vy = t.vy;
    }
    s.x = (((s.x + s.vx * dt) % WW) + WW) % WW; s.y = (((s.y + s.vy * dt) % WH) + WH) % WH;
    if (s.w === "missile" && Math.random() < 0.6) burstAt(s.x, s.y, 1, ["#b8fff0", "#ffffff"], 0.05, 0.6);
    if (s.life > Wp.life) { if (s.w === "iris") burstAt(s.x, s.y, 10, [Wp.color, "#fff3b0"], 0.25, 0.7); shots.splice(k, 1); continue; }
    // into the planet: a puff, and it is gone
    if (Math.hypot(wrapDelta(s.x - WW / 2, WW), wrapDelta(s.y - WH / 2, WH)) < R) {
      burstAt(s.x, s.y, 5, ["#b8a3ff", "#ffffff"], 0.2, 0.6); shots.splice(k, 1); continue;
    }
    // into the enemy
    if (enemy.on && enemy.warp < 0.5) {
      const dx = wrapDelta(enemy.x - s.x, WW), dy = wrapDelta(enemy.y - s.y, WH);
      if (Math.hypot(dx, dy) < size * 0.42 + Wp.r * size) { hitEnemy(s, Wp); shots.splice(k, 1); }
    }
  }
  for (let k = rings.length - 1; k >= 0; k--) { rings[k].t += dt; if (rings[k].t > rings[k].max) rings.splice(k, 1); }
}

// a trigger pull. With a ship that has firing drawings (anim), the drawings lead:
//  primary (button 1): each shot jumps to the frame where that barrel flashes, then the frames settle back to idle
//  secondary (button 2): the iris winds up first; the shot leaves at the "fire" frame (the big flash)
function shoot(i) {
  const w = slotWeapon(i), Wp = WEAPONS[w], S = shipById(game.ship), A = S.anim;
  game.cool[i] = Wp.cool;
  if (i < 2) game.ammo[i] -= 1; else game.loot.ammo -= 1;
  if (A && i === 1) {   // the secondary waits for its wind-up
    game.anim = { seq: "secondary", t: 0, pending: w };
    if (w === "iris") audio.windUp(Math.max(0, cueTime(A.secondary, "fire")) / 1000); else audio.jaws();
    return;
  }
  const guns = gunsOf(S, w), b = game.barrel[i]++ % guns.length;
  // the twin cannon's frames do not cut into the heavy cannon or the smoke hatches (its shots still fly)
  if (A && i === 0 && !(game.anim && (game.anim.seq === "secondary" || game.anim.seq === "smoke")))
    game.anim = { seq: "primary", t: Math.max(0, cueTime(A.primary, b === 0 ? "left" : "right")) };
  spawnShots(w, guns[b]);
  audio.shot(w);
}
// the shots leave from a gun point on the ship, turned with the ship
function spawnShots(w, g) {
  const Wp = WEAPONS[w], S = shipById(game.ship), size = shipSize();
  const m = rotatePt(g[0] * size, g[1] * size, game.ang);
  const x = game.x + m.x, y = game.y + m.y;
  if (Wp.egg) { layEgg(x, y, Wp, S); return; }
  for (const a of pelletAngles(Wp)) {
    const dir = game.ang + a, v = Wp.speed * U;
    shots.push({ w, x, y, vx: game.vx + Math.sin(dir) * v, vy: game.vy - Math.cos(dir) * v, life: 0 });
  }
  // the drawings already have their own muzzle flash; drawn ships get a little spark burst
  if (!S.anim) burstAt(x, y, w === "iris" ? 14 : 4, [Wp.color, "#ffffff"], w === "iris" ? 0.25 : 0.12, w === "iris" ? 0.8 : 0.5, game.vx, game.vy);
  // shots with their own drawing (THUL's cannonball, VEXAR's thorns). THUL's flash, shock ring and sparks are in its frames
  const art = S.anim && S.anim.shotArt && S.anim.shotArt[w];
  if (art) for (const s of shots.slice(-pelletAngles(Wp).length)) s.art = { src: framePath(S.anim.dir, art.file), d: art.size, spin: art.spin || 0 };
  // the big brass shot kicks the ship back a little
  if (w === "iris") {
    game.vx -= Math.sin(game.ang) * U * 0.16; game.vy += Math.cos(game.ang) * U * 0.16;
    shake(0.9); buzz(160);
    // a puff of smoke from the iris
    for (let k = 0; k < 4; k++) smokeAt(x, y, { ang: game.ang + Math.PI, vx: game.vx, vy: game.vy }, S, 1.4, 1.2);
  }
}
// ---------- VEXAR's eggs and hunters ----------
// An egg is pushed out of the chamber, drifts to a stop and pulses; after `incubate` ms it cracks and,
// at the "swarm" frame, lets out its hunters. The enemy can crush it by flying into it before then (no hunters).
const eggs = [], hunters = [];
function layEgg(x, y, Wp, S) {
  const v = Wp.speed * U;
  eggs.push({ x, y, vx: game.vx * 0.5 + Math.sin(game.ang) * v, vy: game.vy * 0.5 - Math.cos(game.ang) * v, ang: game.ang,
    t: 0, ht: -1, crushed: false, w: "hive", E: S.anim.egg, dir: S.anim.dir });
}
function updateEggs(dt) {
  const size = shipSize();
  for (let k = eggs.length - 1; k >= 0; k--) {
    const e = eggs[k], Wp = WEAPONS[e.w];
    e.vx *= Math.exp(-dt * 2.2); e.vy *= Math.exp(-dt * 2.2);   // drifts to a stop
    e.x = (((e.x + e.vx * dt) % WW) + WW) % WW; e.y = (((e.y + e.vy * dt) % WH) + WH) % WH;
    e.t += dt * 1000;
    const swarm = cueTime(e.E.hatch, "swarm");
    // the enemy flies into it before the hunters are out: crushed, only the shell pieces fly
    if (!e.crushed && e.ht < swarm && enemy.on && enemy.warp < 0.5 &&
        Math.hypot(wrapDelta(enemy.x - e.x, WW), wrapDelta(enemy.y - e.y, WH)) < size * 0.42 + Wp.r * size) {
      e.crushed = true; e.ht = swarm; audio.hatch(false);
      burstAt(e.x, e.y, 14, ["#b8ff3a", "#3fae2a", "#e9ffd0"], 0.35, 0.7, enemy.vx * 0.3, enemy.vy * 0.3);
      continue;
    }
    if (e.ht < 0) { if (e.t >= e.E.incubate) { e.ht = 0; audio.hatch(true); } continue; }
    const before = e.ht; e.ht += dt * 1000;
    if (!e.crushed && before < swarm && e.ht >= swarm) releaseHunters(e, Wp);
    if (seqFrame(e.E.hatch, e.ht) < 0) eggs.splice(k, 1);
  }
  for (let k = hunters.length - 1; k >= 0; k--) {
    const h = hunters[k], Wp = WEAPONS[h.w];
    h.life += dt;
    // speed up to full, and turn toward the enemy no faster than hunterTurn
    const sp = Math.min(Wp.hunterSpeed * U, Math.hypot(h.vx, h.vy) + Wp.hunterSpeed * U * 2 * dt);
    let a = Math.atan2(h.vy, h.vx);
    if (enemy.on) {
      const want = Math.atan2(wrapDelta(enemy.y - h.y, WH), wrapDelta(enemy.x - h.x, WW));
      let d = want - a; d = Math.atan2(Math.sin(d), Math.cos(d));
      a += clamp(d, -Wp.hunterTurn * dt, Wp.hunterTurn * dt);
    }
    a += Math.sin(time * 9 + h.seed) * 0.6 * dt;   // a little wobble, like a wasp
    h.vx = Math.cos(a) * sp; h.vy = Math.sin(a) * sp;
    h.x = (((h.x + h.vx * dt) % WW) + WW) % WW; h.y = (((h.y + h.vy * dt) % WH) + WH) % WH;
    const gone = () => { burstAt(h.x, h.y, 6, ["#b8ff3a", "#ffffff"], 0.15, 0.5); hunters.splice(k, 1); };
    if (h.life > Wp.hunterLife) { gone(); continue; }
    if (Math.hypot(wrapDelta(h.x - WW / 2, WW), wrapDelta(h.y - WH / 2, WH)) < U * PLANET_R) { gone(); continue; }
    if (enemy.on && enemy.warp < 0.5 && Math.hypot(wrapDelta(enemy.x - h.x, WW), wrapDelta(enemy.y - h.y, WH)) < shipSize() * 0.45) {
      hitEnemy(h, Wp); hunters.splice(k, 1);
    }
  }
}
// three different hunters, spread out a little, all heading for the enemy (or straight out the way the egg faced)
function releaseHunters(e, Wp) {
  const base = enemy.on ? Math.atan2(wrapDelta(enemy.y - e.y, WH), wrapDelta(enemy.x - e.x, WW)) : e.ang - Math.PI / 2;
  for (let i = 0; i < Wp.swarm; i++) {
    const a = base + (i / Math.max(1, Wp.swarm - 1) - 0.5) * 1.6, v = Wp.hunterSpeed * U * 0.35;
    hunters.push({ w: e.w, x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, seed: i * 2.1 + Math.random(),
      frames: e.E.hunter, d: e.E.hunterSize, dir: e.dir, phase: i * 70 });
  }
}
function drawEggs() {
  const size = shipSize();
  for (const e of eggs) {
    const p = toScreen(e.x, e.y), d = e.E.size * size;
    const seq = e.ht < 0 ? e.E.pulse : e.E.hatch, t = e.ht < 0 ? e.t % seqLength(e.E.pulse) : e.ht, f = seqFrame(seq, t);
    const img = f >= 0 && artImage(framePath(e.dir, seq[f][0]));
    if (!img) continue;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(e.ang); ctx.drawImage(img, -d / 2, -d / 2, d, d); ctx.restore();
  }
  for (const h of hunters) {
    const p = toScreen(h.x, h.y), d = h.d * size, f = seqFrame(h.frames, (h.life * 1000 + h.phase) % seqLength(h.frames));
    const img = artImage(framePath(h.dir, h.frames[Math.max(0, f)][0]));
    if (!img) continue;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(h.vx, -h.vy)); ctx.drawImage(img, -d / 2, -d / 2, d, d); ctx.restore();
  }
}

// moves the firing drawings along; each shot cue fires once, even if a slow frame jumps past it
function updateAnim(dt) {
  const a = game.anim, A = shipById(game.ship).anim;
  if (!a || !A) { game.anim = null; return; }
  const seq = A[a.seq], before = a.t;
  a.t += dt * 1000;
  if (a.pending) {
    const cue = cueTime(seq, "fire");
    if (before <= cue && a.t >= cue || seqFrame(seq, a.t) < 0) {
      spawnShots(a.pending, gunsOf(shipById(game.ship), a.pending)[0]); audio.shot(a.pending); a.pending = null;
    }
  }
  if (a.release) {   // the smoke hatches: the smoke starts once, at its frame
    const cue = cueTime(seq, "release");
    if (before <= cue && a.t >= cue || seqFrame(seq, a.t) < 0) { releaseSmoke(); a.release = false; }
  }
  if (seqFrame(seq, a.t) < 0) {   // after the last frame: back to idle
    game.anim = null;
    if (game.magicWait) { game.magicWait = false; useMagic(); }   // the gear was tapped during the cannon shot
  }
}
// button 2 waits while the heavy cannon or the smoke hatches are still playing (so a shot never cuts a sequence short)
function waitsForFrames(i) {
  const a = game.anim;
  return i === 1 && !!a && !!shipById(game.ship).anim && (a.seq === "secondary" || a.seq === "smoke");
}
// which drawing the player's ship shows now
function shipFrame(S) {
  if (!S.anim) return null;
  const a = game.anim;
  if (a && S.id === game.ship) { const f = seqFrame(S.anim[a.seq], a.t); if (f >= 0) return S.anim[a.seq][f][0]; }
  return S.anim.idle;
}

function hitEnemy(s, Wp) {
  const E = shipById(enemy.ship);
  enemy.hp -= Wp.dmg; enemy.hurt = 0.15;
  // the hit nudges the enemy (heavier ships less)
  const sp = Math.hypot(s.vx - enemy.vx, s.vy - enemy.vy) || 1, push = Wp.dmg * U * 0.004 / E.mass;
  enemy.vx += (s.vx - enemy.vx) / sp * push; enemy.vy += (s.vy - enemy.vy) / sp * push;
  burstAt(s.x, s.y, Wp.dmg > 15 ? 22 : 6, [Wp.color, "#ffffff", E.trim], Wp.dmg > 15 ? 0.5 : 0.25, 0.7, enemy.vx, enemy.vy);
  if (Wp.dmg > 15) rings.push({ x: s.x, y: s.y, t: 0, max: 0.4, r: shipSize() * 0.6, c: Wp.color });
  audio.hit();
  if (enemy.hp <= 0) destroyEnemy();
}

function destroyEnemy() {
  const E = shipById(enemy.ship);
  enemy.on = false; enemy.respawn = RESPAWN; game.kills++;
  burstAt(enemy.x, enemy.y, 90, ["#ffffff", "#ffd166", E.flame, E.hull, E.trim, "#ff6b35"], 1.4, 1.4, enemy.vx * 0.5, enemy.vy * 0.5);
  burstAt(enemy.x, enemy.y, 30, ["#ffffff", "#fff3b0"], 0.5, 2, enemy.vx * 0.5, enemy.vy * 0.5);
  rings.push({ x: enemy.x, y: enemy.y, t: 0, max: 0.7, r: shipSize() * 2.2, c: "#ffd166" });
  audio.boom(); buzz(220);
  // its weapon is left behind in a crate
  Object.assign(crate, { on: true, w: lootOf(E), x: enemy.x, y: enemy.y, vx: enemy.vx * 0.4, vy: enemy.vy * 0.4, t: 0 });
}

function updateCrate(dt) {
  if (!crate.on) return;
  crate.t += dt;
  crate.vx *= Math.exp(-dt * 0.6); crate.vy *= Math.exp(-dt * 0.6);
  crate.x = (((crate.x + crate.vx * dt) % WW) + WW) % WW; crate.y = (((crate.y + crate.vy * dt) % WH) + WH) % WH;
  // not inside the planet
  const R = U * PLANET_R, dx = wrapDelta(crate.x - WW / 2, WW), dy = wrapDelta(crate.y - WH / 2, WH), d = Math.hypot(dx, dy) || 1;
  if (d < R * 1.3) { crate.x += dx / d * (R * 1.3 - d); crate.y += dy / d * (R * 1.3 - d); }
  // fly into it to take the weapon: button 3 appears
  if (crate.t > 0.6 && Math.hypot(wrapDelta(crate.x - game.x, WW), wrapDelta(crate.y - game.y, WH)) < shipSize() * 0.6) {
    const Wp = WEAPONS[crate.w];
    game.loot = { w: crate.w, ammo: Wp.ammo, show: game.loot ? game.loot.show : 0 };
    game.cool[2] = 0; crate.on = false;
    burstAt(crate.x, crate.y, 40, [Wp.color, "#ffffff", "#ffd166"], 0.7, 1, game.vx, game.vy);
    audio.pickup(); buzz(60);
  }
}

// the fire buttons, for the right thumb: 1 big in the corner, 2 beside it, 3 above it (only while you have it)
function fireButtons() {
  const r = Math.min(U * 0.12, 72), x1 = W - r - U * 0.09, y1 = H - r - U * 0.1;
  const list = [{ i: 0, x: x1, y: y1, r }, { i: 1, x: x1 - r * 2.15, y: y1 + r * 0.2, r: r * 0.85 }];
  if (game.loot) list.push({ i: 2, x: x1 - r * 0.45, y: y1 - r * 2.15, r: r * 0.85 * ease(game.loot.show) });
  return list;
}
function hitFire(x, y) {
  for (const b of fireButtons()) if (b.r > 5 && Math.hypot(x - b.x, y - b.y) < b.r * 1.25) return b;
  return null;
}

// where a point in space shows up on the screen
function toScreen(x, y) {
  return { x: W / 2 + wrapDelta(x - (game.x + game.lx), WW), y: H / 2 + wrapDelta(y - (game.y + game.ly), WH) };
}
function shipScreen() { return toScreen(game.x, game.y); }
// the same point after the zoom (for touches and the edge arrow)
function zoomed(p) { const z = game.zoom; return { x: W / 2 + (p.x - W / 2) * z, y: H / 2 + (p.y - H / 2) * z }; }

// ---------- the thrust button (left thumb) ----------
function thrustButton() { const r = Math.min(U * 0.12, 72); return { x: r + U * 0.09, y: H - r - U * 0.1, r }; }
function hitThrust(x, y) { const b = thrustButton(); return Math.hypot(x - b.x, y - b.y) < b.r * 1.45; }
// the magic button: above the thrust button, also for the left thumb
function magicButton() { const t = thrustButton(); return { x: t.x + t.r * 0.25, y: t.y - t.r * 2.45, r: t.r * 0.85 }; }
function hitMagic(x, y) { const b = magicButton(); return !!magicOf(shipById(game.ship)) && Math.hypot(x - b.x, y - b.y) < b.r * 1.25; }

// ======================================================================
//  DRAWING
// ======================================================================
function drawSpace() {
  const g = ctx.createRadialGradient(W * 0.5, H * 0.35, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.9);
  g.addColorStop(0, "#141a3a"); g.addColorStop(0.55, "#090b1e"); g.addColorStop(1, "#030308");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // three layers of stars, far ones slide slower (depth). 0.1 / 0.3 / 0.6 x 10 screens = whole screens,
  // so nothing jumps when the ship wraps round the edge of space
  const cx = game.x + game.lx, cy = game.y + game.ly;
  for (const s of stars) {
    const k = [0.1, 0.3, 0.6][s.d];
    const x = (((s.x - cx * k) % W) + W) % W - tilt.roll * (s.d + 1) * U * 0.002;
    const y = (((s.y - cy * k) % H) + H) % H + (tilt.pitch - HOLD_ANGLE) * (s.d + 1) * U * 0.002;
    ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(time * 1.3 + s.tw));
    ctx.fillStyle = s.d === 2 ? "#dfe8ff" : "#aab6e8";
    ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function mirrorPath(half) {
  ctx.beginPath();

  ctx.closePath();

// one ship, nose up, centered at (x, y), `size` long
function drawShip(S, x, y, size, o = {}) {
  const power = o.power ?? 0.25, bank = o.bank ?? 0, alpha = o.alpha ?? 1, ang = o.ang ?? 0;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.rotate(ang + bank * 0.15); ctx.scale(size * Math.cos(bank * 0.9), size);
  ctx.lineJoin = "round";
  // engine flames (behind everything)
  if (!o.out) S.nozzles.forEach((ex, n) => {   // out: the steam engine's fire has gone out, no flame
    const ey = S.engineYs ? S.engineYs[n] : S.engineY;   // a drawing can have its engines at different heights
    // a steam engine's flame is ragged and jumpy
    const rag = S.steam ? (Math.random() - 0.3) * 0.12 * power : 0;
    const len = 0.1 + power * 0.32 + Math.sin(time * 40 + ex * 9) * 0.03 + rag;
    const w = S.nozzles.length >= 4 ? 0.035 : 0.05;
    const fg = ctx.createLinearGradient(0, ey, 0, ey + len);
    fg.addColorStop(0, "#ffffff"); fg.addColorStop(0.3, S.flame); fg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.moveTo(ex - w, ey - 0.03); ctx.quadraticCurveTo(ex, ey + len * 1.4, ex + w, ey - 0.03); ctx.fill();
  });
  // soft glow under the ship (it hovers)
  const glow = ctx.createRadialGradient(0, 0.05, 0, 0, 0.05, 0.6);
  glow.addColorStop(0, hexA(S.flame, 0.18 + power * 0.12)); glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow; ctx.fillRect(-0.7, -0.6, 1.4, 1.3);

  // a real drawing of the ship, once there is one
  const img = shipArt(S);
  if (img) {
    // ships with frames: always the whole 512 canvas, centered on its pivot, same size for every frame
    // (so the ship never shifts while firing). Single drawings: fitted to the ship's length
    const k = S.anim ? S.anim.size / img.width : 1 / Math.max(img.width, img.height);
    ctx.drawImage(img, -img.width * k / 2, -img.height * k / 2, img.width * k, img.height * k);
    ctx.restore();
    return;
  }

  ctx.lineWidth = 0.018; ctx.strokeStyle = "rgba(0,0,0,0.55)";
  if (S.ring) {
    ctx.beginPath(); ctx.arc(0, 0.02, S.ring, 0, 6.2832); ctx.lineWidth = 0.07; ctx.strokeStyle = S.wingC; ctx.stroke();
    ctx.lineWidth = 0.025; ctx.strokeStyle = S.trim; ctx.stroke();
    ctx.lineWidth = 0.018; ctx.strokeStyle = "rgba(0,0,0,0.55)";
    for (const a of [0, Math.PI]) { ctx.save(); ctx.rotate(a + Math.PI / 2); ctx.fillStyle = S.wingC; ctx.fillRect(-0.02, 0.05, 0.04, S.ring - 0.05); ctx.restore(); }
  }
  if (S.wing.length) {
    const sides = S.twin ? [-S.twin, S.twin] : [0];
    ctx.fillStyle = S.wingC; mirrorPath(S.wing); ctx.fill(); ctx.stroke();
    if (S.twin) for (const dx of sides) { ctx.save(); ctx.translate(dx, 0); ctx.fillStyle = shade(S.hull, -0.15); mirrorPath(S.body); ctx.fill(); ctx.stroke(); ctx.restore(); }
  }
  if (S.saucer) {
    const r = S.saucer;
    const sg = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r);
    sg.addColorStop(0, S.trim); sg.addColorStop(0.6, S.hull); sg.addColorStop(1, shade(S.hull, -0.35));
    ctx.fillStyle = sg; ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.62, 0, 0, 6.2832); ctx.fill(); ctx.stroke();
    ctx.fillStyle = S.wingC; ctx.beginPath(); ctx.ellipse(0, 0, r * 0.68, r * 0.4, 0, 0, 6.2832); ctx.fill();
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * 6.2832 + time * 1.5;
      ctx.fillStyle = Math.sin(time * 6 + i) > 0 ? S.trim : S.flame;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.84, Math.sin(a) * r * 0.52, 0.025, 0, 6.2832); ctx.fill();
    }
  } else if (!S.twin) {
    const bg = ctx.createLinearGradient(-0.15, 0, 0.15, 0);
    bg.addColorStop(0, shade(S.hull, -0.3)); bg.addColorStop(0.45, S.hull); bg.addColorStop(0.55, S.trim); bg.addColorStop(1, shade(S.hull, -0.25));
    ctx.fillStyle = bg; mirrorPath(S.body); ctx.fill(); ctx.stroke();

  for (const ex of S.nozzles) { ctx.fillStyle = "#30303c"; ctx.fillRect(ex - 0.035, S.engineY - 0.045, 0.07, 0.05); }
  // cockpit
  const [cx, cy, rx, ry] = S.cockpit;
  const cg = ctx.createLinearGradient(cx - rx, cy - ry, cx + rx, cy + ry);
  cg.addColorStop(0, "#e9f7ff"); cg.addColorStop(0.35, "#5fa8d3"); cg.addColorStop(1, "#14213d");
  ctx.fillStyle = cg; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.2832); ctx.fill(); ctx.stroke();
  ctx.restore();
}
// ship drawings, loaded once each:
//   ships with frames (anim): art/ships/<anim.dir>/<frame>.png  (all frames are loaded at the start, so firing never waits)
//   ships with one drawing (art: true): art/ships/<id>.png
const artCache = {};
function framePath(dir, f) { return "art/ships/" + dir + "/" + f + (f.includes(".") ? "" : ".png"); }

  let a = artCache[src];
  if (!a) { a = artCache[src] = new Image(); a.src = src; }
  return a.complete && a.naturalWidth ? a : null;
}
function shipArt(S) {
  if (S.anim) {
    const idle = artImage(framePath(S.anim.dir, S.anim.idle));
    const f = artImage(framePath(S.anim.dir, shipFrame(S)));
    return f || idle;   // a frame still loading: show idle meanwhile
  }
  if (!S.art) return null;
  return artImage("art/ships/" + S.id + ".png");
}
function preloadArt() {
  for (const S of SHIPS) {
    const A = S.anim;
    if (!A) continue;
    const all = [A.idle, ...[A.primary, A.secondary, A.smoke].filter(Boolean).flatMap((q) => q.map((x) => x[0]))];
    for (const k in A.shotArt || {}) all.push(A.shotArt[k].file);
    if (A.egg) all.push(...[A.egg.pulse, A.egg.hatch, A.egg.hunter].flatMap((q) => q.map((x) => x[0])));
    for (const f of all) artImage(framePath(A.dir, f));

function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

function drawGift(cx, cy, s, o = {}) {
  const wob = Math.sin(time * 28) * gift.wob * 0.12, sq = gift.squash * 0.08;
  const bob = Math.sin(time * 2) * s * 0.03 + (o.dy || 0);
  ctx.save();
  ctx.translate(cx + tilt.roll * -s * 0.004, cy + bob); ctx.rotate(wob + tilt.roll * 0.002);
  ctx.scale(1 + sq, 1 - sq);
  ctx.globalAlpha = o.alpha ?? 1;
  // glow
  const gl = ctx.createRadialGradient(0, 0, s * 0.1, 0, 0, s * 1.1);
  gl.addColorStop(0, `rgba(199,125,255,${0.25 + 0.1 * Math.sin(time * 3) + gift.taps * 0.08})`); gl.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, s * 1.1, 0, 6.2832); ctx.fill();
  const bw = s, bh = s * 0.72, top = -bh * 0.35;
  // box
  const bg = ctx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
  bg.addColorStop(0, "#5a189a"); bg.addColorStop(0.5, "#9d4edd"); bg.addColorStop(1, "#3c096c");
  ctx.fillStyle = bg; roundRect(-bw / 2, top, bw, bh, s * 0.05); ctx.fill();
  ctx.fillStyle = "#ffd166"; ctx.fillRect(-s * 0.075, top, s * 0.15, bh);
  // stars printed on the paper
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  for (const [x, y] of [[-0.32, 0.05], [0.3, 0.12], [-0.22, 0.25], [0.24, 0.3]]) starShape(x * s, top + y * s + s * 0.1, s * 0.035);
  // cracks of light as it is about to open
  if (gift.taps > 0) {
    ctx.strokeStyle = `rgba(255,240,180,${0.4 + 0.3 * Math.sin(time * 10)})`; ctx.lineWidth = 2 + gift.taps;
    ctx.beginPath(); ctx.moveTo(-bw / 2, top); ctx.lineTo(bw / 2, top); ctx.stroke();
  }
  // lid (flies off when opening)
  ctx.save();
  ctx.translate(0, top + (o.lidY || 0)); ctx.rotate(o.lidRot || 0); ctx.globalAlpha *= o.lidAlpha ?? 1;
  const lw = s * 1.12, lh = s * 0.2;
  const lg = ctx.createLinearGradient(-lw / 2, 0, lw / 2, 0);
  lg.addColorStop(0, "#7b2cbf"); lg.addColorStop(0.5, "#c77dff"); lg.addColorStop(1, "#5a189a");
  ctx.fillStyle = lg; roundRect(-lw / 2, -lh, lw, lh, s * 0.04); ctx.fill();
  ctx.fillStyle = "#ffd166"; ctx.fillRect(-s * 0.075, -lh, s * 0.15, lh);

  ctx.fillStyle = "#ffbe0b"; ctx.strokeStyle = "#e09f00"; ctx.lineWidth = 2;

  ctx.beginPath(); ctx.arc(0, -lh - s * 0.05, s * 0.06, 0, 6.2832); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.restore();
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  ctx.closePath(); ctx.fill();
}

function drawRays(cx, cy, k, color) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(time * 0.4);
  for (let i = 0; i < 14; i++) {
    ctx.rotate(Math.PI * 2 / 14);
    const g = ctx.createLinearGradient(0, 0, 0, -U * 0.9);
    g.addColorStop(0, hexA(color, 0.5 * k)); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-U * 0.08, -U * 0.9); ctx.lineTo(U * 0.08, -U * 0.9); ctx.fill();
  }
  ctx.restore();
}

// the ship's name card: name, rarity, stars
function drawCard(S, alpha) {
  if (alpha <= 0) return;
  const R = RARITY[S.rarity];
  const w = Math.min(W * 0.8, U * 0.8), h = U * 0.3, x = W / 2 - w / 2, y = H * 0.73;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.fillStyle = "rgba(12,14,36,0.85)"; roundRect(x, y, w, h, h * 0.18); ctx.fill();
  ctx.strokeStyle = R.color; ctx.lineWidth = 3; ctx.stroke();
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.direction = "rtl";
  ctx.fillStyle = "#ffffff"; ctx.font = `800 ${Math.round(h * 0.26)}px Rubik, Arial, sans-serif`;
  ctx.fillText(S.name, W / 2, y + h * 0.3);
  ctx.fillStyle = R.color; ctx.font = `600 ${Math.round(h * 0.15)}px Rubik, Arial, sans-serif`;
  ctx.fillText("חללית " + R.name, W / 2, y + h * 0.56);
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i < R.stars ? R.color : "rgba(255,255,255,0.15)";
    starShape(W / 2 + (i - 1.5) * h * 0.18, y + h * 0.8, h * 0.07);
  }
  ctx.restore();
}

function drawParts() {
  for (const p of parts) {
    const k = 1 - p.life / p.max;
    ctx.globalAlpha = k; ctx.fillStyle = p.c;
    const q = p.w ? toScreen(p.x, p.y) : p;
    if (p.smoke) {   // smoke: grows and thins out
      const t = p.life / p.max;
      ctx.globalAlpha = p.op * Math.min(1, t * 6) * (1 - t);
      ctx.beginPath(); ctx.arc(q.x, q.y, p.s * (1 + t * p.grow * 2), 0, 6.2832); ctx.fill();
      continue;
    }
    if (p.star)starShape(q.x, q.y, p.s * 1.3);
    else { ctx.beginPath(); ctx.arc(q.x, q.y, p.s * k + 0.5, 0, 6.2832); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function draw() {
  drawSpace();
  const S = shipById(game.ship);

  if (game.stage === "gift") {
    const g = giftBox();
    drawGift(g.cx, g.cy, g.s);
    // after a while with no taps: a little finger pulses over the box (no words)
    if (gift.hint > 4) {
      const k = (gift.hint * 1.2) % 1;
      ctx.save(); ctx.globalAlpha = 0.6 * (1 - k); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(g.cx, g.cy, g.s * (0.15 + k * 0.3), 0, 6.2832); ctx.stroke(); ctx.restore();
    }
  }

  if (game.stage === "opening") {
    const g = giftBox(), t = game.t, R = RARITY[S.rarity];
    drawRays(g.cx, g.cy - g.s * 0.3, ease((t - 0.3) / 0.8) * (t > 4.5 ? Math.max(0, 1 - (t - 4.5)) : 1), R.color);
    drawGift(g.cx, g.cy, g.s, {
      lidY: -ease(t / 0.6) * H * 0.7, lidRot: ease(t / 0.6) * 2.2, lidAlpha: 1 - clamp(t / 0.6, 0, 1),
      alpha: 1 - clamp((t - 1.4) / 0.8, 0, 1), dy: ease((t - 1.2) / 0.8) * g.s * 0.5
    });
    if (t > 0.5) {
      const k = ease((t - 0.5) / 1.0);
      const y = lerp(g.cy - g.s * 0.25, H * 0.5, k) + Math.sin(time * 2.2) * U * 0.01;
      drawShip(S, g.cx, y, shipSize() * (0.25 + 0.95 * k), { power: 0.5 + 0.3 * Math.sin(time * 3) });
    }
    drawCard(S, clamp((t - 1.5) / 0.5, 0, 1));
  }

  if (game.stage === "arrive") {
    const k = ease(game.t / 0.9);
    ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = S.flame; ctx.lineWidth = U * 0.05 * (1 - k);
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, lerp(0, H * 0.5, k)); ctx.stroke(); ctx.restore();
    drawShip(S, W / 2, lerp(-shipSize(), H * 0.5, k), shipSize() * (0.6 + 0.4 * k), { power: 1 - k * 0.7 });
  }

  // everything out in space is drawn through the zoom; the buttons and map are not
  const flying = game.stage === "fly";
  if (flying) {
    ctx.save();
    // screen shake (cannon, hits, explosions)
    const sk = game.shakeT * game.shakeT * U * 0.035;
    if (sk > 0.2) ctx.translate((Math.random() - 0.5) * sk, (Math.random() - 0.5) * sk);
    ctx.translate(W / 2, H / 2); ctx.scale(game.zoom, game.zoom); ctx.translate(-W / 2, -H / 2);
  }
  if (game.stage !== "gift" && game.stage !== "opening") drawPlanet();

  if (flying) {
    const p = shipScreen();
    const bob = Math.sin(time * 2.1) * U * 0.004;
    const st = shipStats(S);
    const bank = clamp(game.spin / st.turn, -1, 1) * 0.5;
    const shown = trade.stage === "swapping" && trade.t > 0.9 ? shipById(trade.incoming) : S;
    const swapping = trade.stage === "swapping";
    drawCrate();
    drawEnemy();
    if (!game.dead) {
      drawTail();
      const r = swapping ? { x: 0, y: 0, a: 0 } : rattle(S);
      drawShip(shown, p.x + r.x, p.y + bob + r.y + tradeOffsetY(p.y), shipSize(),
        { power: swapping ? 1 : 0.12 + game.power * 0.88, bank, ang: (swapping ? 0 : game.ang) + r.a, out: game.sputter > 0 && !swapping });
      if (game.arriveT > 0) {   // coming back after blowing up: a flash
        ctx.save(); ctx.globalAlpha = game.arriveT; ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(p.x, p.y, shipSize() * (1.2 - game.arriveT * 0.6), 0, TAU); ctx.fill(); ctx.restore();
      }
    }
    drawShots();
    drawEggs();
    drawParts();
    drawRings();
    ctx.restore();
    if (enemy.on) edgeArrow(enemy.x, enemy.y, "#ff4d6d");
    if (crate.on) edgeArrow(crate.x, crate.y, WEAPONS[crate.w].color);
    drawCard(shown, Math.min(1, game.card * 2));
    drawRadar();
    drawHealth();
    if (!game.dead) { drawThrust(); drawFire(); drawMagic(); }
  } else drawParts();

  drawTrade();
}

// the planet in the middle of space (Star Control's melee planet)
function drawPlanet() {
  const R = U * PLANET_R, p = toScreen(WW / 2, WH / 2), far = R * 3 + W / ZOOM_MIN;
  if (p.x < -far || p.x > W + far || p.y < -far || p.y > H + far) return;
  // a soft halo: its pull
  const halo = ctx.createRadialGradient(p.x, p.y, R * 0.9, p.x, p.y, R * 2.6);
  halo.addColorStop(0, "rgba(140,110,255,0.22)"); halo.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(p.x, p.y, R * 2.6, 0, TAU); ctx.fill();
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.clip();
  const pg = ctx.createRadialGradient(-R * 0.4, -R * 0.45, R * 0.05, 0, 0, R);
  pg.addColorStop(0, "#a29bfe"); pg.addColorStop(0.45, "#6c5ce7"); pg.addColorStop(0.85, "#2d1b69"); pg.addColorStop(1, "#140b33");
  ctx.fillStyle = pg; ctx.fillRect(-R, -R, R * 2, R * 2);
  // slowly turning cloud bands
  ctx.globalAlpha = 0.18; ctx.fillStyle = "#e0d7ff";
  for (let i = 0; i < 5; i++) {
    const y = (i - 2) * R * 0.36, sh = ((time * 0.03 * (i % 2 ? 1 : -1.3)) % 2) * R * 2;
    ctx.beginPath(); ctx.ellipse(sh - R, y, R * 0.9, R * 0.06, 0, 0, TAU); ctx.ellipse(sh + R, y, R * 0.9, R * 0.06, 0, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // night side
  const sh = ctx.createLinearGradient(-R, -R, R, R);
  sh.addColorStop(0.45, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(3,3,12,0.75)");
  ctx.fillStyle = sh; ctx.fillRect(-R, -R, R * 2, R * 2);
  ctx.restore();
  ctx.strokeStyle = "rgba(190,170,255,0.5)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, TAU); ctx.stroke();
}

// the enemy: drawn like any ship, with a red ring under it; off screen, a red arrow at the edge points to it
function drawEnemy() {
  if (!enemy.on) return;
  const E = shipById(enemy.ship), p = toScreen(enemy.x, enemy.y), size = shipSize();
  const z = zoomed(p), m = size * 0.6 * game.zoom;
  if (z.x > -m && z.x < W + m && z.y > -m && z.y < H + m) {
    ctx.save(); ctx.strokeStyle = `rgba(255,77,109,${0.5 + 0.2 * Math.sin(time * 4)})`; ctx.lineWidth = 3 / game.zoom;
    ctx.beginPath(); ctx.arc(p.x, p.y, size * 0.58, 0, TAU); ctx.stroke(); ctx.restore();
    const st = shipStats(E);
    drawShip(E, p.x, p.y, size, { power: 0.12 + enemy.power * 0.88, bank: clamp(enemy.spin / st.turn, -1, 1) * 0.5, ang: enemy.ang });
    if (enemy.hurt > 0) {   // hit: a quick white flash
      ctx.save(); ctx.globalAlpha = enemy.hurt / 0.15 * 0.45; ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(p.x, p.y, size * 0.45, 0, TAU); ctx.fill(); ctx.restore();
    }
    if (enemy.warp > 0) {   // arriving: a flash
      ctx.save(); ctx.globalAlpha = enemy.warp; ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(p.x, p.y, size * (1.2 - enemy.warp * 0.6), 0, TAU); ctx.fill(); ctx.restore();
    }
    // its health bar: green when healthy, through yellow, to red
    const k = clamp(enemy.hp / ENEMY_HP, 0, 1), bw = size * 0.7, bh = Math.max(4, size * 0.045) / game.zoom;
    const bx = p.x - bw / 2, by = p.y - size * 0.68;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.55)"; roundRect(bx - 2, by - 2, bw + 4, bh + 4, 3); ctx.fill();
    ctx.fillStyle = `hsl(${Math.round(k * 120)},85%,55%)`; roundRect(bx, by, Math.max(1, bw * k), bh, 2); ctx.fill();
    ctx.restore();
  }
}
// off screen: a small arrow at the edge points to it (red: the enemy; the weapon's color: a crate)
function edgeArrow(wx, wy, color) {
  const p = zoomed(toScreen(wx, wy)), m = shipSize() * 0.6 * game.zoom;
  if (p.x > -m && p.x < W + m && p.y > -m && p.y < H + m) return;
  const c = { x: W / 2, y: H / 2 }, a = Math.atan2(p.y - c.y, p.x - c.x), pad = U * 0.07;
  const t = Math.min((W / 2 - pad) / Math.abs(Math.cos(a) || 1e-6), (H / 2 - pad) / Math.abs(Math.sin(a) || 1e-6));

// a small map of all of space in the corner: the planet, what the screen sees, and the ship

// the ship rattles: a mechanical engine shudders while it runs and jerks when it misfires;

// your ship's health: a big bar at the top left. Green when healthy, through yellow, to red;

function drawHealth() {

  const x = U * 0.04, y = U * 0.05;

    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "rgba(10,12,32,0.7)"; ctx.strokeStyle = low ? `rgba(255,77,109,${0.5 + low * 0.5})` : "rgba(124,140,255,0.5)"; ctx.lineWidth = 2;

  ctx.restore();

// the shots, each weapon its own look
function drawShots() {

    const Wp = WEAPONS[s.w], p = toScreen(s.x, s.y), sp = Math.hypot(s.vx, s.vy) || 1, ux = s.vx / sp, uy = s.vy / sp;
    if (s.w === "twin" || s.w === "laser" || s.w === "spread") {
      const len = size * (s.w === "laser" ? 0.55 : s.w === "twin" ? 0.16 : 0.08), wd = Math.max(2, Wp.r * size * (s.w === "spread" ? 2.2 : 1.6));

      ctx.beginPath(); ctx.moveTo(p.x - ux * len, p.y - uy * len); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = wd * 0.8; ctx.stroke();
    } else if (s.art && artImage(s.art.src)) {
      // a shot with its own drawing: the cannonball rolls as it flies (spin); a thorn points where it flies.
      // A faint glow in the weapon's color behind it

      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, d * (s.art.spin ? 1.1 : 0.45));

      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, d * (s.art.spin ? 1.1 : 0.45), 0, TAU); ctx.fill();
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(s.art.spin ? s.life * s.art.spin : Math.atan2(ux, -uy));

    } else if (s.w === "iris") {

}

// the crate a destroyed enemy leaves: turning, glowing in its weapon's color, the weapon's mark on it

// a small mark for each weapon (on its button and its crate)
function weaponIcon(w, x, y, r, color) {
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(2, r * 0.22);

    ctx.fillRect(-r * 0.7, r * 0.45, r * 1.4, r * 0.35);

    ctx.lineWidth = Math.max(1.5, r * 0.12); ctx.beginPath(); ctx.moveTo(-r * 0.45, r * 0.05); ctx.lineTo(-r * 0.15, -r * 0.15); ctx.lineTo(0, r * 0.12); ctx.lineTo(r * 0.2, -r * 0.2); ctx.lineTo(r * 0.45, 0); ctx.stroke();
  } else if (w === "laser") {
    ctx.beginPath(); ctx.moveTo(-r * 0.3, -r * 0.9); ctx.lineTo(r * 0.2, -r * 0.1); ctx.lineTo(-r * 0.2, r * 0.1); ctx.lineTo(r * 0.3, r * 0.9); ctx.stroke();

// the fire buttons: dark metal with the weapon's mark, a ring around that empties with the ammo.
// An empty one goes dim until it has refilled enough for a shot
function drawFire() {

    const w = slotWeapon(b.i), Wp = WEAPONS[w], ammo = slotAmmo(b.i), ready = ammo >= 1, pressed = game.fire[b.i] !== null;
    const r = b.r * (pressed && ready ? 0.92 : 1);

    if (pressed && ready) {
      const gl = ctx.createRadialGradient(b.x, b.y, r * 0.8, b.x, b.y, r * 1.7);

// the magic button. Its look follows the ship's style: for the brass ship, a turning brass gear.
// Ready: turns slowly and glints. Used: spins fast. Recharging: almost still, dark, and its brass
// fills back in around the rim as it gets ready again
function drawMagic() {
  const M = magicOf(shipById(game.ship));
  if (!M || trade.stage === "swapping") return;
  const b = magicButton(), ready = game.magicCool <= 0, k = ready ? 1 : 1 - game.magicCool / M.cool;
  if (M.look === "tail") drawTailButton(b, M, ready, k);
  if (M.look === "gear") {
    ctx.save(); ctx.translate(b.x, b.y);
    // a magic glow when ready
    if (ready) {
      const gl = ctx.createRadialGradient(0, 0, b.r * 0.6, 0, 0, b.r * 1.6);
      gl.addColorStop(0, `rgba(255,209,102,${0.28 + 0.12 * Math.sin(time * 3)})`); gl.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, b.r * 1.6, 0, TAU); ctx.fill();
    }

    const teeth = 12, ro = b.r, ri = b.r * 0.8;

      ctx.beginPath();
      for (let i = 0; i < teeth; i++) {

    const bg = ctx.createLinearGradient(-ro, -ro, ro, ro);

    ctx.globalAlpha = ready ? 1 : 0.7; ctx.fillStyle = bg; gearPath(); ctx.fill("evenodd");

    for (let i = 0; i < 6; i++) { const a = i * TAU / 6; ctx.beginPath(); ctx.moveTo(Math.cos(a) * b.r * 0.34, Math.sin(a) * b.r * 0.34); ctx.lineTo(Math.cos(a) * ri * 0.92, Math.sin(a) * ri * 0.92); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, ri * 0.92, 0, TAU); ctx.stroke();
    ctx.rotate(-game.gear);
    // in the hole: a little puff of smoke (what the magic does)
    ctx.fillStyle = ready ? "rgba(235,235,245,0.95)" : "rgba(150,150,160,0.6)";
    for (const [x, y, r] of [[-0.1, 0.05, 0.13], [0.08, 0.06, 0.12], [0, -0.07, 0.14]]) { ctx.beginPath(); ctx.arc(x * b.r, y * b.r, r * b.r, 0, TAU); ctx.fill(); }
    // glints running round the rim when ready (the magic)

// VEXAR's magic button: a dark chitin shell with a curled, segmented stinger tail inside.
// Ready: lime glow and the tail sways. Out: the tail uncurls. Recharging: dim, its lime rim fills back in
function drawTailButton(b, M, ready, k) {
  ctx.save(); ctx.translate(b.x, b.y);

    const gl = ctx.createRadialGradient(0, 0, b.r * 0.6, 0, 0, b.r * 1.6);
    gl.addColorStop(0, `rgba(184,255,58,${0.25 + 0.12 * Math.sin(time * 3)})`); gl.addColorStop(1, "rgba(0,0,0,0)");
