// a numbered run of drawings: name_01.webp ... with each frame's ms, and cues on chosen frames ({ 10: "fire" })
function frames(name, count, ms, cues = {}) {
  return Array.from({ length: count }, (_, i) => {
    const n = i + 1, f = [name + "_" + String(n).padStart(2, "0") + ".webp", ms(n)];
    if (cues[n]) f.push(cues[n]);
    return f;
  });
}

addEventListener("keyup", (e) => { keys[e.key] = false; });
function updateSimTilt(dt) {
  if (tilt.have) return;
  const s = tilt.sim, k = 1 - Math.exp(-dt * 6);
  const tp = HOLD_ANGLE + (keys.ArrowDown ? 25 : 0) - (keys.ArrowUp ? 25 : 0);
  const tr = (keys.ArrowRight ? 25 : 0) - (keys.ArrowLeft ? 25 : 0);
  s.pitch = lerp(s.pitch, tp, k); s.roll = lerp(s.roll, tr, k);
  tilt.pitch = s.pitch; tilt.roll = s.roll;
}

// ---------- sound (made on the fly, no files yet) ----------
const audio = {
  ctx: null, hum: null, humGain: null, humFilter: null,
  wake() {
    try {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.out = this.ctx.createGain(); this.out.gain.value = 0.8; this.out.connect(this.ctx.destination);
        for (const S of SHIPS) if (S.sfx) for (const n of S.sfxNames || SFX) this.load(S.sfx, n);   // recorded sounds, loaded once
      }

  },
  tone(freq, dur, type = "sine", vol = 0.2, slide = 0, delay = 0) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + dur + 0.05);
  },
  // recorded sound effects: art/ships/<ship>/sfx/<name>.wav
  bufs: {},
  load(dir, name) {
    const k = dir + "/" + name;
    if (this.bufs[k] !== undefined || !this.ctx) return;
    this.bufs[k] = null;
    fetch("art/ships/" + dir + "/sfx/" + name + ".wav").then((r) => r.arrayBuffer())
      .then((b) => this.ctx.decodeAudioData(b)).then((buf) => { this.bufs[k] = buf; }).catch(() => {});
  },
  sfx(dir, name, delay = 0, vol = 0.9) {
    if (!this.ctx || !dir) return;
    const buf = this.bufs[dir + "/" + name];
    if (!buf) { this.load(dir, name); return; }
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
    s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(this.out); s.start(this.ctx.currentTime + delay);
  },
  tap(n) { this.tone(180 + n * 90, 0.18, "triangle", 0.3, 0.6); this.tone(900 + n * 300, 0.12, "sine", 0.08, 1.5); },
  open() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.9, "triangle", 0.16, 1, i * 0.09)); this.tone(80, 0.8, "sine", 0.35, 0.5); },
  reveal(stars) { const base = [392, 494, 587, 784, 988]; for (let i = 0; i < 2 + stars; i++) this.tone(base[i % 5] * (i > 4 ? 2 : 1), 1.2, "sine", 0.12, 1, 0.12 * i); },
  bump() { this.tone(70, 0.2, "sine", 0.35, 0.6); },
  whoosh() { this.tone(200, 0.7, "sawtooth", 0.08, 6); },
  pop() { this.tone(600, 0.1, "sine", 0.15, 1.8); },
  empty() { for (let i = 0; i < 4; i++) this.tone(140 - i * 20, 0.09, "square", 0.08, 0.7, i * 0.12); },
  // a burst of noise (explosions, cannon)
  noise(dur, vol, cutoff = 900) {

    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = "lowpass"; f.frequency.value = cutoff; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.out); s.start();
  },
  shot(w) {

    if (w === "twin") { this.tone(1900, 0.03, "square", 0.04, 0.5); this.noise(0.06, 0.14, 2600); [0.04, 0.07, 0.1].forEach((d) => this.tone(700, 0.025, "triangle", 0.02, 0.8, d)); }

    else if (w === "ice") this.sfx("xeltar", "ice_shard", 0, 0.8);

    else if (w === "needle") this.sfx("zorian", "needle_fire", 0, 0.8);

    else if (w === "phase") this.sfx("vanta", "phase_launch");
    else if (w === "cross") { }   // (its launch sound plays at the release)
    else if (w === "crystal") this.sfx("xeltar", "crystal_launch");
    else if (w === "spike") { this.sfx("skarn", "shards_prime", 0, 0.5); this.sfx("skarn", "shards_fire", 0.03); }
    else if (w === "fossil") { }   // (the spit has its own sound)
    else if (w === "bolt") { this.sfx("orian", "pulse_prime", 0, 0.6); this.sfx("orian", "pulse_fire", 0.05); }
    else if (w === "solar") this.sfx("orian", "solar_beam");
    else if (w === "pulse") { this.sfx("lyth", "pulse_fire"); this.sfx("lyth", "shutters_close", 0.11, 0.6); }
    else if (w === "thorn") { this.tone(1100, 0.05, "triangle", 0.06, 0.4); this.noise(0.05, 0.1, 4000); }
    else if (w === "hive") { }   // (the jaws already made their sound)
    else if (w === "laser") this.tone(1500, 0.12, "sawtooth", 0.05, 0.3);

  // the iris winding up: a rising gear grind, then the latch clicks
  // (len: seconds until the shot, so the crank rises right up to the boom)
  windUp(len = 0.28) {

  },
  hit() { this.tone(950, 0.05, "square", 0.04, 0.5); },
  // the cannon: a deep thump, a sharp blast, a long rumble, and an echo across space
  cannon() {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime;

      this.echo = c.createDelay(1); this.echo.delayTime.value = 0.32;
      const fb = c.createGain(); fb.gain.value = 0.38; const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700;
      this.echoIn = c.createGain(); this.echoIn.gain.value = 0.5;

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
    o.connect(g); g.connect(this.out); g.connect(this.echoIn); o.start(t); o.stop(t + 1.4);
    const n = Math.round(c.sampleRate * 2.2), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) { const k = i / n; d[i] = (Math.random() * 2 - 1) * (i < c.sampleRate * 0.04 ? 1 : Math.pow(1 - k, 3) * 0.6); }
    const src = c.createBufferSource(), f = c.createBiquadFilter(), ng = c.createGain();
    src.buffer = buf; f.type = "lowpass"; f.frequency.setValueAtTime(5000, t); f.frequency.exponentialRampToValueAtTime(160, t + 1.5);
    ng.gain.value = 0.75; src.connect(f); f.connect(ng); ng.connect(this.out); ng.connect(this.echoIn); src.start(t);

  // your ship is hit / your ship blows up
  hurt() { this.noise(0.25, 0.4, 1500); this.tone(180, 0.3, "square", 0.1, 0.4); },
  boom() { this.noise(1.3, 0.6, 500); this.tone(70, 1.1, "sawtooth", 0.25, 0.3); this.tone(140, 0.6, "square", 0.1, 0.3); },
  pickup() { [660, 880, 1320].forEach((f, i) => this.tone(f, 0.25, "triangle", 0.12, 1, i * 0.07)); },
  // the steam engine: the fire goes out (chug... chug... cough), backfires (bang), the frame creaks
  sputter() {
    if (!this.ctx) return;
    [0, 0.14, 0.33, 0.6].forEach((d, i) => { setTimeout(() => this.noise(0.09, 0.25 - i * 0.05, 400), d * 1000); this.tone(95 - i * 12, 0.08, "square", 0.06, 0.7, d); });
  },
  backfire() { this.noise(0.22, 0.7, 3200); this.tone(55, 0.3, "sawtooth", 0.3, 0.4); },
  creak() {

  },
  // VEXAR: a thorn leaves the claw (a wet flick); the jaws spread and the egg is pushed out (a soft chitin creak, a plop)
  jaws() { this.tone(120, 0.4, "sawtooth", 0.035, 0.6); this.tone(900, 0.06, "triangle", 0.03, 0.5, 0.05); this.tone(700, 0.06, "triangle", 0.03, 0.5, 0.22); this.tone(180, 0.18, "sine", 0.25, 0.4, 0.42); },
  // the egg cracks open (crackle + a buzzing swarm), or is crushed (just the crackle)
  hatch(swarm) { for (let i = 0; i < 5; i++) this.tone(1800 + Math.random() * 1500, 0.025, "square", 0.03, 0.6, i * 0.035); this.noise(0.15, 0.2, 3000);
    if (swarm) [0.2, 0.26, 0.31].forEach((d, i) => this.tone(210 + i * 40, 0.5, "sawtooth", 0.03, 1.3, d)); },
  // LYTH's grinder: the tractor beam hums up; the teeth grind (short metal bursts, called again and again); out of range: a dull no
  beam() { this.tone(180, 0.9, "sine", 0.12, 2.2); this.tone(360, 0.9, "triangle", 0.04, 2.2); this.tone(90, 0.9, "sawtooth", 0.03, 1.5); },
  grind() { this.noise(0.09, 0.22, 5200); this.tone(70 + Math.random() * 30, 0.1, "sawtooth", 0.07, 0.8); this.tone(2400 + Math.random() * 1500, 0.04, "square", 0.025, 0.6); },
  // TALUS: rock crunching together as it grows (and as it bursts)
  crunch() { this.noise(0.25, 0.4, 700); for (let i = 0; i < 6; i++) this.tone(200 + Math.random() * 500, 0.05, "square", 0.04, 0.5, i * 0.04); this.tone(60, 0.5, "sine", 0.3, 0.6, 0.05); },
  nope() { this.tone(160, 0.12, "square", 0.06, 0.7); this.tone(120, 0.16, "square", 0.05, 0.7, 0.1); },
  // the tail: a whip-like lash going out; a zap while it drains someone
  lash() { this.tone(300, 0.5, "sawtooth", 0.05, 0.35); this.noise(0.4, 0.15, 2200); this.tone(1400, 0.12, "triangle", 0.04, 0.5, 0.35); },
  zap() { this.tone(900 + Math.random() * 300, 0.07, "square", 0.04, 0.4); },
  // the smoke hatches: the vent covers slide open (a metal scrape and a clunk)
  vents() { this.noise(0.35, 0.18, 3500); this.tone(420, 0.3, "sawtooth", 0.03, 1.6); this.tone(90, 0.12, "square", 0.08, 0.6, 0.3); },
  // the smoke screen: a long hiss, and a little magic chime
  magic() { this.noise(2.8, 0.3, 1400); [988, 1319, 1568, 1976].forEach((f, i) => this.tone(f, 0.5, "sine", 0.06, 1, 0.08 * i)); },

  engine(power) {

      this.hum = c.createOscillator(); this.hum.type = "sawtooth"; this.hum.frequency.value = 52;
      this.humFilter = c.createBiquadFilter(); this.humFilter.type = "lowpass"; this.humFilter.frequency.value = 200;

  }

function fillAmmo() { const S = shipById(game.ship); game.ammo = weaponsOf(S).map((w) => WEAPONS[w].ammo); }
// start: just above the planet, so its pull is felt at once
function placeShip() {
  game.x = WW / 2; game.y = WH / 2 - U * 1.6; game.vx = game.vy = 0; game.ang = 0; game.lx = game.ly = 0;
  game.talus = { stage: 0, from: 0, t: 99, ring: 0, contact: false, colors: [] };   // TALUS starts as a seed again
  if (game.ship) { game.fuel = shipStats(shipById(game.ship)).fuel; fillAmmo(); }

const gift = { taps: 0, wob: 0, squash: 0, hint: 0 };
let time = 0;

// ---------- stars (three depths, for the window-into-space feel) ----------
let stars = [];
function makeStars() {
  stars = [];
  const n = Math.round((W * H) / 2600);
  for (let i = 0; i < n; i++) {
    const d = Math.random() < 0.6 ? 0 : Math.random() < 0.7 ? 1 : 2;
    stars.push({ x: Math.random() * W, y: Math.random() * H, d, r: [0.6, 1.1, 1.8][d] * (0.7 + Math.random() * 0.6), tw: Math.random() * 6.28 });
  }
}

// ---------- particles ----------
const parts = [];
function burst(x, y, n, colors, speed = 1, size = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.2 + Math.random()) * U * 0.6 * speed;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.6 + Math.random() * 0.9,
      c: colors[i % colors.length], s: (2 + Math.random() * 4) * size, star: Math.random() < 0.35 });
  }
}
// the same, at a place in space (it stays there while the camera moves)
// (dvx, dvy: the whole cloud drifts along, e.g. with the ship that blew up)
function burstAt(wx, wy, n, colors, speed = 1, size = 1, dvx = 0, dvy = 0) {
  const from = parts.length;
  burst(wx, wy, n, colors, speed, size);
  for (let i = from; i < parts.length; i++) { parts[i].w = true; parts[i].dx = dvx; parts[i].dy = dvy; }
}

// ======================================================================
//  TOUCH
// ======================================================================
let swipe = null;
cv.addEventListener("pointerdown", (e) => {
  audio.wake();
  if (trade.stage && tradeTap(e.clientX, e.clientY)) return;
  if (hangar.open) { hangarTap(e.clientX, e.clientY); return; }
  if (game.stage === "fly" && !trade.stage && hitDuel(e.clientX, e.clientY)) { duelButton(); return; }
  if (game.stage === "fly" && !trade.stage && !duel.stage && hitHangar(e.clientX, e.clientY)) { hangar.open = true; hangar.t = 0; audio.pop(); return; }
  // the left thumb on the thrust button (another finger can still swipe at the same time)
  if (game.stage === "fly" && !game.locked && hitThrust(e.clientX, e.clientY)) {
    game.thrust = e.pointerId; buzz(12);
    game.stick = { ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };   // the joystick starts where the thumb lands
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  // the right thumb on a fire button (hold to keep firing); the gear = magic
  if (game.stage === "fly" && trade.stage !== "swapping") {
    if (hitMagic(e.clientX, e.clientY)) { game.magicFinger = e.pointerId; useMagic(); return; }
    const b = hitFire(e.clientX, e.clientY);
    if (b) {
      game.fire[b.i] = e.pointerId; buzz(8);
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      return;
    }
  }
  swipe ={ id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() };
  if (game.stage === "gift" && hitGift(e.clientX, e.clientY)) { tapGift(); swipe = null; return; }
  if (game.stage === "opening" && game.t > 2.2) { toFly(); swipe = null; return; }
  const p = zoomed(shipScreen());
  if (game.stage === "fly" && Math.hypot(e.clientX - p.x, e.clientY - p.y) < shipSize() * 0.6 * game.zoom) { game.card = 2.5; audio.pop(); }
});
// dragging the thumb on the thrust button steers, like a joystick
cv.addEventListener("pointermove", (e) => {
  if (e.pointerId !== game.thrust || !game.stick) return;
  game.stick.dx = e.clientX - game.stick.ox; game.stick.dy = e.clientY - game.stick.oy;
});
function fingerUp(e) {
  if (e.pointerId === game.magicFinger) { game.magicFinger = null; return; }
  if (e.pointerId === game.thrust) { game.thrust = null; game.stick = null; return; }
  const f = game.fire.indexOf(e.pointerId);
  if (f >= 0) { game.fire[f] = null; return; }
  if (!swipe || e.pointerId !== swipe.id) return;
  const up = swipe.y - e.clientY;
  if (e.type === "pointerup" && up > H * SWIPE_UP && performance.now() - swipe.t < 900 && game.stage === "fly") openTrade();
  swipe = null;
}
cv.addEventListener("pointerup", fingerUp);
cv.addEventListener("pointercancel", fingerUp);
addEventListener("blur", () => { game.magicFinger = null; game.thrust = null; game.stick = null; game.fire = [null, null, null]; });
// on a computer: the space bar is the thrust button; Z, X, C are fire buttons 1, 2, 3
const FIRE_KEYS = ["z", "x", "c"];
addEventListener("keydown", (e) => {
  if (e.key === " " && game.stage === "fly" && !game.locked) game.thrust = "key";
  const f = FIRE_KEYS.indexOf(e.key.toLowerCase());
  if (f >= 0 && game.stage === "fly") game.fire[f] = "key";
  if (e.key.toLowerCase() === "v" && game.stage === "fly" && !e.repeat) { game.magicFinger = "key"; useMagic(); }   // V = the magic button
});
addEventListener("keyup", (e) => {
  if (e.key.toLowerCase() === "v" && game.magicFinger === "key") game.magicFinger = null;
  if (e.key === " " && game.thrust === "key") game.thrust = null;
  const f = FIRE_KEYS.indexOf(e.key.toLowerCase());
  if (f >= 0 && game.fire[f] === "key") game.fire[f] = null;
});

// Android back: close the bubble or card first, then leave
window.shipBack = () => {
  if (hangar.open) { hangar.open = false; return true; }
  if (trade.stage && trade.stage !== "swapping") { if (trade.stage === "offer" || trade.stage === "waiting") link.send({ t: "no" }); endTrade(); return true; }

// ======================================================================
//  THE GIFT
// ======================================================================
function giftBox() { const s = U * 0.42; return { cx: W / 2, cy: H * 0.52, s }; }
function hitGift(x, y) { const g = giftBox(); return Math.abs(x - g.cx) < g.s * 0.65 && Math.abs(y - g.cy) < g.s * 0.7; }
function tapGift() {
  gift.taps++; gift.wob = 1; gift.squash = 1; gift.hint = 0;
  const g = giftBox();
  burst(g.cx, g.cy - g.s * 0.3, 8 + gift.taps * 6, ["#ffd166", "#c77dff", "#ffffff"], 0.6, 0.8);
  audio.tap(gift.taps); buzz(20 + gift.taps * 15);
  if (gift.taps >= GIFT_TAPS) {
    // decided now and saved at once, so closing the app mid-animation keeps the same ship
    game.ship = TRY_SHIP || chooseShip();
    saveShip(game.ship, "gift");
    game.stage = "opening"; game.t = 0;
    audio.open(); buzz(80);
  }
}
function toFly() {
  game.stage = "fly"; game.t = 0;
  game.fuel = shipStats(shipById(game.ship)).fuel; game.locked = false;
  fillAmmo();
  game.card = 0;
  spawnEnemy();
}

// ======================================================================
//  UPDATE
// ======================================================================
function shipSize() { return U * 0.26; }

function update(dt) {
  time += dt; game.t += dt;
  tintStep();
  updateSimTilt(dt);
  gift.wob = Math.max(0, gift.wob - dt * 2.2);
  gift.squash = Math.max(0, gift.squash - dt * 5);
  if (game.stage === "gift") gift.hint += dt;
  game.card = Math.max(0, game.card - dt);

  const c = controlFromTilt(tilt);
  game.side = c.side; game.fwd = c.fwd;


  if (game.stage === "opening") {
    if (game.t > 1.25 && !game.burstDone) {
      game.burstDone = true;
      const R = RARITY[shipById(game.ship).rarity], g = giftBox();
      burst(g.cx, H * 0.4, 50 + R.stars * 25, [R.color, "#ffffff", shipById(game.ship).hull], 1.2, 1.2);
      audio.reveal(R.stars); buzz(40 * R.stars);
    }
    if (game.t > 6) toFly();
  }
  if (game.stage === "arrive" && game.t > 0.9) { game.stage = "fly"; game.t = 0; spawnEnemy(); }

  game.shakeT = Math.max(0, game.shakeT - dt * 2.5);
  updateCosmos(dt);
  game.hurt = Math.max(0, game.hurt - dt);
  game.arriveT = Math.max(0, (game.arriveT || 0) - dt * 1.5);
  if (game.stage === "fly" && trade.stage !== "swapping") {
    if (game.dead) { game.dead -= dt; game.thrust = null; game.stick = null; game.fire = [null, null, null]; if (game.dead <= 0) respawnShip(); }
    else { flyShip(dt); updateMagic(dt); }
    updateEnemy(dt); updateWeapons(dt); if (!game.dead) updateCrate(dt);
  }
  updateTrade(dt);
  updateDuel(dt);
  if (hangar.open) hangar.t += dt;

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    if (p.w) { p.x += (p.dx || 0) * dt; p.y += (p.dy || 0) * dt; }
    if (p.life > p.max) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.exp(-dt * 2.5); p.vy *= Math.exp(-dt * 2.5);
  }
}

// The player's ship: the tilt points the nose, the left thumb fires the engine
function flyShip(dt) {
  const S = shipById(game.ship), st = shipStats(S);
  let target = null, turn = 0;
  if (STEER === "turn") turn = game.side;
  else { target = headingTarget(game); turn = Math.min(1, Math.hypot(game.side, game.fwd) * 2); }
  // the joystick wins over the tilt while the thumb is dragged out of the middle
  const sh = game.stick ? stickHeading(game.stick.dx, game.stick.dy, thrustButton().r) : null;
  if (sh !== null) { target = sh; turn = 1; }
  const wasEmpty = game.locked;
  // out of fuel: the engine stops, but a thumb still holding keeps steering, and the engine
  // starts again by itself once the tank has refilled enough
  if (soaking()) turn *= magicOf(S).steer;   // ORIAN drinking light: hard to steer
  const anchored = anchoring();
  if (game.dash) {   // KRAAL's dash: it flies by itself (updateDash), past gravity and the engine
    game.x = (((game.x + game.vx * dt) % WW) + WW) % WW; game.y = (((game.y + game.vy * dt) % WH) + WH) % WH;
    return;
  }
  if (game.inked > 0) {   // covered in the other player's ink: no steering, no engine, drifting on (the planet bounces it)
    game.inked -= dt;
    const v = game.inkV || { vx: game.vx, vy: game.vy };
    const h = moveShip(game, S, { target: game.ang, turn: 0, thrust: false }, dt);
    if (h) game.inkV = { vx: game.vx, vy: game.vy }; else { game.vx = v.vx; game.vy = v.vy; game.inkV = v; }
    if (game.inked <= 0) game.inkV = null;
    return;
  }
  const hit = moveShip(game, S, anchored ? { target: game.ang, turn: 0, thrust: false } : { target, turn, thrust: game.thrust !== null }, dt);
  if (anchored) {   // ZORIAN's anchor: it stops, holds and spins; after `hold` seconds it lets go
    const M = magicOf(S), k = Math.exp(-dt * M.brake);
    game.vx *= k; game.vy *= k; game.ang = wrapAngle(game.ang + M.spin * dt);
    game.anchor.t += dt;
    if (game.anchor.t >= M.hold) { game.anchor = null; game.magicCool = M.cool; }
  }
  // LYTH: the engine vent plates slide open / shut (a sound only when it changes)
  const burning = game.thrust !== null && !game.locked;
  if (burning !== !!game.burning) { game.burning = burning; if (S.sfx) audio.sfx(S.sfx, burning ? "thrusters_open" : "thrusters_close", 0, 0.7); }
  if (game.locked && !wasEmpty) { if (game.thrust === "key") game.thrust = null; audio.empty(); buzz(120); }
  if (hit > U * 0.15) { audio.bump(); buzz(Math.min(70, hit / U * 50)); }

  // the camera: with an enemy around it looks at the middle between the two ships (like Star Control);
  // alone, it leads a little in the direction of flight
  const lk = 1 - Math.exp(-dt * 2);
  let tx = clamp(game.vx * 0.22, -W * 0.22, W * 0.22), ty = clamp(game.vy * 0.22, -H * 0.22, H * 0.22);
  if (enemyShown()) {
    const lim = 0.5 / ZOOM_MIN - 0.15;   // keep our own ship on screen even when fully zoomed out
    tx = clamp(wrapDelta(enemy.x - game.x, WW) / 2, -W * lim, W * lim);
    ty = clamp(wrapDelta(enemy.y - game.y, WH) / 2, -H * lim, H * lim);
  }
  game.lx = lerp(game.lx, tx, lk); game.ly = lerp(game.ly, ty, lk);
  // zoom out just enough to see the enemy too (zooming in again is slower and calmer)
  let z = 1;
  if (enemyShown()) {
    const e = toScreen(enemy.x, enemy.y), m = shipSize() * 0.7;
    const dx = Math.abs(e.x - W / 2), dy = Math.abs(e.y - H / 2);
    z = clamp(Math.min(dx ? (W / 2 - m) / dx : 1, dy ? (H / 2 - m) / dy : 1, 1), ZOOM_MIN, 1);
  }
  game.zoom = lerp(game.zoom, z, 1 - Math.exp(-dt * (z < game.zoom ? 3 : 1)));
  audio.engine(game.power);
}

// One step of flying for ANY ship (player or enemy): same rules for both, like in Star Control.
// c: { target: heading to turn to (or null), turn: how hard (0..1, or -1..1 when there is no target), thrust: true/false }
// returns how hard it hit something (0 = nothing)
function moveShip(o, S, c, dt) {
  const st = shipStats(S), size = shipSize();
  if (o === game && game.soak && game.soak.boost) { const M = magicOf(S); st.push *= M.boost; st.top *= M.boost; }   // ORIAN charged: twice as fast
  // 1. turning, at the ship's own speed
  const before = o.ang;

  else o.ang = turnToward(o.ang, c.target, st.turn * dt * c.turn);
  o.ang = wrapAngle(o.ang);
  o.spin = lerp(o.spin, wrapAngle(o.ang - before) / Math.max(dt, 0.001), 1 - Math.exp(-dt * 10));

  // 2. engine and fuel (fuel fills back up by itself while the engine rests)

  const dead = S.steam && steamEngine(o, S, c.thrust && !o.locked && o.fuel > 0, dt);
  const f = fuelStep(o.fuel, o.locked, c.thrust && !dead, st, dt);
  const on = c.thrust && !dead && !o.locked && o.fuel > 0;
  if (on) {
    o.vx += Math.sin(o.ang) * st.push * U * dt;
    o.vy -= Math.cos(o.ang) * st.push * U * dt;
  }
  o.fuel = f.fuel; o.locked = f.locked;
  o.power = lerp(o.power, on ? 1 : 0, 1 - Math.exp(-dt * 10));

  // 3. the planet in the middle pulls (nearest way round, since space wraps)
  const R = planetR();
  const dx = wrapDelta(o.x - WW / 2, WW), dy = wrapDelta(o.y - WH / 2, WH);
  const g = gravityAt(dx, dy, U, R, body().pull);
  o.vx += g.ax * dt; o.vy += g.ay * dt;

  const sp = Math.hypot(o.vx, o.vy), top = st.top * U;

  o.x += o.vx * dt; o.y += o.vy * dt;
  o.x = ((o.x % WW) + WW) % WW; o.y = ((o.y % WH) + WH) % WH;

  // 5. bounce off the planet. Stars, black holes and lava burn a ship that touches them (yours: health; see touchBurn)

  const d = Math.hypot(dx, dy), touch = R + size * 0.32;

  }
  let hit = 0;
  if (d < touch) {
    const nx = dx / (d || 1), ny = dy / (d || 1), vn = o.vx * nx + o.vy * ny;
    o.x += nx * (touch - d); o.y += ny * (touch - d);
    if (vn < 0) {
      o.vx -= 1.6 * vn * nx; o.vy -= 1.6 * vn * ny;
      if (-vn > U * 0.15 && !o.hitCool) {
        o.hitCool = 0.3; hit = -vn;
        const p = toScreen(o.x - nx * size * 0.3, o.y - ny * size * 0.3);
        burst(p.x, p.y, 12, ["#ffffff", S.trim, "#b8a3ff"], 0.45, 0.7);
      }
    }
  }
  return hit;
}

// ---------- the steam engine (mechanical ships) ----------
// Runs every moment for a ship with  steam: true.  running = the engine is being fired.
// Returns true while the fire is out (the engine gives no push, only smoke).
function steamEngine(o, S, running, dt) {
  const me = o === game, R = Math.random;
  o.sputter = Math.max(0, (o.sputter || 0) - dt);

    // just lit: it often bangs
    if (!o.wasRunning && R() < 0.3) backfire(o, S, me);
    if (o.sputter <= 0 && R() < STEAM.dies * dt) {
      o.sputter = STEAM.out[0] + R() * (STEAM.out[1] - STEAM.out[0]);   // the fire goes out
      if (me) { audio.sputter(); buzz(40); }
    } else if (o.sputter <= 0 && R() < STEAM.backfire * dt) backfire(o, S, me);
    if (me && R() < STEAM.creak * dt) audio.creak();
    // out: thick puffs of smoke; burning: a little steam now and then
    if (R() < (o.sputter > 0 ? 14 : 3) * dt) for (const e of exhausts(o, S)) smokeAt(e.x, e.y, o, S, o.sputter > 0 ? 1 : 0.5);
  }
  // hard turns make the old frame groan
  if (me && Math.abs(o.spin) > 2.5 && R() < 0.5 * dt) audio.creak();

  const bx = -Math.sin(o.ang) * U * 0.5, by = Math.cos(o.ang) * U * 0.5;   // the blast shoots out the back
  burstAt(e.x, e.y, 14, ["#ffffff", "#ffd166", "#ff8c1a", "#ff4d00"], 0.35, 1, o.vx + bx * 0.3, o.vy + by * 0.3);
  smokeAt(e.x, e.y, o, S, 1.2);

// where the engines are, in space, right now
function exhausts(o, S) {

    const p = rotatePt(ex * size, ((S.engineYs ? S.engineYs[n] : S.engineY) + 0.05) * size, o.ang);
    return { x: o.x + p.x, y: o.y + p.y };

// one puff of smoke behind a ship. big: 1 = a normal puff; the smoke screen uses bigger, darker, longer ones
function smokeAt(x, y, o, S, big = 1, life = 1.6) {

  const g = 70 + Math.round(Math.random() * 50);

    life: 0, max: life * (0.7 + Math.random() * 0.6), s: shipSize() * 0.07 * big, grow: 1.6 + Math.random(),

// ---------- the body in the middle (BODIES) ----------
// touching a hot one: health goes, a little at a time (the red flash only every few points)
function touchBurn(dt) {
  const B = body();
  if (!B.burn || game.dead) return;
  cosmos.burn += B.burn * dt;
  if (Math.random() < dt * 20) burstAt(game.x, game.y, 3, [B.color, "#ffffff"], 0.2, 0.4, game.vx, game.vy);
  if (cosmos.burn >= 5) { damageShip(Math.floor(cosmos.burn)); cosmos.burn -= Math.floor(cosmos.burn); }
}
// it changes each round: the old one shrinks away and the new one grows in its place, and its name shows for a moment
const cosmos = { body: 0, prev: null, morph: 1, label: 0, burn: 0, started: false };
function body() { return BODIES[cosmos.body]; }
function planetR() { return U * body().r; }
function setBody(i, show = true) {

  cosmos.prev = show ? cosmos.body : null; cosmos.body = i; cosmos.morph = show ? 0 : 1; cosmos.label = show ? 3 : 0;
  if (show) { audio.whoosh(); }
}
function updateCosmos(dt) {

// ---------- magic: the gear button ----------

  if (M.look === "anchor") {   // ZORIAN: a tap anchors it (it stops and spins); a second tap lets it go
    if (game.anchor) { game.anchor = null; game.magicCool = M.cool; return; }
    game.anchor = { t: 0 }; audio.sfx(S.sfx, "thread_arm", 0, 0.6); buzz(30);

  }

    if (game.vtint) tintPreload(game.vtint);

// the smoke is out: thick smoke starts pouring from the engines; the enemy loses you, and only knows where you were

// ink clouds (anyone's): each plays its frames where it was let out, turned the way its ship faced then

// ---------- TALUS: growing from the body in the middle, and shattering ----------
function shipScale() {

}
// crashing into the body: once per contact (it has to leave and come back), and only when the light ring is gone

function updateTalus(dt) {

// which weapon each button fires right now (null = no such button now)

function updateWeapons(dt) {

    if (i === 1 && slotWeapon(1) && WEAPONS[slotWeapon(1)].converge) { crossHold(dt); continue; }   // KRAAL: hold to aim, let go to fire
    if (i === 1 && slotWeapon(1) && WEAPONS[slotWeapon(1)].flail) {   // ZORIAN's ball: each press is one swing
      if (game.fire[1] !== null && !game.trapLatch && game.cool[1] <= 0) { game.trapLatch = true; flailSwing(); }
      if (game.fire[1] === null) game.trapLatch = false;
      continue;
    }
    if (i === 1 && slotWeapon(1) && (WEAPONS[slotWeapon(1)].trap || WEAPONS[slotWeapon(1)].rift || WEAPONS[slotWeapon(1)].thread)) {   // SKARN's jaw, DRAKON's rift, ZORIAN's thread: each new press is one input
      if (game.fire[1] !== null && !game.trapLatch) { game.trapLatch = true; const W1 = WEAPONS[slotWeapon(1)]; if (W1.rift) riftPress(); else if (W1.thread) threadPress(); else trapPress(); }
      if (game.fire[1] === null) game.trapLatch = false;

  }

  if (game.loot) {

    if (game.loot.ammo < 1 && game.loot.show <= 0) { game.loot = null; game.fire[2] = null; }
  }

  for (let k = shots.length - 1; k >= 0; k--) {

      s.vx = t.vx; s.vy = t.vy;

    if (Wp.gravity) { const g = gravityAt(wrapDelta(s.x - WW / 2, WW), wrapDelta(s.y - WH / 2, WH), U, planetR(), body().pull); s.vx += g.ax * dt; s.vy += g.ay * dt; }
    s.x = (((s.x + s.vx * dt) % WW) + WW) % WW; s.y = (((s.y + s.vy * dt) % WH) + WH) % WH;

    if (Wp.phase && phaseStep(s, Wp, dt)) continue;   // VANTA's drop inside the planet
    if (Wp.phase) phaseTrail(s);
    if (s.life > Wp.life) { if (s.w === "iris") burstAt(s.x, s.y, 10, [Wp.color, "#fff3b0"], 0.25, 0.7); shots.splice(k, 1); continue; }

    }

    // into the other player's open jaw (SKARN): caught, no hit, and their phone is told
    if (enemy.remote && enemy.on && duel.net && duel.net.kc && shipById(enemy.ship).anim && shipById(enemy.ship).anim.trap &&

      burstAt(s.x, s.y, 8, ["#ff8a5a", "#ffffff"], 0.2, 0.4); shots.splice(k, 1); continue;

// a trigger pull. With a ship that has firing drawings (anim), the drawings lead:
//  primary (button 1): each shot jumps to the frame where that barrel flashes, then the frames settle back to idle
//  secondary (button 2): the iris winds up first; the shot leaves at the "fire" frame (the big flash)
function shoot(i) {
  const w = slotWeapon(i), Wp = WEAPONS[w], S = shipById(game.ship), A = S.anim;
  game.cool[i] = Wp.cool;

  if (A && A.secondary && i === 1 && Wp.chord) { game.anim = { seq: "secondary", t: 0, chord: [], w }; return; }   // CANTOR: the chord charges
  if (A && A.secondary && i === 1) {   // the secondary waits for its wind-up
    game.anim = { seq: "secondary", t: 0, pending: w };
    if (w === "iris") audio.windUp(Math.max(0, cueTime(A.secondary, "fire")) / 1000);
    else if (w === "cross") audio.sfx(S.sfx, "cross_charge");
    else if (w === "phase") audio.sfx(S.sfx, "phase_charge");
    else if (w === "chord") { }   // (each groove plays its own note as it charges)
    else if (w === "crystal") audio.sfx(S.sfx, "ice_charge");
    else if (w === "solar") {   // the charge, a click at each mirror's hinge, and the mirrors folding back
      audio.sfx(S.sfx, "solar_charge");
      for (let k = 0; k < 5; k++) audio.sfx(S.sfx, "mirror_step", k * 0.082, 0.7);
      audio.sfx(S.sfx, "mirror_close", 1.39, 0.8);
    } else audio.jaws();
    return;
  }
  const guns = gunsOf(S, w), b = Wp.both ? 0 : game.barrel[i]++ % guns.length;
  // the firing frames do not cut into the ship's other sequences (the heavy cannon, the smoke hatches, the jaw...)
  if (A && A.primary && i === 0 && !(game.anim && game.anim.seq !== "primary"))
    game.anim = { seq: "primary", t: Math.max(0, cueTime(A.primary, b === 0 ? "left" : "right")) };
  if (Wp.both) for (const g of guns) spawnShots(w, g); else spawnShots(w, guns[b]);
  audio.shot(w);
}
// the shots leave from a gun point on the ship, turned with the ship
function spawnShots(w, g) {
  const Wp = WEAPONS[w], S = shipById(game.ship), size = shipSize() * shipScale();
  const m = rotatePt(g[0] * size, g[1] * size, game.ang);
  const x = game.x + m.x, y = game.y + m.y;

  if (Wp.converge) { crossRelease(w, S); return; }
  const pow = w === "spike" && game.trap ? game.trap.power || 0 : 0;   // SKARN's powered-up shards
  if (Wp.beam) { game.beam = { w, t: 0, ang: game.ang, hit: false }; duelSend({ t: "bm", a: +game.ang.toFixed(3) }); shake(0.3); buzz(90); return; }

    const dir = game.ang + a + (Wp.rear ? Math.PI : 0), v = Wp.speed * U;   // (XELTAR's crystal: out of the stern)
    shots.push({ w, x, y, vx: game.vx + Math.sin(dir) * v, vy: game.vy - Math.cos(dir) * v, life: 0, pow });

    const lvl = game.vtint || 0;
    for (const q of shots.slice(-pelletAngles(Wp).length)) q.lvl = lvl;
    if (Wp.phase) {
      const T = VANTA_TINTS[lvl];
      game.vtint = 0;
      burstAt(x, y, 26 + lvl * 10, T.fx, 0.6 + lvl * 0.15, 0.9, game.vx, game.vy);
      rings.push({ x, y, t: 0, max: 0.35, r: shipSize() * (0.6 + lvl * 0.15), c: T.color });
      game.vx -= Math.sin(game.ang) * U * 0.14; game.vy += Math.cos(game.ang) * U * 0.14;   // the kick

    game.vx -= Math.sin(game.ang) * U * 0.16; game.vy += Math.cos(game.ang) * U * 0.16;
    shake(0.9); buzz(160);

  }
}
// CANTOR's chord: the five bolts, each from its groove where it is now, each on its own remembered heading

// ---------- LYTH's ring ----------
// unlock: the three latches open (amber). out: the ring is let go toward the nose, spinning, and the planet pulls it.
// back: it comes home to wherever the ship is now, lining up with its heading. lock: the latches close again.
// It hurts the enemy once on the way out and once on the way back, if it passes over it.
function startRing(w, S) {
  game.ring = { w, t: 0, phase: "unlock", x: game.x, y: game.y, vx: 0, vy: 0, ang: game.ang, lift: 0, trace: [], hitOut: false, hitBack: false };
  audio.sfx(S.sfx, "latches_unlock");
}
function updateRing(dt) {
  const R = game.ring, S = shipById(game.ship);

  if (!S.anim || !S.anim.ring) { game.ring = null; return; }
  const Wp = WEAPONS[R.w], was = R.phase;
  R.t += dt; R.phase = ringPhase(Wp, R.t);
  if (was === "unlock" && R.phase !== "unlock") {   // let go, toward the nose
    const v = Wp.speed * U;
    Object.assign(R, { x: game.x, y: game.y, vx: game.vx + Math.sin(game.ang) * v, vy: game.vy - Math.cos(game.ang) * v, ang: game.ang });
    audio.sfx(S.sfx, "ring_release");
  }
  if (was === "out" && R.phase !== "out") R.from = { x: R.x, y: R.y, vx: R.vx, vy: R.vy, ang: R.ang };
  if (was === "back" && R.phase !== "back") { audio.sfx(S.sfx, "ring_capture"); buzz(30); }
  if (!R.phase) { audio.sfx(S.sfx, "ring_lock"); game.ring = null; return; }
  if (R.phase === "out") {
    const g = gravityAt(wrapDelta(R.x - WW / 2, WW), wrapDelta(R.y - WH / 2, WH), U, planetR(), body().pull);
    R.vx += g.ax * dt; R.vy += g.ay * dt;
    R.x = (((R.x + R.vx * dt) % WW) + WW) % WW; R.y = (((R.y + R.vy * dt) % WH) + WH) % WH;
    R.ang += 6.4 * dt;

    R.x = (((F.x + wrapDelta(game.x - F.x, WW) * q + F.vx * lead) % WW) + WW) % WW;
    R.y = (((F.y + wrapDelta(game.y - F.y, WH) * q + F.vy * lead) % WH) + WH) % WH;
    let a = F.ang + TAU * 1.1 * p;

      R[leg] = true;
      hitEnemy({ x: enemy.x, y: enemy.y, vx: R.vx || game.vx, vy: R.vy || game.vy }, Wp);

// the ring flying on its own (yours, or the other player's in a duel)

    ctx.beginPath(); R.trace.forEach((q, i) => { const s = toScreen(q.x, q.y); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); }); ctx.stroke();

  const e = { x, y, vx: game.vx * 0.5 + Math.sin(game.ang) * v, vy: game.vy * 0.5 - Math.cos(game.ang) * v, ang: game.ang,
    t: 0, ht: -1, crushed: false, w: "hive", ship: S.id, kind };

}
// who an egg's hunters go after: mine chase the enemy; the other player's (in a duel) chase me
function eggTarget(e) {

}
function updateEggs(dt) {
  const size = shipSize();

// moves the firing drawings along; each shot cue fires once, even if a slow frame jumps past it
function updateAnim(dt) {
  const a = game.anim, A = shipById(game.ship).anim;

  const seq = A[a.seq], before = a.t;
  a.t += dt * 1000;

  }

    const S = shipById(game.ship), Wp = WEAPONS[a.w];

      const i = a.chord.length;

  if (i === 0 && game.trap && game.trap.mode !== "idle" && game.trap.mode !== "loaded") return true;

// ======================================================================
//  DRAWING

function drawSpace() {
  const g = ctx.createRadialGradient(W * 0.5, H * 0.35, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.9);
  g.addColorStop(0, "#141a3a"); g.addColorStop(0.55, "#090b1e"); g.addColorStop(1, "#030308");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // so nothing jumps when the ship wraps round the edge of space
  const cx = game.x + game.lx, cy = game.y + game.ly;
  for (const s of stars) {
    const k = [0.1, 0.3, 0.6][s.d];
    const x = (((s.x - cx * k) % W) + W) % W - tilt.roll * (s.d + 1) * U * 0.002;
    const y = (((s.y - cy * k) % H) + H) % H + (tilt.pitch - HOLD_ANGLE) * (s.d + 1) * U * 0.002;
    ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(time * 1.3 + s.tw));

  for (let i = half.length - 1; i >= 0; i--) ctx.lineTo(-half[i][0], half[i][1]);

// one ship, nose up, centered at (x, y), `size` long
function drawShip(S, x, y, size, o = {}) {

    // a steam engine's flame is ragged and jumpy
    const rag = S.steam ? (Math.random() - 0.3) * 0.12 * power : 0;

    for (const sy of [-1, 1]) { ctx.beginPath(); ctx.moveTo(-r * 0.85, sy * r * 0.15); ctx.lineTo(r * 0.85, sy * r * 0.15);
      for (let i = 0; i < 4; i++) { const x = -r * 0.6 + i * r * 0.4; ctx.moveTo(x - r * 0.12, sy * r * 0.15); ctx.lineTo(x, sy * r * 0.45); ctx.lineTo(x + r * 0.12, sy * r * 0.15); }
      ctx.stroke(); }
    const n = game.trap ? game.trap.stored : 0;
    for (let i = 0; i < n; i++) { ctx.fillStyle = "#ff8a5a"; ctx.beginPath(); ctx.arc((i - (n - 1) / 2) * r * 0.32, r * 0.78, r * 0.11, 0, TAU); ctx.fill(); }
  } else if (w === "bolt") {   // a spark of light
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.25, -r * 0.1); ctx.lineTo(0, r); ctx.lineTo(-r * 0.25, -r * 0.1); ctx.closePath(); ctx.fill();
  } else if (w === "solar") {   // a fan of mirrors under a beam
    for (let i = 0; i < 5; i++) { const a = Math.PI / 2 + (i - 2) * 0.45; ctx.beginPath(); ctx.moveTo(0, -r * 0.05); ctx.lineTo(Math.cos(a - 0.17) * r * 0.85, Math.sin(a - 0.17) * r * 0.85); ctx.lineTo(Math.cos(a + 0.17) * r * 0.85, Math.sin(a + 0.17) * r * 0.85); ctx.closePath(); ctx.fill(); }
    ctx.fillRect(-r * 0.09, -r, r * 0.18, r * 0.85);
  } else if (w === "shard") {   // three splinters
    for (const dx of [-0.45, 0, 0.45]) { ctx.beginPath(); ctx.moveTo(dx * r, -r * 0.9); ctx.lineTo(dx * r + r * 0.16, r * 0.1); ctx.lineTo(dx * r, r * 0.8); ctx.lineTo(dx * r - r * 0.16, r * 0.1); ctx.closePath(); ctx.fill(); }
  } else if (w === "boulder") {   // a lumpy rock with a crack
    rockPath(r * 0.85, 3); ctx.fill();
    ctx.strokeStyle = "#ff4d3a"; ctx.lineWidth = Math.max(1.5, r * 0.12); ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.1); ctx.lineTo(0, r * 0.15); ctx.lineTo(r * 0.3, -r * 0.4); ctx.stroke();
  } else if (w === "pulse") {   // an emitter with a burst
    ctx.beginPath(); ctx.arc(0, r * 0.2, r * 0.35, 0, TAU); ctx.fill();
    for (const a of [-0.5, 0, 0.5]) { ctx.beginPath(); ctx.moveTo(Math.sin(a) * r * 0.5, r * 0.2 - Math.cos(a) * r * 0.5); ctx.lineTo(Math.sin(a) * r * 0.95, r * 0.2 - Math.cos(a) * r * 0.95); ctx.stroke(); }
  } else if (w === "ring") {    // the ring with its three latches
    ctx.beginPath(); ctx.arc(0, 0, r * 0.75, 0, TAU); ctx.stroke();
    for (const a of [0, Math.PI / 2, Math.PI]) { ctx.save(); ctx.rotate(a); ctx.fillRect(r * 0.55, -r * 0.12, r * 0.4, r * 0.24); ctx.restore(); }
  } else if (w === "thorn") {   // two curved thorns
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * r * 0.15, -r * 0.95); ctx.quadraticCurveTo(sx * r * 0.65, -r * 0.1, sx * r * 0.45, r * 0.9);
      ctx.lineTo(sx * r * 0.2, r * 0.75); ctx.quadraticCurveTo(sx * r * 0.35, -r * 0.1, sx * r * 0.15, -r * 0.95); ctx.fill(); }
  } else if (w === "hive") {    // an egg with a crack
    ctx.beginPath(); ctx.ellipse(0, r * 0.08, r * 0.6, r * 0.82, 0, 0, TAU); ctx.stroke();
    ctx.lineWidth = Math.max(1.5, r * 0.12); ctx.beginPath(); ctx.moveTo(-r * 0.45, r * 0.05); ctx.lineTo(-r * 0.15, -r * 0.15); ctx.lineTo(0, r * 0.12); ctx.lineTo(r * 0.2, -r * 0.2); ctx.lineTo(r * 0.45, 0); ctx.stroke();
  } else if (w === "laser") {
    ctx.beginPath(); ctx.moveTo(-r * 0.3, -r * 0.9); ctx.lineTo(r * 0.2, -r * 0.1); ctx.lineTo(-r * 0.2, r * 0.1); ctx.lineTo(r * 0.3, r * 0.9); ctx.stroke();
  } else if (w === "missile") {
    ctx.beginPath(); ctx.moveTo(0, -r * 0.95); ctx.lineTo(r * 0.3, -r * 0.4); ctx.lineTo(r * 0.3, r * 0.5); ctx.lineTo(r * 0.6, r * 0.9);
    ctx.lineTo(-r * 0.6, r * 0.9); ctx.lineTo(-r * 0.3, r * 0.5); ctx.lineTo(-r * 0.3, -r * 0.4); ctx.closePath(); ctx.fill();
  } else if (w === "spread") {
    for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i / 4 - 0.5) * 1.3; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.75 + r * 0.35, r * 0.17, 0, TAU); ctx.fill(); }
    ctx.beginPath(); ctx.arc(0, r * 0.35, r * 0.2, 0, TAU); ctx.fill();

  ctx.restore();
}
// the fire buttons: dark metal with the weapon's mark, a ring around that empties with the ammo.
// An empty one goes dim until it has refilled enough for a shot
function drawFire() {
  if (trade.stage === "swapping") return;
  for (const b of fireButtons()) {
    if (b.r < 3) continue;
    const w = slotWeapon(b.i), Wp = WEAPONS[w], ammo = slotAmmo(b.i), ready = ammo >= 1, pressed = game.fire[b.i] !== null;
    const r = b.r * (pressed && ready ? 0.92 : 1);

    if (pressed && ready) {
      const gl = ctx.createRadialGradient(b.x, b.y, r * 0.8, b.x, b.y, r * 1.7);
      gl.addColorStop(0, hexA(Wp.color, 0.5)); gl.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(b.x, b.y, r * 1.7, 0, TAU); ctx.fill();
    }
    const bg = ctx.createRadialGradient(b.x - r * 0.3, b.y - r * 0.35, r * 0.1, b.x, b.y, r);
    bg.addColorStop(0, "#5a5a68"); bg.addColorStop(1, "#1d1d26");
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.9, 0, TAU); ctx.stroke();
    ctx.strokeStyle = Wp.color; ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.9, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(ammo / Wp.ammo, 0, 1)); ctx.stroke();
    weaponIcon(w, b.x, b.y, r * 0.42, ready ? "#ffffff" : "#9a9aa8");
    // SKARN's shards powered up by catches: ember dots under the icon, fading as the power runs out
    if (w === "spike" && game.trap && game.trap.power > 0) {
      const n = game.trap.power;
      ctx.globalAlpha = Math.min(1, game.trap.powerT / 3) * (0.75 + 0.25 * Math.sin(time * 6));
      for (let j = 0; j < n; j++) { ctx.fillStyle = "#ff8a5a"; ctx.beginPath(); ctx.arc(b.x + (j - (n - 1) / 2) * r * 0.24, b.y + r * 0.68, r * 0.08, 0, TAU); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    // button 3 just arrived: a sparkle ring around it
    if (b.i === 2 && game.loot && game.loot.show < 1) {

    }
    ctx.restore();
  }
}

// the magic button. Its look follows the ship's style: for the brass ship, a turning brass gear.
// Ready: turns slowly and glints. Used: spins fast. Recharging: almost still, dark, and its brass
// fills back in around the rim as it gets ready again
function drawMagic() {
  const M = magicOf(shipById(game.ship));
  if (!M || trade.stage === "swapping") return;
  const b = magicButton(), ready = game.magicCool <= 0, k = ready ? 1 : 1 - game.magicCool / M.cool;
  if (M.look === "tail") drawTailButton(b, M, ready, k);
  if (M.look === "grinder") drawGrinderButton(b, M, ready, k);
  if (M.look === "shatter") drawShatterButton(b, M, ready, k);
  if (M.look === "sun") drawSunButton(b, M, ready, k);
  if (M.look === "chain") drawChainButton(b, M, ready, k);
  if (M.look === "ink") drawInkButton(b, M, ready, k);
  if (M.look === "hammer") drawHammerButton(b, M, ready, k);
  if (M.look === "anchor") drawAnchorButton(b, M);
  if (M.look === "tint") drawTintButton(b, M, ready, k);
  if (M.look === "gear") {
    ctx.save(); ctx.translate(b.x, b.y);
    // a magic glow when ready
    if (ready) {
      const gl = ctx.createRadialGradient(0, 0, b.r * 0.6, 0, 0, b.r * 1.6);
      gl.addColorStop(0, `rgba(255,209,102,${0.28 + 0.12 * Math.sin(time * 3)})`); gl.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, b.r * 1.6, 0, TAU); ctx.fill();
    }
    ctx.rotate(game.gear);
    const teeth = 12, ro = b.r, ri = b.r * 0.8;
    const gearPath = () => {
      ctx.beginPath();
      for (let i = 0; i < teeth; i++) {
        const a = i * TAU / teeth, w = TAU / teeth;
        ctx.lineTo(Math.cos(a - w * 0.5) * ri, Math.sin(a - w * 0.5) * ri);
        ctx.lineTo(Math.cos(a - w * 0.22) * ro, Math.sin(a - w * 0.22) * ro);
        ctx.lineTo(Math.cos(a + w * 0.22) * ro, Math.sin(a + w * 0.22) * ro);
        ctx.lineTo(Math.cos(a + w * 0.5) * ri, Math.sin(a + w * 0.5) * ri);
      }
      ctx.closePath();
      ctx.moveTo(b.r * 0.32, 0); ctx.arc(0, 0, b.r * 0.32, 0, TAU, true);   // the hole in the middle
    };
    // dark iron gear underneath, brass on top up to how charged it is
    ctx.fillStyle = "#2c2a2e"; gearPath(); ctx.fill("evenodd");
    ctx.save();
    if (!ready) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, ro * 1.1, -game.gear - Math.PI / 2, -game.gear - Math.PI / 2 + TAU * k); ctx.closePath(); ctx.clip(); }
    const bg = ctx.createLinearGradient(-ro, -ro, ro, ro);
    bg.addColorStop(0, "#fff1c1"); bg.addColorStop(0.35, "#e0b060"); bg.addColorStop(0.7, "#a8762a"); bg.addColorStop(1, "#5e3f12");
    ctx.globalAlpha = ready ? 1 : 0.7; ctx.fillStyle = bg; gearPath(); ctx.fill("evenodd");
    ctx.restore();
    ctx.strokeStyle = "rgba(60,36,8,0.8)"; ctx.lineWidth = 1.5; gearPath(); ctx.stroke();
    // spokes and hub
    ctx.strokeStyle = ready ? "#8a5c1c" : "#4a4048"; ctx.lineWidth = b.r * 0.09;
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6; ctx.beginPath(); ctx.moveTo(Math.cos(a) * b.r * 0.34, Math.sin(a) * b.r * 0.34); ctx.lineTo(Math.cos(a) * ri * 0.92, Math.sin(a) * ri * 0.92); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, ri * 0.92, 0, TAU); ctx.stroke();
    ctx.rotate(-game.gear);
    // in the hole: a little puff of smoke (what the magic does)
    ctx.fillStyle = ready ? "rgba(235,235,245,0.95)" : "rgba(150,150,160,0.6)";
    for (const [x, y, r] of [[-0.1, 0.05, 0.13], [0.08, 0.06, 0.12], [0, -0.07, 0.14]]) { ctx.beginPath(); ctx.arc(x * b.r, y * b.r, r * b.r, 0, TAU); ctx.fill(); }
    // glints running round the rim when ready (the magic)
    if (ready) for (let i = 0; i < 3; i++) {
      const a = time * 2.2 + i * TAU / 3, s = b.r * 0.1 * (0.6 + 0.4 * Math.sin(time * 7 + i));
      ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 0.9; starShape(Math.cos(a) * ro * 1.08, Math.sin(a) * ro * 1.08, s);
    }
    ctx.restore();
  }
}

// TALUS's magic button: a cracked stone, with a dot for each piece-layer it has built (in that layer's color).
// Nothing built yet: dim. Ready with layers: the cracks glow red and pulse
function drawShatterButton(b, M, ready, k) {
  const T = game.talus || { stage: 0, colors: [] }, armed = ready && T.stage > 0;
  ctx.save(); ctx.translate(b.x, b.y);
  if (armed) {
    const gl = ctx.createRadialGradient(0, 0, b.r * 0.6, 0, 0, b.r * 1.7);
    gl.addColorStop(0, `rgba(255,77,58,${0.25 + 0.1 * T.stage / 5 + 0.1 * Math.sin(time * 5)})`); gl.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, b.r * 1.7, 0, TAU); ctx.fill();
  }
  const bg = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.35, b.r * 0.1, 0, 0, b.r);
  bg.addColorStop(0, "#5a4d44"); bg.addColorStop(1, "#1d1714");
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill();
  ctx.lineWidth = Math.max(3, b.r * 0.1); ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(255,77,58,0.15)"; ctx.beginPath(); ctx.arc(0, 0, b.r * 0.9, 0, TAU); ctx.stroke();
  ctx.strokeStyle = M.color; ctx.beginPath(); ctx.arc(0, 0, b.r * 0.9, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
  // the stone, cracked
  ctx.globalAlpha = armed ? 1 : 0.45;
  const g = ctx.createRadialGradient(-b.r * 0.15, -b.r * 0.2, 0, 0, 0, b.r * 0.55);
  g.addColorStop(0, "#f2e8d5"); g.addColorStop(1, "#9c8a74");
  ctx.fillStyle = g; rockPath(b.r * 0.52, 5); ctx.fill();
  ctx.strokeStyle = armed ? `rgba(255,77,58,${0.7 + 0.3 * Math.sin(time * 6)})` : "#6b5d52"; ctx.lineWidth = b.r * 0.06;
  ctx.beginPath(); ctx.moveTo(-b.r * 0.35, -b.r * 0.2); ctx.lineTo(-b.r * 0.05, b.r * 0.05); ctx.lineTo(b.r * 0.25, -b.r * 0.3);
  ctx.moveTo(-b.r * 0.05, b.r * 0.05); ctx.lineTo(b.r * 0.05, b.r * 0.38); ctx.stroke();
  // a dot for each layer built (5 places), in its color
  ctx.globalAlpha = 1;
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i - 2) * 0.42, x = Math.cos(a) * b.r * 0.72, y = Math.sin(a) * b.r * 0.72 + b.r * 1.38;
    ctx.fillStyle = i < T.stage ? T.colors[i] : "rgba(255,255,255,0.15)";
    ctx.beginPath(); ctx.arc(x, y - b.r * 1.38 - b.r * 0.0, b.r * 0.09, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
// LYTH's magic button: a steel ring with saw teeth. Ready and the enemy close enough: violet glow, teeth out.
// Ready but too far: the teeth stay in. Grinding: spins fast. Recharging: dim, its violet rim fills back in
function drawGrinderButton(b, M, ready, k) {
  const reach = ready && grindReach(), G = game.grind;
  ctx.save(); ctx.translate(b.x, b.y);
  if (reach || G) {
    const gl = ctx.createRadialGradient(0, 0, b.r * 0.6, 0, 0, b.r * 1.7);
    gl.addColorStop(0, `rgba(186,153,255,${0.35 + 0.15 * Math.sin(time * 6)})`); gl.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, b.r * 1.7, 0, TAU); ctx.fill();
  }
  const bg = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.35, b.r * 0.1, 0, 0, b.r);
  bg.addColorStop(0, "#4a5870"); bg.addColorStop(1, "#141f2d");
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill();
  ctx.lineWidth = Math.max(3, b.r * 0.1); ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(186,153,255,0.15)"; ctx.beginPath(); ctx.arc(0, 0, b.r * 0.9, 0, TAU); ctx.stroke();
  ctx.strokeStyle = M.color; ctx.beginPath(); ctx.arc(0, 0, b.r * 0.9, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
  // the toothed ring
  ctx.globalAlpha = ready || G ? 1 : 0.5;
  game.grindIcon = (game.grindIcon || 0) + frameDt * (G ? 14 : reach ? 2 : 0.4);
  ctx.rotate(game.grindIcon);
  const out = G ? 1 : reach ? 1 : 0.35, n = 12, r = b.r * 0.5;
  ctx.fillStyle = "#dfe8f2";
  for (let i = 0; i < n; i++) {
    ctx.save(); ctx.rotate(i / n * TAU);
    ctx.beginPath(); ctx.moveTo(-b.r * 0.07, -r); ctx.lineTo(b.r * 0.05, -r - b.r * 0.2 * out); ctx.lineTo(b.r * 0.07, -r); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.strokeStyle = "#a7b9cd"; ctx.lineWidth = b.r * 0.14; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = reach || G ? "#ba99ff" : "#8affff"; ctx.lineWidth = b.r * 0.04; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();

// VEXAR's magic button: a dark chitin shell with a curled, segmented stinger tail inside.
// Ready: lime glow and the tail sways. Out: the tail uncurls. Recharging: dim, its lime rim fills back in
function drawTailButton(b, M, ready, k) {
  ctx.save(); ctx.translate(b.x, b.y);
  if (ready) {
    const gl = ctx.createRadialGradient(0, 0, b.r * 0.6, 0, 0, b.r * 1.6);
    gl.addColorStop(0, `rgba(184,255,58,${0.25 + 0.12 * Math.sin(time * 3)})`); gl.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, b.r * 1.6, 0, TAU); ctx.fill();
  }
  const bg = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.35, b.r * 0.1, 0, 0, b.r);
  bg.addColorStop(0, "#2f5a22"); bg.addColorStop(0.7, "#10240f"); bg.addColorStop(1, "#050d05");
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill();
  // the rim: lime, filling back in while it recharges
  ctx.lineWidth = Math.max(3, b.r * 0.1); ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(184,255,58,0.15)"; ctx.beginPath(); ctx.arc(0, 0, b.r * 0.9, 0, TAU); ctx.stroke();
  ctx.strokeStyle = M.color; ctx.globalAlpha = ready ? 1 : 0.8;
  ctx.beginPath(); ctx.arc(0, 0, b.r * 0.9, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
  // the tail: plates along a spiral (curled when resting, opening out while the real tail is out)
  ctx.globalAlpha = ready ? 1 : 0.5;
  const open = game.tail ? Math.max(0, tailOut(M, game.tail.t)) : 0, sway = ready ? Math.sin(time * 2.5) * 0.15 : 0, n = 9;
  let last = null, prev = null;
  for (let j = n - 1; j >= 0; j--) {
    const u = j / (n - 1), a = -Math.PI * 0.6 + u * (4.2 - open * 2.4) + sway * u, rr = b.r * (0.55 - u * (0.38 - open * 0.25));
    const x = Math.cos(a) * rr - b.r * 0.05, y = Math.sin(a) * rr + b.r * 0.05, w = b.r * (0.2 - u * 0.12);
    const g = ctx.createRadialGradient(x - w * 0.3, y - w * 0.3, 0, x, y, w);
    g.addColorStop(0, "#d8ff5a"); g.addColorStop(0.5, "#3fae2a"); g.addColorStop(1, "#0f2a10");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, w, 0, TAU); ctx.fill();
    if (j === n - 1) last = { x, y }; if (j === n - 2) prev = { x, y };
  }
  ctx.restore();
  // the spiked ball at the tip
  if (last && prev) {
    const a = Math.atan2(last.y - prev.y, last.x - prev.x), r = b.r * 0.13;
    drawSpikeBall(b.x + last.x + Math.cos(a) * r * 1.2, b.y + last.y + Math.sin(a) * r * 1.2, r, time * 1.5, ready ? "#b8ff3a" : "#6f8a5a", "#2e7d1e", game.tail && game.tail.touch > 0);
  }
}

// the thrust button: white when full, through yellow, orange, red, purple, blue... to black, then gone
function drawThrust() {
  if (trade.stage === "swapping") return;
  const held = game.thrust !== null && !!game.stick;
  // fades away over 0.8 s when the fuel runs out, comes back when the tank has refilled enough
  // (a thumb still holding it keeps a dim stick for steering)
  game.btn = clamp(game.btn + (game.locked ? -1 : 1) * frameDt / 0.8, 0, 1);
  const fade = Math.max(game.btn, held ? 0.35 : 0);
  if (fade <= 0) return;
  const b = thrustButton(), st = shipStats(shipById(game.ship));
  const f = game.fuel / st.fuel, col = game.locked ? "#6c6c78" : fuelColor(f), pressed = game.thrust !== null;
  const r = b.r * (pressed ? 0.92 : 1) * (0.6 + 0.4 * fade);
  // the knob follows the thumb, up to 0.75 of the button's size
  let kx = 0, ky = 0;
  if (held) { const d = Math.hypot(game.stick.dx, game.stick.dy), m = Math.min(d, b.r * 0.75); if (d) { kx = game.stick.dx / d * m; ky = game.stick.dy / d * m; } }
  ctx.save(); ctx.globalAlpha = fade;
  // the stick's base: a ring with a soft dark middle (shows while held)
  if (held) {
    ctx.fillStyle = "rgba(10,12,32,0.45)"; ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.2, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.2 * STICK * 2, 0, TAU); ctx.stroke();

function updateDuel(dt) {
