// RIVET's moving parts: 12 frames over `ms`, each with the hull turn drawn into it (degrees, clockwise)
function mechFrames(name, ms, deg) {
  return Array.from({ length: 12 }, (_, i) => [name + "_" + String(i + 1).padStart(2, "0") + ".webp", i < 11 ? ms / 11 : 40, undefined, deg(i)]);
}
// the turn already drawn into the frame showing now (radians), so the hull is not turned twice; 0 for an ordinary frame
function bakedTurn(S, a) {
  if (!S || !S.anim || !a || !S.anim[a.seq]) return 0;
  const q = S.anim[a.seq], f = seqFrame(q, a.t);
  return f >= 0 && q[f][3] != null ? q[f][3] * Math.PI / 180 : 0;
}
// a numbered run of drawings: name_01.webp ... with each frame's ms, and cues on chosen frames ({ 10: "fire" })
function frames(name, count, ms, cues = {}) {
  return Array.from({ length: count }, (_, i) => {
    const n = i + 1, f = [name + "_" + String(n).padStart(2, "0") + ".webp", ms(n)];
    if (cues[n]) f.push(cues[n]);
    return f;
  });
}

function quarterTurn(vx, vy) { return { vx: -vy, vy: vx }; }
// ---- LARIAT's cable (lariat.js): the pull of a taut cable, and the release ----
// d: the ship's distance from the star's middle, rest: the cable's length, radial: the ship's speed toward the star.
// Only a taut cable pulls (d > rest): a spring, damped, up to maxPull. Returns the pull toward the star (>= 0)
function cablePull(d, rest, radial, spring, damping, maxPull) { return d <= rest ? 0 : Math.max(0, Math.min(maxPull, (d - rest) * spring - radial * damping)); }
// the release: a push of `boost` along the circle round the star, the way the ship is already going round (from rest:
// the way its nose leans), the rest of its speed kept, then all of it capped at `cap`.
// dx, dy: the ship from the star's middle; fx, fy: the nose's direction
function cableRelease(dx, dy, vx, vy, fx, fy, boost, cap) {
  const d = Math.hypot(dx, dy); if (!d) return { vx, vy };
  const tx = -dy / d, ty = dx / d, along = vx * tx + vy * ty;
  const sign = Math.sign(Math.abs(along) > boost * 0.067 ? along : fx * tx + fy * ty) || 1;   // (0.067 = the pack's 8 of 120)
  let nx = vx + tx * sign * boost, ny = vy + ty * sign * boost; const sp = Math.hypot(nx, ny);
  if (sp > cap) { nx *= cap / sp; ny *= cap / sp; }
  return { vx: nx, vy: ny };
}

// ---------- online: players meet on the server (Supabase Realtime: a broadcast room per kind: duel / trade) ----------
// The rooms speak Phoenix over a websocket. Two players pair up: one says "hi", the other "ask"s it, it answers "yes";
// then they talk only to each other ("msg"), keep it alive with "ping", and say "bye"
const rt = {
  ws: null, topic: null, name: null, peer: null, pending: null, pendingT: 0, ref: 0, joined: false, hiT: 0, lastHeard: 0, beatT: 0, pingT: 0, active: false,
  start(name) {
    this.stop(true);
    this.name = name; this.peer = null; this.pending = null; this.active = true; this.joined = false;
    this.topic = "realtime:spaceship-" + (name.startsWith("duel|") ? "duel" : "trade");
    const u = server.url.replace(/^http/, "ws") + "/realtime/v1/websocket?apikey=" + encodeURIComponent(server.key) + "&vsn=1.0.0";
    try { this.ws = new WebSocket(u); } catch (e) { window.shipLink("error", ""); return; }
    this.ws.onopen = () => this.out({ topic: this.topic, event: "phx_join", payload: { config: { broadcast: { self: false, ack: false }, presence: { key: "" }, private: false }, access_token: server.session && server.session.access_token }, join_ref: "1" });
    this.ws.onmessage = (e) => { let m = null; try { m = JSON.parse(e.data); } catch (er) { return; } this.got(m); };
    this.ws.onclose = () => { if (this.active && this.peer) window.shipLink("lost", ""); this.joined = false; };
    this.ws.onerror = () => {};
  },
  out(m) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify({ ...m, ref: String(++this.ref) })); },
  cast(p) { if (this.joined) this.out({ topic: this.topic, event: "broadcast", payload: { type: "broadcast", event: "m", payload: p }, join_ref: "1" }); },
  got(m) {
    if (m.event === "phx_reply" && m.topic === this.topic && !this.joined) { if (m.payload && m.payload.status === "ok") { this.joined = true; this.cast({ k: "hi", from: this.name }); } else window.shipLink("error", ""); return; }
    if (m.event !== "broadcast" || m.topic !== this.topic || !m.payload) return;
    const p = m.payload.payload;
    if (!p || p.from === this.name) return;
    if (p.to && p.to !== this.name) return;
    if (p.k === "hi" && !this.peer && !this.pending) { this.pending = p.from; this.pendingT = 2.5; this.cast({ k: "ask", from: this.name, to: p.from }); }
    else if (p.k === "ask" && (!this.peer || this.peer === p.from)) { this.cast({ k: "yes", from: this.name, to: p.from }); if (!this.peer) this.pair(p.from); }   // (yes first: then my first message comes after it)
    else if (p.k === "yes" && !this.peer && this.pending === p.from) this.pair(p.from);
    else if (p.from === this.peer) {
      this.lastHeard = performance.now();
      if (p.k === "msg") window.shipLink("message", p.data);
      else if (p.k === "bye") { this.peer = null; window.shipLink("lost", ""); }
    }
  },
  pair(who) { this.peer = who; this.pending = null; this.lastHeard = performance.now(); window.shipLink("connected", ""); },
  send(obj) { if (this.peer) this.cast({ k: "msg", from: this.name, to: this.peer, data: JSON.stringify(obj) }); },
  // every frame: say hi again while alone, give up on an "ask" with no answer, keep the line alive, notice a silent partner
  tick(dt) {
    if (!this.active) return;
    this.beatT -= dt; if (this.beatT <= 0) { this.beatT = 25; this.out({ topic: "phoenix", event: "heartbeat", payload: {} }); }
    if (!this.joined) return;
    if (this.pending) { this.pendingT -= dt; if (this.pendingT <= 0) this.pending = null; }
    if (!this.peer) { this.hiT -= dt; if (this.hiT <= 0) { this.hiT = 2; this.cast({ k: "hi", from: this.name }); } return; }
    this.pingT -= dt; if (this.pingT <= 0) { this.pingT = 2; this.cast({ k: "ping", from: this.name, to: this.peer }); }
    if (performance.now() - this.lastHeard > 7000) { this.peer = null; window.shipLink("lost", ""); }
  },
  stop(quiet) {
    if (this.peer && !quiet) this.cast({ k: "bye", from: this.name, to: this.peer });
    const ws = this.ws;
    if (ws) { try { if (this.joined) this.out({ topic: this.topic, event: "phx_leave", payload: {} }); } catch (e) {} setTimeout(() => { try { ws.close(); } catch (e) {} }, 200); }
    this.ws = null; this.peer = null; this.pending = null; this.joined = false; this.active = false;
  }
};

function updateSimTilt(dt) {
  if (tilt.have) return;
  const s = tilt.sim, k = 1 - Math.exp(-dt * 6);

  game.talus = { stage: 0, from: 0, t: 99, ring: 0, contact: false, colors: [] };   // TALUS starts as a seed again

// ---------- stars (three depths, for the window-into-space feel) ----------
let stars = [];
function makeStars() {
  stars = [];
  const n = Math.round((W * H) / 2600);
  for (let i = 0; i < n; i++) {
    const d = Math.random() < 0.6 ? 0 : Math.random() < 0.7 ? 1 : 2;
    stars.push({ x: Math.random() * W, y: Math.random() * H, d, r: [0.6, 1.1, 1.8][d] * (0.7 + Math.random() * 0.6), tw: Math.random() * 6.28 });
  }
}

// ---------- particles ----------
const parts = [];
function burst(x, y, n, colors, speed = 1, size = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.2 + Math.random()) * U * 0.6 * speed;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.6 + Math.random() * 0.9,
      c: colors[i % colors.length], s: (2 + Math.random() * 4) * size, star: Math.random() < 0.35 });
  }
}
// the same, at a place in space (it stays there while the camera moves)
// (dvx, dvy: the whole cloud drifts along, e.g. with the ship that blew up)
function burstAt(wx, wy, n, colors, speed = 1, size = 1, dvx = 0, dvy = 0) {
  const from = parts.length;
  burst(wx, wy, n, colors, speed, size);
  for (let i = from; i < parts.length; i++) { parts[i].w = true; parts[i].dx = dvx; parts[i].dy = dvy; }
}

let swipe = null;
cv.addEventListener("pointerdown", (e) => {
  audio.wake();
  if (trade.stage && tradeTap(e.clientX, e.clientY)) return;
  if ((game.stage === "fly" || picker.open) && hitLang(e.clientX, e.clientY)) { setLang(LANG === "he" ? "en" : "he"); audio.pop(); buzz(10); return; }   // עב / EN
  if (picker.open || camp.over) { pickerTap(e.clientX, e.clientY); return; }   // choosing a ship / the fleet is gone
  if (fleet.open) { fleetDown(e); return; }
  if (hangar.open) { hangarTap(e.clientX, e.clientY); return; }
  if (game.stage === "fly" && !trade.stage && !realDuel() && profile && hitFleetBtn(e.clientX, e.clientY)) { fleetOpen(false); audio.pop(); return; }
  if (game.stage === "fly" && !trade.stage && hitDuel(e.clientX, e.clientY)) { duelButton(); return; }
  if (game.stage === "fly" && !trade.stage && !realDuel() && hitHangar(e.clientX, e.clientY)) { hangar.open = true; hangar.t = 0; audio.pop(); return; }
  // the left thumb on the thrust button (another finger can still swipe at the same time)
  if (game.stage === "fly" && !game.locked && hitThrust(e.clientX, e.clientY)) {
    game.thrust = e.pointerId; buzz(12);
    game.stick = { ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };   // the joystick starts where the thumb lands
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  // the right thumb on a fire button (hold to keep firing); the gear = magic
  if (game.stage === "fly" && trade.stage !== "swapping") {
    if (hitMagic(e.clientX, e.clientY)) { game.magicFinger = e.pointerId; useMagic(whichMagic(e.clientX)); return; }
    const b = hitFire(e.clientX, e.clientY);
    if (b) {
      game.fire[b.i] = e.pointerId; buzz(8);
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      return;
    }
  }
  swipe ={ id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() };
  if (game.stage === "gift" && hitGift(e.clientX, e.clientY)) { tapGift(); swipe = null; return; }
  if (game.stage === "opening" && game.t > 2.2) { toFly(); swipe = null; return; }
  const p = zoomed(shipScreen());
  if (game.stage === "fly" && Math.hypot(e.clientX - p.x, e.clientY - p.y) < shipSize() * 0.6 * game.zoom) { game.card = 2.5; audio.pop(); }
});
// dragging the thumb on the thrust button steers, like a joystick
cv.addEventListener("pointermove", (e) => {
  if (fleet.open) { fleetMove(e); return; }
  if (e.pointerId !== game.thrust || !game.stick) return;
  game.stick.dx = e.clientX - game.stick.ox; game.stick.dy = e.clientY - game.stick.oy;
});
function fingerUp(e) {
  if (fleet.open && fleet.press) { fleetUp(e); return; }
  if (e.pointerId === game.magicFinger) { game.magicFinger = null; return; }
  if (e.pointerId === game.thrust) { game.thrust = null; game.stick = null; return; }
  const f = game.fire.indexOf(e.pointerId);
  if (f >= 0) { game.fire[f] = null; return; }
  if (!swipe || e.pointerId !== swipe.id) return;
  const up = swipe.y - e.clientY;
  // (trading is on the fleet page now, not by swiping up in flight)
  swipe = null;
}
cv.addEventListener("pointerup", fingerUp);

// on a computer: the space bar is the thrust button; Z, X, C are fire buttons 1, 2, 3
const FIRE_KEYS = ["z", "x", "c"];
addEventListener("keydown", (e) => {
  if (e.key === " " && game.stage === "fly" && !game.locked) game.thrust = "key";
  const f = FIRE_KEYS.indexOf(e.key.toLowerCase());
  if (f >= 0 && game.stage === "fly") game.fire[f] = "key";
  if (e.key.toLowerCase() === "v" && game.stage === "fly" && !e.repeat) { game.magicFinger = "key"; useMagic(); }   // V = the magic button
  if (e.key.toLowerCase() === "b" && game.stage === "fly" && !e.repeat) useMagic(1);   // B = the second magic (a split button)
});
addEventListener("keyup", (e) => {
  if (e.key.toLowerCase() === "v" && game.magicFinger === "key") game.magicFinger = null;
  if (e.key === " " && game.thrust === "key") game.thrust = null;
  const f = FIRE_KEYS.indexOf(e.key.toLowerCase());
  if (f >= 0 && game.fire[f] === "key") game.fire[f] = null;

  const finish = async (email, online) => {

    const fleet = kept && Array.isArray(kept.fleet) && kept.fleet.length === 3 && kept.fleet.every((id) => shipById(id)) ? kept.fleet : rollFleet(email);

    $("#su-go").textContent = "בודק…";

    if (!ok) { $("#su-go").textContent = "כניסה ✨"; err("הקוד לא נכון או שפג תוקפו"); return; }
    finish(email, true);
  };
}

// ======================================================================
//  THE GIFT (not used any more: the 3 ships come from the email)
// ======================================================================
function giftBox() { const s = U * 0.42; return { cx: W / 2, cy: H * 0.52, s }; }
function hitGift(x, y) { const g = giftBox(); return Math.abs(x - g.cx) < g.s * 0.65 && Math.abs(y - g.cy) < g.s * 0.7; }
function tapGift() {
  gift.taps++; gift.wob = 1; gift.squash = 1; gift.hint = 0;
  const g = giftBox();
  burst(g.cx, g.cy - g.s * 0.3, 8 + gift.taps * 6, ["#ffd166", "#c77dff", "#ffffff"], 0.6, 0.8);
  audio.tap(gift.taps); buzz(20 + gift.taps * 15);
  if (gift.taps >= GIFT_TAPS) {
    // decided now and saved at once, so closing the app mid-animation keeps the same ship
    game.ship = TRY_SHIP || chooseShip();
    saveShip(game.ship, "gift");
    game.stage = "opening"; game.t = 0;
    audio.open(); buzz(80);
  }
}
function toFly() {
  game.stage = "fly"; game.t = 0;
  game.fuel = shipStats(shipById(game.ship)).fuel; game.locked = false;
  fillAmmo();
  game.card = 0;
  spawnEnemy();
}

// ======================================================================
//  UPDATE
// ======================================================================
function shipSize() { return U * 0.26; }

function update(dt) {
  time += dt; game.t += dt;
  pipeDrain();
  updateKitFx(dt); if (HUD_KIT && !BOT) { kitPreloadFx(game.ship); if (enemy.ship) kitPreloadFx(enemy.ship); }
  tintStep();
  game.scramble = Math.max(0, (game.scramble || 0) - dt); enemy.scramble = Math.max(0, (enemy.scramble || 0) - dt);
  game.hacked = Math.max(0, (game.hacked || 0) - dt); game.charged = Math.max(0, (game.charged || 0) - dt); enemy.hacked = Math.max(0, (enemy.hacked || 0) - dt);
  if (game.stage === "fly") { if (!game.dead) recordPath(game, dt); if (enemy.on && !enemy.remote) recordPath(enemy, dt); }
  rewindTicks(dt); updatePuff(dt); chemSmoke(dt); updateCinder(dt); updateBombs(dt); updateDive(dt); updateForge(dt); updatePalisade(dt); updateGimbal(dt); updateLariat(dt); updateLenses(dt); game.flash = Math.max(0, (game.flash || 0) - dt);
  updateReso(dt); updatePollen(dt); updateFlip(dt); updateRail(dt); updateWaves(dt); updateMines(dt); updateSteam(dt); updateStorms(dt); updateRainbows(dt); updateGlitchMagic(dt); updateReprise(dt);
  updateSimTilt(dt);
  gift.wob = Math.max(0, gift.wob - dt * 2.2);
  gift.squash = Math.max(0, gift.squash - dt * 5);
  if (game.stage === "gift") gift.hint += dt;
  game.card = Math.max(0, game.card - dt);

  const c = controlFromTilt(tilt);
  game.side = c.side; game.fwd = c.fwd;


  if (game.stage === "opening") {
    if (game.t > 1.25 && !game.burstDone) {
      game.burstDone = true;
      const R = RARITY[shipById(game.ship).rarity], g = giftBox();
      burst(g.cx, H * 0.4, 50 + R.stars * 25, [R.color, "#ffffff", shipById(game.ship).hull], 1.2, 1.2);
      audio.reveal(R.stars); buzz(40 * R.stars);
    }
    if (game.t > 6) toFly();
  }
  if (game.stage === "arrive" && game.t > 0.9) { game.stage = "fly"; game.t = 0; spawnEnemy(); }

  game.shakeT = Math.max(0, game.shakeT - dt * 2.5);
  updateCosmos(dt);
  game.hurt = Math.max(0, game.hurt - dt); game.tankT = Math.max(0, (game.tankT || 0) - dt * 1.5);
  game.arriveT = Math.max(0, (game.arriveT || 0) - dt * 1.5);
  if (BOT) botThink(dt); else campTick(dt);
  if (game.stage === "fly" && trade.stage !== "swapping") {
    if (game.dead) {
      game.dead -= dt; game.thrust = null; game.stick = null; game.fire = [null, null, null];
      if (game.dead <= 0) {
        if (game.pick && !BOT) { game.dead = 0.01; if (!picker.open && !camp.over) openPicker("lost"); }   // choose the next ship first
        else respawnShip();
      }
    }
    else { flyShip(dt); updateMagic(dt); }
    updateEnemy(dt); updateWeapons(dt); if (!game.dead) updateCrate(dt);
  }
  updateTrade(dt);
  updateDuel(dt);
  if (hangar.open) hangar.t += dt;
  if (fleet.open) { fleet.t += dt; if (fleet.swapped) { fleet.swapped.t += dt; if (fleet.swapped.t > 1) fleet.swapped = null; } }
  if (game.stage === "signup") showSignup();
  bounty.t = Math.max(0, bounty.t - dt);
  rt.tick(dt);

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    if (p.w) { p.x += (p.dx || 0) * dt; p.y += (p.dy || 0) * dt; }
    if (p.life > p.max) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.exp(-dt * 2.5); p.vy *= Math.exp(-dt * 2.5);
  }
}

// The player's ship: the tilt points the nose, the left thumb fires the engine
function flyShip(dt) {
  if (game.rw) { rewindStep(game, dt); return; }   // their REPRISE sent me back in time: no steering
  const S = shipById(game.ship), st = shipStats(S);
  let target = null, turn = 0;
  if (STEER === "turn") turn = game.side;
  else { target = headingTarget(game); turn = Math.min(1, Math.hypot(game.side, game.fwd) * 2); }
  // the joystick wins over the tilt while the thumb is dragged out of the middle
  let sh = game.stick ? stickHeading(game.stick.dx, game.stick.dy, thrustButton().r) : null;
  if (BOT && botAI.head != null) sh = botAI.head;   // the computer player steers like a thumb on the joystick
  if (sh !== null) { target = sh; turn = 1; }
  if (game.scramble > 0) { if (target !== null) target = wrapAngle(target + Math.PI); turn = STEER === "turn" ? -turn : turn; }   // scrambled: reversed
  const wasEmpty = game.locked;
  // out of fuel: the engine stops, but a thumb still holding keeps steering, and the engine
  // starts again by itself once the tank has refilled enough
  if (soaking()) turn *= magicOf(S).steer;   // ORIAN drinking light: hard to steer
  if (S.magic === "inflate" && puffing(game)) turn *= MAGIC.inflate.turn;   // PUFF puffed up: turns slowly
  const anchored = anchoring();
  if (game.dash) {   // KRAAL's dash: it flies by itself (updateDash), past gravity and the engine
    game.x = (((game.x + game.vx * dt) % WW) + WW) % WW; game.y = (((game.y + game.vy * dt) % WH) + WH) % WH;
    return;
  }
  if (game.dive) return;   // BORER in its dive: it is moved by updateDive
  if (game.inked > 0) {   // covered in the other player's ink: no steering, no engine, drifting on (the planet bounces it)
    game.inked -= dt;
    const v = game.inkV || { vx: game.vx, vy: game.vy };
    const h = moveShip(game, S, { target: game.ang, turn: 0, thrust: false }, dt);
    if (h) game.inkV = { vx: game.vx, vy: game.vy }; else { game.vx = v.vx; game.vy = v.vy; game.inkV = v; }
    if (game.inked <= 0) game.inkV = null;
    return;
  }
  const hit = moveShip(game, S, anchored ? { target: game.ang, turn: 0, thrust: false } : { target, turn, thrust: game.thrust !== null }, dt);
  if (anchored) {   // ZORIAN's anchor: it stops, holds and spins; after `hold` seconds it lets go
    const M = magicOf(S), k = Math.exp(-dt * M.brake);
    game.vx *= k; game.vy *= k; game.ang = wrapAngle(game.ang + M.spin * dt);
    game.anchor.t += dt;
    if (game.anchor.t >= M.hold) { game.anchor = null; game.magicCool = M.cool; }
  }
  // LYTH: the engine vent plates slide open / shut (a sound only when it changes)
  const burning = game.thrust !== null && !game.locked;
  if (burning !== !!game.burning) { game.burning = burning; if (S.sfx) audio.sfx(S.sfx, burning ? "thrusters_open" : "thrusters_close", 0, 0.7); }
  if (game.locked && !wasEmpty) { if (game.thrust === "key") game.thrust = null; audio.empty(); buzz(120); }
  if (hit > U * 0.15) { audio.bump(); buzz(Math.min(70, hit / U * 50)); }

  // the camera: with an enemy around it looks at the middle between the two ships (like Star Control);
  // alone, it leads a little in the direction of flight
  const lk = 1 - Math.exp(-dt * 2);
  let tx = clamp(game.vx * 0.22, -W * 0.22, W * 0.22), ty = clamp(game.vy * 0.22, -H * 0.22, H * 0.22);
  if (enemyShown()) {
    const lim = 0.5 / ZOOM_MIN - 0.15;   // keep our own ship on screen even when fully zoomed out
    tx = clamp(wrapDelta(enemy.x - game.x, WW) / 2, -W * lim, W * lim);
    ty = clamp(wrapDelta(enemy.y - game.y, WH) / 2, -H * lim, H * lim);
  }
  game.lx = lerp(game.lx, tx, lk); game.ly = lerp(game.ly, ty, lk);
  // zoom out just enough to see the enemy too (zooming in again is slower and calmer)
  let z = 1;
  if (enemyShown()) {
    const e = toScreen(enemy.x, enemy.y), m = shipSize() * 0.7;
    const dx = Math.abs(e.x - W / 2), dy = Math.abs(e.y - H / 2);
    z = clamp(Math.min(dx ? (W / 2 - m) / dx : 1, dy ? (H / 2 - m) / dy : 1, 1), ZOOM_MIN, 1);
  }
  game.zoom = lerp(game.zoom, z, 1 - Math.exp(-dt * (z < game.zoom ? 3 : 1)));
  audio.engine(game.power);
}

// One step of flying for ANY ship (player or enemy): same rules for both, like in Star Control.
// c: { target: heading to turn to (or null), turn: how hard (0..1, or -1..1 when there is no target), thrust: true/false }
// returns how hard it hit something (0 = nothing)
function moveShip(o, S, c, dt) {
  const st = shipStats(S), size = shipSize();
  if (o === game && game.soak && game.soak.boost) { const M = magicOf(S); st.push *= M.boost; st.top *= M.boost; }   // ORIAN charged: twice as fast
  if (o === game && game.lassoed) st.turn *= ELASSO.turn;   // held by LARIAT's rope: turning takes twice as long
  // 1. turning, at the ship's own speed
  const before = o.ang;
  if (S.clockwork) {   // GIMBAL: no steering; the hull ticks round by itself like a clock
    o.clockT = (o.clockT || 0) + dt * 1000;
    const turned = gimbalTurn(o.clockT);
    o.ang = wrapAngle(o.ang + turned - (o.clockLast || 0)); o.clockLast = turned;
    if (o.clockT > 4920 * 50) { o.clockT -= 4920 * 50; o.clockLast = gimbalTurn(o.clockT); }   // (keeps the numbers small)
    o.spin = 0;   // (no banking: it does not steer)
  } else {
    if (c.target === null || c.target === undefined) o.ang += c.turn * st.turn * dt;
    else o.ang = turnToward(o.ang, c.target, st.turn * dt * c.turn);
    o.ang = wrapAngle(o.ang);
    o.spin = lerp(o.spin, wrapAngle(o.ang - before) / Math.max(dt, 0.001), 1 - Math.exp(-dt * 10));
  }

  // 2. engine and fuel (fuel fills back up by itself while the engine rests)
  //    a steam engine sometimes goes out for a moment: no push, only smoke
  const dead = S.steam && steamEngine(o, S, c.thrust && !o.locked && o.fuel > 0, dt);
  const f = fuelStep(o.fuel, o.locked, c.thrust && !dead, st, dt);
  const on = c.thrust && !dead && !o.locked && o.fuel > 0;
  // GIMBAL: the push goes the way the nose pointed when the thrust was pressed, for as long as it is held
  if (S.clockwork) { if (c.thrust && !o.pushHeld) o.pushAng = o.ang; o.pushHeld = !!c.thrust; }
  const pa = S.clockwork && o.pushAng != null ? o.pushAng : o.ang;
  if (on) {
    o.vx += Math.sin(pa) * st.push * U * dt;
    o.vy -= Math.cos(pa) * st.push * U * dt;
  }
  o.fuel = f.fuel; o.locked = f.locked;
  o.power = lerp(o.power, on ? 1 : 0, 1 - Math.exp(-dt * 10));

  if (o === game && game.tether && S.id === "lariat") larPull(o, dt);   // LARIAT on its cable
  if (o === game && game.elasso && enemy.on) larShipPull(o, enemy, game.elasso.rest, dt, ELASSO.tug);   // my LARIAT holding their ship
  if (o === game && game.lassoed && enemy.on) larShipPull(o, enemy, game.lassoed.rest, dt, ELASSO.drag);   // my ship held by their LARIAT
  // 3. the planet in the middle pulls (nearest way round, since space wraps)
  const R = planetR();
  const dx = wrapDelta(o.x - WW / 2, WW), dy = wrapDelta(o.y - WH / 2, WH);
  const g = gravityAt(dx, dy, U, R, body().pull);
  o.vx += g.ax * dt; o.vy += g.ay * dt;

  // 4. no air in space: the ship keeps flying, up to its top speed
  const sp = Math.hypot(o.vx, o.vy), top = st.top * U * (o === game && game.puffJet ? MAGIC.inflate.jetTop : 1);   // (PUFF let go: faster)
  if (sp > top) { const k = lerp(1, top / sp, 1 - Math.exp(-dt * 4)); o.vx *= k; o.vy *= k; }
  o.x += o.vx * dt; o.y += o.vy * dt;
  o.x = ((o.x % WW) + WW) % WW; o.y = ((o.y % WH) + WH) % WH;

  // 5. bounce off the planet. Stars, black holes and lava burn a ship that touches them (yours: health; see touchBurn)
  o.hitCool = Math.max(0, (o.hitCool || 0) - dt);
  const d = Math.hypot(dx, dy), touch = R + size * 0.32;
  if (o === game) {
    const touching = d < touch + size * 0.08;
    if (myStarTouch(touching)) return 0;   // a BORER's bomb was waiting in the star: shattered
    if (S.grows) talusContact(touching);
    else if (touching && !S.starProof) touchBurn(dt);   // (starProof: BORER and ORIAN only bounce)
  } else if (o === enemy && !enemy.remote) enemyStarTouch(d < touch + size * 0.08);
  let hit = 0;
  if (d < touch) {
    const nx = dx / (d || 1), ny = dy / (d || 1), vn = o.vx * nx + o.vy * ny;
    o.x += nx * (touch - d); o.y += ny * (touch - d);
    if (vn < 0) {
      o.vx -= 1.6 * vn * nx; o.vy -= 1.6 * vn * ny;
      if (-vn > U * 0.15 && !o.hitCool) {
        o.hitCool = 0.3; hit = -vn;
        const p = toScreen(o.x - nx * size * 0.3, o.y - ny * size * 0.3);
        burst(p.x, p.y, 12, ["#ffffff", S.trim, "#b8a3ff"], 0.45, 0.7);
      }
    }
  }
  return hit;
}

// ---------- the steam engine (mechanical ships) ----------
// Runs every moment for a ship with  steam: true.  running = the engine is being fired.
// Returns true while the fire is out (the engine gives no push, only smoke).
function steamEngine(o, S, running, dt) {
  const me = o === game, R = Math.random;
  o.sputter = Math.max(0, (o.sputter || 0) - dt);
  if (running) {
    // just lit: it often bangs
    if (!o.wasRunning && R() < 0.3) backfire(o, S, me);
    if (o.sputter <= 0 && R() < STEAM.dies * dt) {
      o.sputter = STEAM.out[0] + R() * (STEAM.out[1] - STEAM.out[0]);   // the fire goes out
      if (me) { audio.sputter(); buzz(40); }
    } else if (o.sputter <= 0 && R() < STEAM.backfire * dt) backfire(o, S, me);
    if (me && R() < STEAM.creak * dt) audio.creak();
    // out: thick puffs of smoke; burning: a little steam now and then
    if (R() < (o.sputter > 0 ? 14 : 3) * dt) for (const e of exhausts(o, S)) smokeAt(e.x, e.y, o, S, o.sputter > 0 ? 1 : 0.5);
  }
  // hard turns make the old frame groan
  if (me && Math.abs(o.spin) > 2.5 && R() < 0.5 * dt) audio.creak();
  o.wasRunning = running;
  return o.sputter > 0;
}
function backfire(o, S, me) {
  const ex = exhausts(o, S), e = ex[Math.floor(Math.random() * ex.length)];
  const bx = -Math.sin(o.ang) * U * 0.5, by = Math.cos(o.ang) * U * 0.5;   // the blast shoots out the back
  burstAt(e.x, e.y, 14, ["#ffffff", "#ffd166", "#ff8c1a", "#ff4d00"], 0.35, 1, o.vx + bx * 0.3, o.vy + by * 0.3);
  smokeAt(e.x, e.y, o, S, 1.2);
  if (me) { audio.backfire(); buzz(70); }
}
// where the engines are, in space, right now
function exhausts(o, S) {
  const size = shipSize();
  return S.nozzles.map((ex, n) => {
    const p = rotatePt(ex * size, ((S.engineYs ? S.engineYs[n] : S.engineY) + 0.05) * size, o.ang);
    return { x: o.x + p.x, y: o.y + p.y };
  });
}
// one puff of smoke behind a ship. big: 1 = a normal puff; the smoke screen uses bigger, darker, longer ones
function smokeAt(x, y, o, S, big = 1, life = 1.6, chem = false) {
  const back = U * 0.25 * (0.5 + Math.random()), a = o.ang + (Math.random() - 0.5) * 0.9;
  const g = 70 + Math.round(Math.random() * 50);

          const n = game.trap.power; ctx.save(); ctx.globalAlpha = Math.min(1, game.trap.powerT / 3) * (0.75 + 0.25 * Math.sin(time * 6));
          for (let j = 0; j < n; j++) { ctx.fillStyle = "#ff8a5a"; ctx.beginPath(); ctx.arc(x + (j - (n - 1) / 2) * r * 0.24, y + r * 0.72, r * 0.08, 0, TAU); ctx.fill(); }
          ctx.restore(); } : null;
      const o = { pressed, ready, fill: ammo / Wp.ammo, ring: b.i === 2 ? Wp.color : null };
      if (b.i === 2) o.draw = extra; else if (extra) o.after = extra;
      if (drawKitButton(game.ship, slot, b, o)) {
        if (o.after) o.after(b.x, b.y, b.r);
        if (b.i === 2 && game.loot && game.loot.show < 1) {   // just picked up: a sparkle ring
          ctx.save(); ctx.globalAlpha = 1 - game.loot.show; ctx.strokeStyle = Wp.color; ctx.lineWidth = 3;
          octagonPath(b.x, b.y, b.r * (1.2 + game.loot.show), 1); ctx.stroke(); ctx.restore();
        }
        continue;
      }
    }
    const r = b.r * (pressed && ready ? 0.92 : 1);
    ctx.save(); ctx.globalAlpha = ready ? 1 : 0.45;
    if (pressed && ready) {
      const gl = ctx.createRadialGradient(b.x, b.y, r * 0.8, b.x, b.y, r * 1.7);
      gl.addColorStop(0, hexA(Wp.color, 0.5)); gl.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(b.x, b.y, r * 1.7, 0, TAU); ctx.fill();
    }
    const bg = ctx.createRadialGradient(b.x - r * 0.3, b.y - r * 0.35, r * 0.1, b.x, b.y, r);
    bg.addColorStop(0, "#5a5a68"); bg.addColorStop(1, "#1d1d26");
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill();
    // ammo ring
    ctx.lineWidth = Math.max(3, r * 0.1); ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.9, 0, TAU); ctx.stroke();
    ctx.strokeStyle = Wp.color; ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.9, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(ammo / Wp.ammo, 0, 1)); ctx.stroke();
    weaponIcon(w, b.x, b.y, r * 0.42, ready ? "#ffffff" : "#9a9aa8");
    // SKARN's shards powered up by catches: ember dots under the icon, fading as the power runs out
    if (w === "spike" && game.trap && game.trap.power > 0) {
      const n = game.trap.power;
      ctx.globalAlpha = Math.min(1, game.trap.powerT / 3) * (0.75 + 0.25 * Math.sin(time * 6));
      for (let j = 0; j < n; j++) { ctx.fillStyle = "#ff8a5a"; ctx.beginPath(); ctx.arc(b.x + (j - (n - 1) / 2) * r * 0.24, b.y + r * 0.68, r * 0.08, 0, TAU); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    // button 3 just arrived: a sparkle ring around it
    if (b.i === 2 && game.loot && game.loot.show < 1) {
      ctx.globalAlpha = 1 - game.loot.show; ctx.strokeStyle = Wp.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, r * (1 + game.loot.show), 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
}

// the magic button. Its look follows the ship's style: for the brass ship, a turning brass gear.
// Ready: turns slowly and glints. Used: spins fast. Recharging: almost still, dark, and its brass
// fills back in around the rim as it gets ready again
function drawMagic() {
  const S = shipById(game.ship), M = magicOf(S);
  if (!M || trade.stage === "swapping") return;
  const b = magicButton(), ready = game.magicCool <= 0, k = ready ? 1 : 1 - game.magicCool / M.cool;
  if (game.zombie) { drawZombieMagicButton(b); return; }   // a zombie has no magic
  if (S.magic2) {   // split in two: each half its own magic and its own recharge
    const M2 = MAGIC[S.magic2], r = b.r * 0.66, c2 = game.magicCool2 || 0;
    drawMagicButton({ x: b.x - r * 1.02, y: b.y, r }, M, ready, k);
    drawMagicButton({ x: b.x + r * 1.02, y: b.y, r }, M2, c2 <= 0, c2 <= 0 ? 1 : 1 - c2 / M2.cool);
    return;
  }
  drawMagicButton(b, M, ready, k);
}
function drawMagicButton(b, M, ready, k) {
  // the kit's magic button: plate, icon, the recharge as a ring and a dark sweep; a corner mark for ships that count something
  const S = shipById(game.ship);
  if (kitOf(S)) {
    const used = (S.id === "drakon" && game.splitUsed && !game.bomb) ||   // DRAKON's magic is once a life
      (S.id === "gimbal" && Math.hypot(game.vx, game.vy) < MAGIC.momentum.min * gimU()) ||   // GIMBAL's only works while moving
      (S.id === "lariat" && !game.tether && !game.elasso);   // LARIAT's ram only with the rope round the enemy or the star
    const B = magicBadge(S) || {};
    if (drawKitButton(game.ship, "magic", b, { pressed: game.magicFinger != null, ready: ready && !used, fill: used ? 0 : k, glow: true, badge: B.t, badgeColor: B.c })) return;
  }
  if (M.look === "tail") drawTailButton(b, M, ready, k);
  if (M.look === "grinder") drawGrinderButton(b, M, ready, k);
  if (M.look === "shatter") drawShatterButton(b, M, ready, k);
  if (M.look === "sun") drawSunButton(b, M, ready, k);
  if (M.look === "chain") drawChainButton(b, M, ready, k);
  if (M.look === "ink") drawInkButton(b, M, ready, k);
  if (M.look === "hammer") drawHammerButton(b, M, ready, k);
  if (M.look === "anchor") drawAnchorButton(b, M);
  if (M.look === "tint") drawTintButton(b, M, ready, k);
  if (M.look === "waves") drawWavesButton(b, M, ready, k);
  if (M.look === "pollen") drawPollenButton(b, M, ready, k);
  if (M.look === "flip") drawFlipButton(b, M, ready, k);
  if (M.look === "steam") drawSteamButton(b, M, ready, k);
  if (M.look === "vshield" || M.look === "slip") drawGlitchMagicButton(b, M, ready, k);
  if (M.look === "reassemble") drawRepriseButton(b, M, ready, k);
  if (M.look === "inflate") drawPuffButton(b, M, ready, k);
  if (M.look === "dash") drawDashButton(b, M, ready, k);
  if (M.look === "split") drawSplitButton(b, M);
  if (M.look === "starmine") drawStarMineButton(b, M, ready, k);
  if (M.look === "lens") drawLensButton(b, M, ready, k);
  if (M.look === "ceramic") drawCeramicButton(b, M, ready, k);
  if (M.look === "rainbow") drawRainbowButton(b, M, ready, k);
  if (M.look === "gear") {
    ctx.save(); ctx.translate(b.x, b.y);
    // a magic glow when ready
    if (ready) {
      const gl = ctx.createRadialGradient(0, 0, b.r * 0.6, 0, 0, b.r * 1.6);
      gl.addColorStop(0, `rgba(255,209,102,${0.28 + 0.12 * Math.sin(time * 3)})`); gl.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, b.r * 1.6, 0, TAU); ctx.fill();
    }
    ctx.rotate(game.gear);
    const teeth = 12, ro = b.r, ri = b.r * 0.8;
    const gearPath = () => {
      ctx.beginPath();
      for (let i = 0; i < teeth; i++) {
        const a = i * TAU / teeth, w = TAU / teeth;
        ctx.lineTo(Math.cos(a - w * 0.5) * ri, Math.sin(a - w * 0.5) * ri);
        ctx.lineTo(Math.cos(a - w * 0.22) * ro, Math.sin(a - w * 0.22) * ro);
        ctx.lineTo(Math.cos(a + w * 0.22) * ro, Math.sin(a + w * 0.22) * ro);
        ctx.lineTo(Math.cos(a + w * 0.5) * ri, Math.sin(a + w * 0.5) * ri);
      }
      ctx.closePath();
      ctx.moveTo(b.r * 0.32, 0); ctx.arc(0, 0, b.r * 0.32, 0, TAU, true);   // the hole in the middle
    };
    // dark iron gear underneath, brass on top up to how charged it is
    ctx.fillStyle = "#2c2a2e"; gearPath(); ctx.fill("evenodd");
    ctx.save();
    if (!ready) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, ro * 1.1, -game.gear - Math.PI / 2, -game.gear - Math.PI / 2 + TAU * k); ctx.closePath(); ctx.clip(); }
    const bg = ctx.createLinearGradient(-ro, -ro, ro, ro);
    bg.addColorStop(0, "#fff1c1"); bg.addColorStop(0.35, "#e0b060"); bg.addColorStop(0.7, "#a8762a"); bg.addColorStop(1, "#5e3f12");
    ctx.globalAlpha = ready ? 1 : 0.7; ctx.fillStyle = bg; gearPath(); ctx.fill("evenodd");
    ctx.restore();
    ctx.strokeStyle = "rgba(60,36,8,0.8)"; ctx.lineWidth = 1.5; gearPath(); ctx.stroke();
    // spokes and hub
    ctx.strokeStyle = ready ? "#8a5c1c" : "#4a4048"; ctx.lineWidth = b.r * 0.09;
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6; ctx.beginPath(); ctx.moveTo(Math.cos(a) * b.r * 0.34, Math.sin(a) * b.r * 0.34); ctx.lineTo(Math.cos(a) * ri * 0.92, Math.sin(a) * ri * 0.92); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, ri * 0.92, 0, TAU); ctx.stroke();
    ctx.rotate(-game.gear);
    // in the hole: a little puff of smoke (what the magic does)
    ctx.fillStyle = ready ? "rgba(235,235,245,0.95)" : "rgba(150,150,160,0.6)";
    for (const [x, y, r] of [[-0.1, 0.05, 0.13], [0.08, 0.06, 0.12], [0, -0.07, 0.14]]) { ctx.beginPath(); ctx.arc(x * b.r, y * b.r, r * b.r, 0, TAU); ctx.fill(); }
    // glints running round the rim when ready (the magic)
    if (ready) for (let i = 0; i < 3; i++) {
      const a = time * 2.2 + i * TAU / 3, s = b.r * 0.1 * (0.6 + 0.4 * Math.sin(time * 7 + i));
      ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 0.9; starShape(Math.cos(a) * ro * 1.08, Math.sin(a) * ro * 1.08, s);
    }
    ctx.restore();
  }
}

// TALUS's magic button: a cracked stone, with a dot for each piece-layer it has built (in that layer's color).
// Nothing built yet: dim. Ready with layers: the cracks glow red and pulse
function drawShatterButton(b, M, ready, k) {
  const T = game.talus || { stage: 0, colors: [] }, armed = ready && T.stage > 0;
  ctx.save(); ctx.translate(b.x, b.y);
  if (armed) {
    const gl = ctx.createRadialGradient(0, 0, b.r * 0.6, 0, 0, b.r * 1.7);
    gl.addColorStop(0, `rgba(255,77,58,${0.25 + 0.1 * T.stage / 5 + 0.1 * Math.sin(time * 5)})`); gl.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, b.r * 1.7, 0, TAU); ctx.fill();
  }
  const bg = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.35, b.r * 0.1, 0, 0, b.r);
  bg.addColorStop(0, "#5a4d44"); bg.addColorStop(1, "#1d1714");
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill();
  ctx.lineWidth = Math.max(3, b.r * 0.1); ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(255,77,58,0.15)"; ctx.beginPath(); ctx.arc(0, 0, b.r * 0.9, 0, TAU); ctx.stroke();
  ctx.strokeStyle = M.color; ctx.beginPath(); ctx.arc(0, 0, b.r * 0.9, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
  // the stone, cracked
  ctx.globalAlpha = armed ? 1 : 0.45;
  const g = ctx.createRadialGradient(-b.r * 0.15, -b.r * 0.2, 0, 0, 0, b.r * 0.55);
  g.addColorStop(0, "#f2e8d5"); g.addColorStop(1, "#9c8a74");
  ctx.fillStyle = g; rockPath(b.r * 0.52, 5); ctx.fill();
  ctx.strokeStyle = armed ? `rgba(255,77,58,${0.7 + 0.3 * Math.sin(time * 6)})` : "#6b5d52"; ctx.lineWidth = b.r * 0.06;
  ctx.beginPath(); ctx.moveTo(-b.r * 0.35, -b.r * 0.2); ctx.lineTo(-b.r * 0.05, b.r * 0.05); ctx.lineTo(b.r * 0.25, -b.r * 0.3);
  ctx.moveTo(-b.r * 0.05, b.r * 0.05); ctx.lineTo(b.r * 0.05, b.r * 0.38); ctx.stroke();
  // a dot for each layer built (5 places), in its color
  ctx.globalAlpha = 1;
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i - 2) * 0.42, x = Math.cos(a) * b.r * 0.72, y = Math.sin(a) * b.r * 0.72 + b.r * 1.38;
    ctx.fillStyle = i < T.stage ? T.colors[i] : "rgba(255,255,255,0.15)";
    ctx.beginPath(); ctx.arc(x, y - b.r * 1.38 - b.r * 0.0, b.r * 0.09, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
// LYTH's magic button: a steel ring with saw teeth. Ready and the enemy close enough: violet glow, teeth out.
// Ready but too far: the teeth stay in. Grinding: spins fast. Recharging: dim, its violet rim fills back in
function drawGrinderButton(b, M, ready, k) {
  const reach = ready && grindReach(), G = game.grind;
  ctx.save(); ctx.translate(b.x, b.y);
  if (reach || G) {
    const gl = ctx.createRadialGradient(0, 0, b.r * 0.6, 0, 0, b.r * 1.7);
    gl.addColorStop(0, `rgba(186,153,255,${0.35 + 0.15 * Math.sin(time * 6)})`); gl.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, b.r * 1.7, 0, TAU); ctx.fill();
  }
  const bg = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.35, b.r * 0.1, 0, 0, b.r);
  bg.addColorStop(0, "#4a5870"); bg.addColorStop(1, "#141f2d");
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill();
  ctx.lineWidth = Math.max(3, b.r * 0.1); ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(186,153,255,0.15)"; ctx.beginPath(); ctx.arc(0, 0, b.r * 0.9, 0, TAU); ctx.stroke();
  ctx.strokeStyle = M.color; ctx.beginPath(); ctx.arc(0, 0, b.r * 0.9, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
  // the toothed ring
  ctx.globalAlpha = ready || G ? 1 : 0.5;
  game.grindIcon = (game.grindIcon || 0) + frameDt * (G ? 14 : reach ? 2 : 0.4);
  ctx.rotate(game.grindIcon);
  const out = G ? 1 : reach ? 1 : 0.35, n = 12, r = b.r * 0.5;
  ctx.fillStyle = "#dfe8f2";
  for (let i = 0; i < n; i++) {
    ctx.save(); ctx.rotate(i / n * TAU);
    ctx.beginPath(); ctx.moveTo(-b.r * 0.07, -r); ctx.lineTo(b.r * 0.05, -r - b.r * 0.2 * out); ctx.lineTo(b.r * 0.07, -r); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.strokeStyle = "#a7b9cd"; ctx.lineWidth = b.r * 0.14; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  ctx.strokeStyle = reach || G ? "#ba99ff" : "#8affff"; ctx.lineWidth = b.r * 0.04; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  ctx.restore();
}
// VEXAR's magic button: a dark chitin shell with a curled, segmented stinger tail inside.
// Ready: lime glow and the tail sways. Out: the tail uncurls. Recharging: dim, its lime rim fills back in
function drawTailButton(b, M, ready, k) {
  ctx.save(); ctx.translate(b.x, b.y);
  if (ready) {
    const gl = ctx.createRadialGradient(0, 0, b.r * 0.6, 0, 0, b.r * 1.6);
    gl.addColorStop(0, `rgba(184,255,58,${0.25 + 0.12 * Math.sin(time * 3)})`); gl.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, 0, b.r * 1.6, 0, TAU); ctx.fill();
  }
  const bg = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.35, b.r * 0.1, 0, 0, b.r);
  bg.addColorStop(0, "#2f5a22"); bg.addColorStop(0.7, "#10240f"); bg.addColorStop(1, "#050d05");
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill();
  // the rim: lime, filling back in while it recharges
  ctx.lineWidth = Math.max(3, b.r * 0.1); ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(184,255,58,0.15)"; ctx.beginPath(); ctx.arc(0, 0, b.r * 0.9, 0, TAU); ctx.stroke();
  ctx.strokeStyle = M.color; ctx.globalAlpha = ready ? 1 : 0.8;
  ctx.beginPath(); ctx.arc(0, 0, b.r * 0.9, -Math.PI / 2, -Math.PI / 2 + TAU * k); ctx.stroke();
  // the tail: plates along a spiral (curled when resting, opening out while the real tail is out)
  ctx.globalAlpha = ready ? 1 : 0.5;
  const open = game.tail ? Math.max(0, tailOut(M, game.tail.t)) : 0, sway = ready ? Math.sin(time * 2.5) * 0.15 : 0, n = 9;
  let last = null, prev = null;
  for (let j = n - 1; j >= 0; j--) {
    const u = j / (n - 1), a = -Math.PI * 0.6 + u * (4.2 - open * 2.4) + sway * u, rr = b.r * (0.55 - u * (0.38 - open * 0.25));
    const x = Math.cos(a) * rr - b.r * 0.05, y = Math.sin(a) * rr + b.r * 0.05, w = b.r * (0.2 - u * 0.12);
    const g = ctx.createRadialGradient(x - w * 0.3, y - w * 0.3, 0, x, y, w);
    g.addColorStop(0, "#d8ff5a"); g.addColorStop(0.5, "#3fae2a"); g.addColorStop(1, "#0f2a10");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, w, 0, TAU); ctx.fill();
    if (j === n - 1) last = { x, y }; if (j === n - 2) prev = { x, y };
  }
  ctx.restore();
  // the spiked ball at the tip
  if (last && prev) {
    const a = Math.atan2(last.y - prev.y, last.x - prev.x), r = b.r * 0.13;
    drawSpikeBall(b.x + last.x + Math.cos(a) * r * 1.2, b.y + last.y + Math.sin(a) * r * 1.2, r, time * 1.5, ready ? "#b8ff3a" : "#6f8a5a", "#2e7d1e", game.tail && game.tail.touch > 0);
  }
}

// the thrust button: white when full, through yellow, orange, red, purple, blue... to black, then gone
function drawThrust() {
  if (trade.stage === "swapping") return;
  const held = game.thrust !== null && !!game.stick;
  // fades away over 0.8 s when the fuel runs out, comes back when the tank has refilled enough
  // (a thumb still holding it keeps a dim stick for steering)
  game.btn = clamp(game.btn + (game.locked ? -1 : 1) * frameDt / 0.8, 0, 1);
  const fade = Math.max(game.btn, held ? 0.35 : 0);
  if (fade <= 0) return;
  const b = thrustButton(), st = shipStats(shipById(game.ship));
  const f = game.fuel / st.fuel, col = game.locked ? "#6c6c78" : fuelColor(f), pressed = game.thrust !== null;
  const r = b.r * (pressed ? 0.92 : 1) * (0.6 + 0.4 * fade);
  // the knob follows the thumb, up to 0.75 of the button's size
  let kx = 0, ky = 0;
  if (held) { const d = Math.hypot(game.stick.dx, game.stick.dy), m = Math.min(d, b.r * 0.75); if (d) { kx = game.stick.dx / d * m; ky = game.stick.dy / d * m; } }
  ctx.save(); ctx.globalAlpha = fade;
  // the stick's base: a ring with a soft dark middle (shows while held)
  if (held) {
    ctx.fillStyle = "rgba(10,12,32,0.45)"; ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.2, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.2 * STICK * 2, 0, TAU); ctx.stroke();
  }
  const x = b.x + kx, y = b.y + ky;
  // the kit's button: its plate is the knob, the ring round it is the fuel (white -> black, as before)
  if (kitOf(shipById(game.ship)) && drawKitButton(game.ship, "thrust", { x, y, r: b.r * (0.6 + 0.4 * fade) },
    { pressed, ready: !game.locked, fill: f, ring: col, iconAng: game.ang })) { ctx.restore(); return; }
  // glow in its own color while pressed
  if (pressed && !game.locked) {
    const gl = ctx.createRadialGradient(x, y, r * 0.8, x, y, r * 1.7);
    gl.addColorStop(0, hexA(col, 0.55)); gl.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, r * 1.7, 0, TAU); ctx.fill();
  }
  const bg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
  bg.addColorStop(0, shade(col, 0.35)); bg.addColorStop(1, col);
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 2; ctx.stroke();
  // a flame mark that points where the nose points, dark on a light button and light on a dark one
  const n = parseInt(col.slice(1), 16), light = ((n >> 16) * 0.3 + ((n >> 8) & 255) * 0.59 + (n & 255) * 0.11) > 140;
  ctx.fillStyle = light ? "rgba(20,20,40,0.75)" : "rgba(255,255,255,0.8)";
  ctx.translate(x, y); ctx.rotate(game.ang);
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.45);
  ctx.quadraticCurveTo(r * 0.42, r * 0.05, 0, r * 0.42);
  ctx.quadraticCurveTo(-r * 0.42, r * 0.05, 0, -r * 0.45);
  ctx.fill();
  ctx.restore();
}

// ======================================================================

// ======================================================================
//  THE COMPUTER PLAYER
//  Playing alone, the opponent is this same game running a second time inside the page (a hidden frame named

// ---- inside the computer player's copy ----

    botAI.lvl = c.lvl; botAI.left = c.fleet.slice(); botRelease();

// ======================================================================
//  PLAYING AGAINST THE COMPUTER: two fleets, levels

const camp = { off: false, lvl: 1, mine: [], theirs: [], lost: [], left: [], over: false, wait: 1.5, banner: 0 };

// ---- what the player sees of the match ----
